  // ============ ARCHIVE ============
  function archiveWeek(weekId){
    const week = board.weeks.find(w=>w.id===weekId);
    if(!week) return;
    reconcileCellOrder(board); // make sure cellOrder is current before snapshotting
    const weekCol = { weekId, dayIdx:null, key:weekId, week };

    const districtsSnapshot = board.districts.map(d=>{
      const orderArr = (board.cellOrder[weekId] && board.cellOrder[weekId][d.id]) || [];
      const techsSnapshot = orderArr.map(tid=>{
        const t = board.techs.find(x=>x.id===tid);
        if(!t) return null;
        const p = getPlacement(weekId, tid);
        return { techId: t.id, name: t.name, role: t.role, note: p.note||'' };
      }).filter(Boolean);
      return { districtId: d.id, label: d.label, note: getCellNote(weekCol, d.id), techs: techsSnapshot };
    });

    // day-specific changes and day notes travel with the archived week
    const dayOverrides = {}, dayNotes = {};
    for(let i=0; i<DAYS_PER_WEEK; i++){
      const o = board.dayPlacements[weekId+':'+i];
      if(o && Object.keys(o).length) dayOverrides[i] = JSON.parse(JSON.stringify(o));
      const n = board.cellNotes[weekId+':'+i];
      if(n && Object.keys(n).length) dayNotes[i] = JSON.parse(JSON.stringify(n));
    }

    board.archive.push({
      id: uid(),
      date: week.date,
      label: week.date ? formatWeekLabel(week.date) : 'Undated week',
      archivedAt: new Date().toISOString(),
      districts: districtsSnapshot,
      dayOverrides,
      dayNotes
    });

    purgeWeekKeys(weekId);
    board.weeks = board.weeks.filter(w=>w.id!==weekId);
    save(); render();
  }

  function restoreArchivedWeek(archiveId){
    const entry = board.archive.find(a=>a.id===archiveId);
    if(!entry) return;

    const newWeek = { id: uid(), date: entry.date };
    board.weeks.push(newWeek);
    board.placements[newWeek.id] = {};
    board.cellOrder[newWeek.id] = {};

    entry.districts.forEach(distSnap=>{
      const districtStillExists = board.districts.some(d=>d.id===distSnap.districtId);
      const targetDistrictId = districtStillExists ? distSnap.districtId : 'bench';
      distSnap.techs.forEach(techSnap=>{
        const stillOnRoster = board.techs.some(t=>t.id===techSnap.techId);
        if(!stillOnRoster) return; // person no longer on the roster; skip restoring them
        board.placements[newWeek.id][techSnap.techId] = { districtId: targetDistrictId, note: techSnap.note||'' };
      });
      if(distSnap.note && districtStillExists && targetDistrictId !== 'bench'){
        setCellNote({ weekId:newWeek.id, dayIdx:null, key:newWeek.id }, targetDistrictId, distSnap.note);
      }
    });
    Object.keys(entry.dayOverrides || {}).forEach(i=>{
      const map = {};
      Object.keys(entry.dayOverrides[i]).forEach(tid=>{
        if(!board.techs.some(t=>t.id===tid)) return;
        const o = entry.dayOverrides[i][tid];
        map[tid] = { districtId: board.districts.some(d=>d.id===o.districtId) ? o.districtId : 'bench', note: o.note||'' };
      });
      if(Object.keys(map).length) board.dayPlacements[newWeek.id+':'+i] = map;
    });
    Object.keys(entry.dayNotes || {}).forEach(i=>{
      Object.keys(entry.dayNotes[i]).forEach(did=>{
        if(board.districts.some(d=>d.id===did)) setCellNote({ weekId:newWeek.id, dayIdx:+i, key:newWeek.id+':'+i }, did, entry.dayNotes[i][did]);
      });
    });

    board.archive = board.archive.filter(a=>a.id!==archiveId);
    save(); render(); renderArchiveList();
  }

  function deleteArchivedForever(archiveId){
    const entry = board.archive.find(a=>a.id===archiveId);
    if(!entry) return;
    if(!confirm('Permanently delete the archived "'+entry.label+'"? This cannot be undone.')) return;
    board.archive = board.archive.filter(a=>a.id!==archiveId);
    save(); renderArchiveList();
  }

  function openArchive(){
    document.getElementById('archiveOverlay').classList.add('open');
    renderArchiveList();
  }
  function closeArchive(){
    document.getElementById('archiveOverlay').classList.remove('open');
  }
  function renderArchiveList(){
    const listEl = document.getElementById('archiveList');
    listEl.innerHTML = '';
    if(board.archive.length === 0){
      const empty = document.createElement('div');
      empty.className = 'archive-empty';
      empty.textContent = 'No archived weeks yet. Archive a week from its \u00d7 button on the main board.';
      listEl.appendChild(empty);
      return;
    }
    // most recently archived first
    const sorted = [...board.archive].sort((a,b)=> (b.archivedAt||'').localeCompare(a.archivedAt||''));
    sorted.forEach(entry=>{
      const card = document.createElement('div');
      card.className = 'archive-entry';

      const top = document.createElement('div');
      top.className = 'archive-entry-top';
      const title = document.createElement('div');
      title.className = 'archive-entry-title';
      title.textContent = entry.label;
      top.appendChild(title);
      const sub = document.createElement('div');
      sub.className = 'archive-entry-sub';
      const totalTechs = entry.districts.reduce((sum,d)=>sum+d.techs.length,0);
      sub.textContent = totalTechs + (totalTechs===1 ? ' assignment' : ' assignments');
      top.appendChild(sub);
      card.appendChild(top);

      const breakdown = document.createElement('div');
      breakdown.className = 'archive-breakdown';
      const activeDistricts = entry.districts.filter(d=>d.techs.length>0);
      if(activeDistricts.length===0){
        breakdown.textContent = 'Nobody was assigned this week.';
      } else {
        activeDistricts.forEach(d=>{
          const line = document.createElement('div');
          const names = d.techs.map(t=>t.name||'(unnamed)').join(', ');
          const strong = document.createElement('strong');
          strong.textContent = d.label + ':';
          line.appendChild(strong);
          line.appendChild(document.createTextNode(' ' + names));
          breakdown.appendChild(line);
        });
      }
      card.appendChild(breakdown);

      const actions = document.createElement('div');
      actions.className = 'archive-actions';
      const restoreBtn = document.createElement('button');
      restoreBtn.className = 'btn primary';
      restoreBtn.textContent = 'Restore to board';
      restoreBtn.addEventListener('click', ()=>restoreArchivedWeek(entry.id));
      actions.appendChild(restoreBtn);
      const delBtn = document.createElement('button');
      delBtn.className = 'btn';
      delBtn.textContent = 'Delete permanently';
      delBtn.addEventListener('click', ()=>deleteArchivedForever(entry.id));
      actions.appendChild(delBtn);
      card.appendChild(actions);

      listEl.appendChild(card);
    });
  }

  let activeProfileTechId = null;

  function refreshProfileEmailBtn(tech){
    const wrap = document.getElementById('profileEmailBtnWrap');
    wrap.innerHTML = '';
    if(emailValid(tech.email)){
      const a = document.createElement('a');
      a.className = 'pool-email-btn';
      a.href = 'mailto:' + tech.email;
      a.textContent = 'Email ' + (tech.name || 'this tech');
      wrap.appendChild(a);
    } else if(tech.email){
      const span = document.createElement('span');
      span.className = 'pool-email-btn-disabled';
      span.textContent = 'Enter a valid email to enable';
      wrap.appendChild(span);
    }
  }

  function openProfile(techId){
    const tech = board.techs.find(t=>t.id===techId);
    if(!tech) return;
    activeProfileTechId = techId;
    document.getElementById('profileName').value = tech.name || '';
    document.getElementById('profileRole').value = tech.role || '';
    document.getElementById('profilePhone').value = tech.phone || '';
    document.getElementById('profileEmail').value = tech.email || '';
    document.getElementById('profileDetail').value = tech.detail || '';
    refreshProfileEmailBtn(tech);
    document.getElementById('profileOverlay').classList.add('open');
    isEditingText = true;
  }

  function closeProfile(){
    document.getElementById('profileOverlay').classList.remove('open');
    activeProfileTechId = null;
    isEditingText = false;
    save(); render();
  }

  function updateProfileField(field, value){
    if(!activeProfileTechId) return;
    const tech = board.techs.find(t=>t.id===activeProfileTechId);
    if(tech){
      tech[field] = value;
      if(field==='email' || field==='name') refreshProfileEmailBtn(tech);
    }
  }

  function esc(s){
    return String(s==null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function printCellHTML(col, districtId){
    const order = orderObjFor(col)[districtId] || [];
    const techs = order.map(id=>board.techs.find(t=>t.id===id)).filter(Boolean);
    let html = techs.map(t=>{
      const p = effPlacement(col, t.id);
      return '<div class="p-tech" style="border-left-color:'+esc(t.color)+'"><span class="p-name">'+esc(t.name || '(unnamed)')+'</span>'
        + (t.role ? ' <span class="p-role">'+esc(t.role)+'</span>' : '')
        + (p.note ? '<div class="p-note">'+esc(p.note)+'</div>' : '')
        + '</div>';
    }).join('');
    const cn = getCellNote(col, districtId);
    if(cn) html += '<div class="p-cellnote">'+esc(cn)+'</div>';
    return html;
  }

  function printBenchHTML(col){
    const order = orderObjFor(col)['bench'] || [];
    const items = order.map(id=>board.techs.find(t=>t.id===id)).filter(Boolean).map(t=>{
      const p = effPlacement(col, t.id);
      return '<div class="p-bench-item">'+esc(t.name || '(unnamed)')+(p.note ? ' <span class="p-note">('+esc(p.note)+')</span>' : '')+'</div>';
    }).join('');
    return items ? '<div class="p-bench-list">'+items+'</div>' : '';
  }

  function buildPrintPage(pageCols){
    const first = pageCols[0], last = pageCols[pageCols.length-1];
    const dayMode = first.dayIdx != null;
    let title, sub;
    if(dayMode){
      title = first.week.date ? formatWeekLabel(first.week.date) : 'Undated week';
      sub = first.week.date ? colLabel(first) + ' – ' + colLabel(last) : 'Mon – Fri';
    } else {
      title = 'Weekly crew schedule';
      sub = pageCols.length === 1 ? colLabel(first) : colLabel(first) + ' – ' + colLabel(last);
    }

    let rows = '';
    board.districts.filter(d=>d.id !== 'bench').forEach(d=>{
      const cells = pageCols.map(c=>printCellHTML(c, d.id));
      if(cells.every(h=>!h)) return;   // nothing scheduled in this district on this page
      rows += '<tr><td class="p-dist">'+esc(d.label)+'</td>' + cells.map(h=>'<td>'+h+'</td>').join('') + '</tr>';
    });
    const benchCells = pageCols.map(c=>printBenchHTML(c));
    if(benchCells.some(h=>h)){
      rows += '<tr class="p-bench"><td class="p-dist">Bench / Unassigned</td>' + benchCells.map(h=>'<td>'+h+'</td>').join('') + '</tr>';
    }
    if(!rows){
      rows = '<tr><td class="p-dist">—</td><td colspan="'+pageCols.length+'">Nobody is scheduled yet.</td></tr>';
    }

    const head = '<th class="p-corner">District</th>' + pageCols.map(c=>'<th>'+esc(colLabel(c))+'</th>').join('');
    const printed = new Date().toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' });
    return '<div class="p-page">'
      + '<div class="p-head"><div><div class="p-eyebrow">NCD COMMUNICATIONS · FIELD CREW BOARD</div><h1>'+esc(title)+'</h1></div><div class="p-sub">'+esc(sub)+'</div></div>'
      + '<table class="p-grid"><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table>'
      + '<div class="p-foot"><span>NCD Internal</span><span>Printed '+esc(printed)+'</span></div>'
      + '</div>';
  }

  // "Export PDF": builds a print-ready crew board and opens the browser's print
  // dialog, where "Save as PDF" is the destination. Day view prints one page per week.
  function exportPDF(){
    if(board.techs.length === 0){ alert('No techs on the board yet.'); return; }
    if(board.weeks.length === 0){ alert('Add a week first.'); return; }
    reconcileAll();
    const cols = getColumns();
    const pages = [];
    if(viewMode === 'day'){
      board.weeks.forEach(w=>{ pages.push(cols.filter(c=>c.weekId === w.id)); });
    } else {
      for(let i=0; i<cols.length; i+=5) pages.push(cols.slice(i, i+5));
    }
    document.getElementById('printRoot').innerHTML = pages.map(buildPrintPage).join('');
    document.body.classList.add('printing');
    const done = ()=>{
      document.body.classList.remove('printing');
      window.removeEventListener('afterprint', done);
    };
    window.addEventListener('afterprint', done);
    setTimeout(()=>window.print(), 80);
  }

  function exportBoard(){
    try{
      const rows = [["Week", "District", "Tech", "Role", "Note", "Detail", "Day", "District note"]];
      board.weeks.forEach(week=>{
        const weekLabel = week.date ? formatWeekLabel(week.date) : '(no date set)';
        const wcol = { weekId:week.id, dayIdx:null, key:week.id, week };
        board.districts.forEach(district=>{
          board.techs.forEach(tech=>{
            const p = getPlacement(week.id, tech.id);
            if(p.districtId === district.id){
              rows.push([weekLabel, district.label, tech.name, tech.role||'', p.note||'', tech.detail||'', '', getCellNote(wcol, district.id)]);
            }
          });
        });
        // day-specific changes, one row per tech per day
        for(let i=0; i<DAYS_PER_WEEK; i++){
          const dcol = { weekId:week.id, dayIdx:i, key:week.id+':'+i, week };
          const o = board.dayPlacements[dcol.key] || {};
          Object.keys(o).forEach(tid=>{
            const tech = board.techs.find(t=>t.id===tid);
            const district = board.districts.find(d=>d.id===o[tid].districtId);
            if(!tech || !district) return;
            rows.push([weekLabel, district.label, tech.name, tech.role||'', o[tid].note||'', tech.detail||'', colLabel(dcol), getCellNote(dcol, district.id)]);
          });
        }
      });
      if(rows.length===1){ alert('No techs on the board yet.'); return; }
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:22},{wch:22},{wch:24},{wch:20},{wch:30},{wch:34},{wch:14},{wch:30}];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Crew Board");
      const stamp = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, "crew-board-" + stamp + ".xlsx");
    }catch(e){
      console.error("Export error:", e);
      alert("Export failed — try again in a moment.");
    }
  }

  document.getElementById('addTechBtn').addEventListener('click', addTech);
  document.getElementById('tabBoardBtn').addEventListener('click', ()=>switchTab('board'));
  document.getElementById('tabPoolBtn').addEventListener('click', ()=>switchTab('techPool'));
  document.getElementById('poolSearch').addEventListener('input', renderTechPool);
  document.getElementById('poolSearch').addEventListener('focus', ()=>{ isEditingText = true; });
  document.getElementById('poolSearch').addEventListener('blur', ()=>{ isEditingText = false; });
  document.getElementById('addWeekBtn').addEventListener('click', addWeek);
  document.getElementById('archiveBtn').addEventListener('click', openArchive);
  document.getElementById('historyBtn').addEventListener('click', openHistory);
  document.getElementById('historyCloseBtn').addEventListener('click', closeHistory);
  document.getElementById('historyOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'historyOverlay') closeHistory();
  });
  document.getElementById('historySaveBtn').addEventListener('click', saveNamedVersion);
  document.getElementById('historyName').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); saveNamedVersion(); }
  });
  document.getElementById('previewBackBtn').addEventListener('click', ()=>leavePreview());
  document.getElementById('previewRestoreBtn').addEventListener('click', ()=>{
    if(!previewing) return;
    const m = previewing.meta;
    restoreVersion(m.id, m.label ? '"' + m.label + '"' : fmtWhen(m.ts));
  });
  window.addEventListener('beforeunload', (e)=>{
    if(unsavedLocal){ e.preventDefault(); e.returnValue = ''; }
  });
  document.getElementById('archiveCloseBtn').addEventListener('click', closeArchive);
  document.getElementById('archiveOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'archiveOverlay') closeArchive();
  });
  document.getElementById('exportBtn').addEventListener('click', exportPDF);
  document.getElementById('exportXlsBtn').addEventListener('click', exportBoard);
  document.getElementById('viewWeekBtn').addEventListener('click', ()=>setViewMode('week'));
  document.getElementById('viewDayBtn').addEventListener('click', ()=>setViewMode('day'));
  document.getElementById('refreshBtn').addEventListener('click', ()=>refreshFromShared(false));
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('Reset the board back to the sample schedule? This clears the board for everyone using this link.')){
      board = seedData();
      save({ force: true }); render();
    }
  });

  document.getElementById('profileName').addEventListener('input', (e)=>updateProfileField('name', e.target.value));
  document.getElementById('profileRole').addEventListener('input', (e)=>updateProfileField('role', e.target.value));
  document.getElementById('profilePhone').addEventListener('input', (e)=>updateProfileField('phone', e.target.value));
  document.getElementById('profileEmail').addEventListener('input', (e)=>updateProfileField('email', e.target.value));
  document.getElementById('profileDetail').addEventListener('input', (e)=>updateProfileField('detail', e.target.value));
  document.getElementById('profileCloseBtn').addEventListener('click', closeProfile);
  document.getElementById('profileOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'profileOverlay') closeProfile();
  });

  (async function init(){
    await load();
    updateViewButtons();
    render();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(viewMode==='day' && activeTab==='board') fixDayHeaderOffset(); });
    window.addEventListener('resize', ()=>{ if(viewMode==='day' && activeTab==='board') fixDayHeaderOffset(); });
    startLiveUpdates();
    renderStatus();
  })();

})();
</script>
