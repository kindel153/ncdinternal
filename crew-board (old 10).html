<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Field Crew Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --board-bg:#EDEAE2;
    --board-line:#D9D4C7;
    --ink:#22262B;
    --ink-soft:#5A5F66;
    --header-bg:#20242B;
    --header-text:#F4F1E8;
    --card-bg:#FFFDF8;
    --paper-shadow:2px 2px 0 rgba(34,38,43,0.16);
    --paper-shadow-hover:3px 3px 0 rgba(34,38,43,0.22);
    --accent:#B5563C;
    --danger:#A8402C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(var(--board-line) 1px, transparent 1px) 0 0/22px 22px,
      var(--board-bg);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:24px 24px 60px;
  }
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:8px;
    padding-bottom:14px;
    border-bottom:3px solid var(--ink);
    flex-wrap:wrap;
  }
  .title-block h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.3px;
    margin:0;
  }
  .title-block a{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:11.5px;
    letter-spacing:0.4px;color:var(--ink-soft);text-decoration:none;
  }
  .title-block p{
    margin:6px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button{font-family:'IBM Plex Sans', sans-serif;cursor:pointer;}
  .btn{
    border:2px solid var(--ink);
    background:var(--card-bg);
    color:var(--ink);
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:2px;
    box-shadow:var(--paper-shadow);
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:var(--paper-shadow-hover);}
  .btn.primary{background:var(--ink);color:var(--header-text);}
  .sync-note{font-size:11.5px;color:var(--ink-soft);margin:8px 0 16px;}

  /* ============ TABS ============ */
  .tab-bar{
    display:flex; gap:2px; margin:0 0 16px; border-bottom:2px solid var(--ink);
  }
  .tab-btn{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.3px;
    background:transparent; border:none; color:var(--ink-soft);
    padding:9px 16px; border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--accent); }

  /* ============ TECH POOL ============ */
  .pool-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;
  }
  .pool-search{
    font-family:'IBM Plex Sans',sans-serif; font-size:13px; padding:7px 10px;
    border:1.3px solid var(--board-line); border-radius:2px; width:260px; max-width:60vw;
    background:#fff; outline:none;
  }
  .pool-search:focus{ border-color:var(--accent); }
  .pool-count{ font-size:12px; color:var(--ink-soft); }
  .pool-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px;
  }
  .pool-card{
    background:var(--card-bg); border:1.3px solid var(--ink); border-left-width:6px;
    box-shadow:var(--paper-shadow); padding:12px 14px 14px; position:relative;
  }
  .pool-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; margin-bottom:8px; }
  .pool-name{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; outline:none;
    border:none; background:transparent; width:100%; padding:2px 0; border-bottom:1px solid transparent;
  }
  .pool-name:focus{ border-bottom-color:var(--accent); }
  .pool-name:empty::before{ content:"Tech name"; color:#c9c2b4; font-style:italic; font-weight:400; }
  .pool-del{
    background:none; border:1px solid var(--board-line); border-radius:2px; color:var(--ink-soft);
    font-size:13px; line-height:1; padding:3px 6px; flex-shrink:0;
  }
  .pool-del:hover{ border-color:var(--danger); color:var(--danger); }
  .pool-row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .pool-field label{
    display:block; font-family:'Oswald',sans-serif; font-weight:600; font-size:9.5px;
    letter-spacing:0.5px; color:var(--ink-soft); margin-bottom:2px;
  }
  .pool-field input, .pool-field textarea{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:12.5px; color:var(--ink);
    border:1.3px solid var(--board-line); border-radius:2px; padding:5px 7px; background:#fff; outline:none;
  }
  .pool-field input:focus, .pool-field textarea:focus{ border-color:var(--accent); }
  .pool-field input.email-invalid{ border-color:#C97A5C; background:#FCF1EC; }
  .pool-email-row{ display:flex; gap:6px; align-items:flex-end; margin-bottom:8px; }
  .pool-email-row .pool-field{ flex:1; }
  .pool-email-btn, .pool-email-btn-disabled{
    font-family:'IBM Plex Sans',sans-serif; font-size:11.5px; font-weight:600;
    padding:6px 10px; border-radius:2px; text-decoration:none; white-space:nowrap;
  }
  .pool-email-btn{ background:var(--ink); color:var(--header-text); border:1.5px solid var(--ink); }
  .pool-email-btn:hover{ background:var(--accent); border-color:var(--accent); }
  .pool-email-btn-disabled{
    background:transparent; color:#B7B0A0; border:1.5px dashed var(--board-line); cursor:default;
  }
  .pool-detail textarea{ min-height:52px; resize:vertical; }
  .pool-empty{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:16px 2px; }

  /* ============ GRID ============ */
  .grid-wrap{
    overflow:auto;
    max-height:78vh;
    border:1.5px solid var(--board-line);
    background:var(--card-bg);
  }
  table.grid{
    border-collapse:separate;
    border-spacing:0;
    width:100%;
  }
  .corner{
    position:sticky; top:0; left:0; z-index:5;
    background:var(--header-bg);
    min-width:170px;
  }
  th.week-head{
    position:sticky; top:0; z-index:3;
    background:var(--header-bg);
    color:var(--header-text);
    padding:9px 10px;
    min-width:150px;
    border-left:1px solid #3A3F47;
    text-align:left;
  }
  .week-title{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:13.5px;
    letter-spacing:0.2px;background:transparent;border:none;color:var(--header-text);
    outline:none;width:100%;padding:1px 0;
  }
  .week-date-input{
    font-family:'IBM Plex Sans',sans-serif; font-size:11px;
    background:#2E3239; border:1px solid #444951; border-radius:2px;
    color:var(--header-text); padding:2px 4px; width:100%;
    color-scheme: dark;
  }
  .week-daystrip{
    display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;
  }
  .daystrip-day{
    font-size:9px; font-weight:600; color:#B9B4A6;
    background:#2E3239; border-radius:2px; padding:2px 4px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .week-nodate{ font-size:10.5px; color:#8A8F98; font-style:italic; margin-top:4px; }
  .col-actions{display:flex;justify-content:flex-end;margin-top:2px;}
  .mini-x{background:none;border:none;color:#C9A79C;font-size:14px;line-height:1;padding:0 2px;opacity:.7;}
  .mini-x:hover{opacity:1;color:#fff;}
  .mini-move{background:none;border:none;color:#9CA0A6;font-size:11px;line-height:1;padding:0 2px;opacity:.75;}
  .mini-move:hover{opacity:1;color:#fff;}
  .mini-move:disabled{opacity:.2;cursor:default;}
  .add-week-cell{
    position:sticky; top:0; z-index:3;
    background:var(--header-bg);
    padding:6px;
    vertical-align:middle;
    min-width:80px;
  }
  .add-week-cell button{
    width:100%;height:100%;min-height:38px;
    border:1.5px dashed #565B63;background:transparent;color:#B9B4A6;
    font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;border-radius:2px;
  }
  .add-week-cell button:hover{border-color:#fff;color:#fff;}

  td.district-head{
    position:sticky; left:0; z-index:2;
    background:var(--header-bg);
    color:var(--header-text);
    padding:8px 10px;
    vertical-align:middle;
    border-top:1px solid #3A3F47;
  }
  td.district-head.bench-head{ background:#565B63; }
  .district-title{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;
    letter-spacing:0.2px;background:transparent;border:none;color:var(--header-text);
    outline:none;width:100%;
  }
  .district-row-actions{display:flex;justify-content:space-between;align-items:center;gap:4px;}

  /* ============ BENCH SHELF ============ */
  .bench-label-row td{
    position:sticky; left:0; z-index:2;
    background:var(--board-bg);
    padding-top:14px;
    border:none;
  }
  td.district-head.bench-head .bench-eyebrow{ color:#D9D4C7; }
  .bench-eyebrow{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:10.5px;
    letter-spacing:1px; color:var(--ink-soft);
  }
  tr.bench-row td.cell{ background:#F1EFE8; }
  tr.bench-row td.cell.has-techs{ background:#EDE6D2; }
  tr.bench-row{ border-bottom:3px solid var(--ink); }
  .bench-collapse-btn{
    background:none;border:1px solid #7A7F87;color:var(--header-text);
    font-size:11px;line-height:1;padding:2px 6px;border-radius:2px;
  }
  .bench-collapse-btn:hover{background:#6A6F77;}
  .bench-collapsed-hint{
    font-size:11px; color:var(--ink-soft); font-style:italic; padding:6px 2px;
  }

  td.cell{
    border-top:1px solid var(--board-line);
    border-left:1px solid var(--board-line);
    padding:6px;
    vertical-align:top;
    min-width:150px;
    min-height:48px;
    transition:background-color .35s ease;
    position:relative;
  }
  td.cell.has-techs{
    background:#F7EEDC;
    box-shadow:inset 0 0 0 1.5px #E4D3A8;
  }
  td.cell.drag-over{ background:#F3E9D8; outline:2px dashed var(--accent); outline-offset:-2px; }
  td.cell.just-placed{
    animation: cellFlash 0.7s ease;
  }
  @keyframes cellFlash{
    0%{ background:#E8A560; box-shadow:inset 0 0 0 2px var(--accent); }
    100%{ background:#F7EEDC; box-shadow:inset 0 0 0 1.5px #E4D3A8; }
  }

  .add-district-row td{
    padding:6px 10px;
  }
  .add-district-row button{
    border:1.5px dashed var(--board-line);background:transparent;color:var(--ink-soft);
    font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;padding:6px 10px;border-radius:2px;
  }
  .add-district-row button:hover{border-color:var(--ink);color:var(--ink);}

  /* ============ TECH CHIP ============ */
  .chip{
    background:var(--card-bg);
    border:1.3px solid var(--ink);
    border-left-width:6px;
    box-shadow:var(--paper-shadow);
    padding:5px 16px 5px 8px;
    margin-top:10px;
    cursor:grab;
    position:relative;
  }
  .chip:first-child{margin-top:0;}
  .chip:hover{transform:translate(-1px,-1px);box-shadow:var(--paper-shadow-hover);}
  .chip.dragging{opacity:0.35;}
  .chip-top{display:flex;align-items:flex-start;gap:4px;}
  .chip-name{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;outline:none;flex:1;min-width:0;
  }
  .chip-name:empty::before{content:"Tech name";color:#c9c2b4;font-style:italic;font-weight:400;}
  .chip-x{
    position:absolute; top:-7px; right:-7px;
    width:17px; height:17px;
    display:flex; align-items:center; justify-content:center;
    background:var(--card-bg);
    border:1.3px solid var(--ink);
    border-radius:50%;
    color:var(--ink-soft);
    font-size:12px; line-height:1; padding:0;
    box-shadow:1px 1px 0 rgba(34,38,43,0.18);
  }
  .chip-x:hover{color:#fff;background:var(--danger);border-color:var(--danger);}
  .chip-profile-btn{
    position:absolute; top:-7px; left:-7px;
    width:17px; height:17px;
    display:flex; align-items:center; justify-content:center;
    background:var(--ink);
    border:1.3px solid var(--ink);
    border-radius:50%;
    color:var(--header-text);
    font-family:'Oswald',sans-serif; font-weight:700;
    font-size:10px; line-height:1; padding:0;
    box-shadow:1px 1px 0 rgba(34,38,43,0.18);
  }
  .chip-profile-btn.has-detail{ background:var(--accent); border-color:var(--accent); }
  .chip-profile-btn:hover{ background:#3E4450; border-color:#3E4450; }

  /* ============ PROFILE MODAL ============ */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,22,26,0.55);
    display:none; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background:var(--card-bg);
    border:1.5px solid var(--ink);
    box-shadow:5px 5px 0 rgba(34,38,43,0.25);
    width:100%; max-width:380px;
    padding:20px 22px 18px;
  }
  .modal-card h2{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:19px;
    margin:0 0 14px; letter-spacing:0.2px; color:var(--ink);
  }
  .modal-field{ margin-bottom:12px; }
  .modal-field label{
    display:block; font-family:'Oswald',sans-serif; font-weight:600; font-size:10.5px;
    letter-spacing:0.6px; color:var(--ink-soft); margin-bottom:4px;
  }
  .modal-field input, .modal-field textarea{
    width:100%; font-family:'IBM Plex Sans',sans-serif; font-size:13px; color:var(--ink);
    border:1.3px solid var(--board-line); border-radius:2px; padding:7px 8px;
    background:#fff; outline:none;
  }
  .modal-field input:focus, .modal-field textarea:focus{ border-color:var(--accent); }
  .modal-field textarea{ min-height:90px; resize:vertical; font-family:'IBM Plex Sans',sans-serif; }
  .modal-actions{ display:flex; justify-content:flex-end; margin-top:6px; }
  .modal-card.wide{ max-width:600px; }
  .archive-list{ max-height:60vh; overflow:auto; margin-top:4px; }
  .archive-empty{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:10px 2px; }
  .archive-entry{
    border:1.3px solid var(--board-line); border-left:6px solid var(--ink);
    padding:10px 12px; margin-bottom:10px; background:#FBF9F4;
  }
  .archive-entry-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .archive-entry-title{ font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; color:var(--ink); }
  .archive-entry-sub{ font-size:10.5px; color:var(--ink-soft); }
  .archive-breakdown{ margin-top:8px; font-size:12px; color:var(--ink); line-height:1.6; }
  .archive-breakdown strong{ color:var(--ink-soft); font-weight:600; }
  .archive-actions{ display:flex; gap:8px; margin-top:10px; }
  .archive-actions .btn{ font-size:11.5px; padding:5px 10px; }
  .chip-note{
    font-size:10.5px;color:var(--accent);font-weight:600;outline:none;margin-top:2px;min-height:12px;
  }
  .chip-note:empty::before{content:"+ note";color:#c9c2b4;font-weight:400;font-style:italic;}
  .chip-district-select{
    width:100%; margin-top:5px; font-family:'IBM Plex Sans',sans-serif; font-size:11px;
    color:var(--ink); background:#F4F1E8; border:1.3px solid var(--board-line); border-radius:2px;
    padding:3px 4px; outline:none; cursor:pointer;
  }
  .chip-district-select:hover{ border-color:var(--ink); }
  .chip-district-select:focus{ border-color:var(--accent); }
  .chip-reorder{
    display:flex; justify-content:flex-end; gap:2px; margin-top:3px;
  }
  .chip-move-btn{
    background:none; border:1px solid var(--board-line); border-radius:2px;
    color:var(--ink-soft); font-size:9px; line-height:1; padding:1px 4px;
  }
  .chip-move-btn:hover{ border-color:var(--ink); color:var(--ink); }
  .chip-move-btn:disabled{ opacity:.25; cursor:default; }

  .empty-cell-hint{font-size:10.5px;color:#B7B0A0;font-style:italic;text-align:center;padding:8px 2px;}
  td.cell.has-copy-space{ padding-top:20px; }
  .cell-copy-controls{
    position:absolute; top:3px; right:3px; display:flex; gap:2px; z-index:1;
  }
  .cell-copy-btn{
    background:rgba(255,253,248,0.9); border:1px solid var(--board-line); border-radius:2px;
    color:var(--ink-soft); font-size:10px; line-height:1; padding:2px 4px;
  }
  .cell-copy-btn:hover{ border-color:var(--ink); color:var(--ink); background:#fff; }
  .cell-copy-btn:disabled{ opacity:0; pointer-events:none; }

  /* ============ VIEW TOGGLE ============ */
  .tab-bar{ align-items:flex-end; }
  .view-toggle{ margin-left:auto; display:flex; align-items:center; gap:8px; padding-bottom:5px; }
  .view-toggle-label{ font-family:'Oswald',sans-serif; font-weight:600; font-size:10.5px; letter-spacing:0.8px; color:var(--ink-soft); }
  .seg{ display:flex; }
  .seg button{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.3px;
    border:2px solid var(--ink); background:var(--card-bg); color:var(--ink); padding:4px 14px;
  }
  .seg button + button{ border-left:none; }
  .seg button.active{ background:var(--ink); color:var(--header-text); }

  /* ============ DAY VIEW ============ */
  th.day-head{
    position:sticky; top:0; z-index:3;
    background:#2E3239; color:var(--header-text);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:11.5px; letter-spacing:0.2px;
    padding:5px 6px; border-left:1px solid #3A3F47; border-top:1px solid #3A3F47; text-align:center;
  }
  table.grid.day-mode td.cell{ min-width:128px; padding:5px; }
  table.grid.day-mode th.week-head{ min-width:0; }
  .chip.day-override{ background:#FFF6E2; }
  .chip-badge{
    display:inline-block; font-size:9px; font-weight:600; color:#fff; background:var(--accent);
    border-radius:2px; padding:1px 5px; margin-top:4px;
  }
  .chip-reset{
    display:block; margin-top:4px; background:none; border:1px dashed var(--accent); border-radius:2px;
    color:var(--accent); font-size:9.5px; font-weight:600; padding:1px 5px;
  }
  .chip-reset:hover{ background:var(--accent); color:#fff; }

  /* ============ BENCH: SHORT + SCROLLABLE ============ */
  .bench-scroll{ max-height:190px; overflow-y:auto; padding:9px 9px 6px 9px; }
  tr.bench-row td.cell{ padding:2px; }
  tr.bench-row td.cell.has-copy-space{ padding-top:20px; }
  .chip.drop-before{ box-shadow:0 -5px 0 0 var(--accent), var(--paper-shadow); }

  /* ============ CELL NOTE + DISTRICT QUICK-ADD ============ */
  .cell-note{
    font-size:10.5px; color:var(--ink); outline:none; margin-top:8px; padding:3px 6px; min-height:18px;
    border-left:3px solid var(--accent); background:rgba(181,86,60,0.08); font-style:italic;
  }
  .cell-note:empty{ border-left-color:transparent; background:transparent; }
  .cell-note:empty::before{ content:"+ cell note"; color:#B7B0A0; }
  .cell-note:focus{ background:#fff; border-left-color:var(--accent); }
  .district-add-select{
    width:100%; margin-top:6px; font-family:'IBM Plex Sans',sans-serif; font-size:11px;
    color:var(--header-text); background:#2E3239; border:1px solid #444951; border-radius:2px;
    padding:3px 4px; outline:none; cursor:pointer; color-scheme:dark;
  }
  .district-add-select:hover:not(:disabled){ border-color:#fff; }
  .district-add-select:disabled{ opacity:.5; cursor:default; }

  /* ============ SYNC STATUS + HISTORY ============ */
  .sync-note.sync-saving{ color:var(--ink-soft); }
  .sync-note.sync-offline{ color:var(--danger); font-weight:600; }
  .sync-note.sync-preview{ color:var(--accent); font-weight:600; }
  .preview-bar{
    display:none; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:#F3D9A4; border:2px solid var(--ink); box-shadow:var(--paper-shadow);
    padding:9px 14px; margin:10px 0 4px; font-size:13px;
  }
  body.previewing .preview-bar{ display:flex; }
  .preview-actions{ display:flex; gap:8px; }
  body.previewing #gridTable *, body.previewing #techPoolView *{ pointer-events:none !important; }
  body.previewing .grid-wrap, body.previewing #techPoolView{ outline:3px solid #E4B85A; outline-offset:-3px; }
  body.previewing .topbar-actions .btn:not(#historyBtn):not(#exportBtn){ opacity:.4; pointer-events:none; }

<script>

    place(2,"Piet","Hempstead");
    place(2,"Gerald Abt","Freeport","Columbus \u2014 door ajar");
    place(2,"Jarrett Abt","Freeport");
    place(2,"Anthony DiAngelo","Freeport","Giblyn PA");
    place(2,"Shaun McKee","North Babylon");
    place(2,"Tayfun Uzun","Lynbrook");
    place(2,"Rafy","Lynbrook");
    place(2,"Ernie","Lynbrook");
    place(2,"Mike Mullen","Manhasset");
    place(2,"Pat Uhlman","Manhasset");
    place(2,"Matt Abt","Oceanside");
    place(2,"Kevin Bolin","Oceanside");
    place(2,"Ed Aukstolis","Oceanside");

    // Week of Aug 31
    place(3,"Mike Jack","East Williston","VS-13 lockdown");
    place(3,"Sakiris Diaz","East Williston");
    place(3,"Miguel Martinez","Hempstead");
    place(3,"Frank Gioielli","Hempstead");
    place(3,"Piet","Hempstead");
    place(3,"Gerald Abt","Freeport","Columbus \u2014 door ajar");
    place(3,"Jarrett Abt","Freeport");
    place(3,"Anthony DiAngelo","Freeport","Giblyn PA");
    place(3,"Shaun McKee","North Babylon");

    return ensureTechFields({
      techs: Object.values(techs),
      districts,
      weeks,
      placements,
      archive: []

  let board = null;
  let dragTechId = null;
  let dragFromCol = null;
  let isEditingText = false;
  const tableEl = document.getElementById('gridTable');
  const syncNoteEl = document.getElementById('syncNote');

  // ============ AUTOSAVE, MERGE, LIVE SYNC ============
  // The server keeps a revision number. Every save says which revision it was
  // based on; if someone else saved first, the server hands back their board and
  // we merge the two (their changes + ours) before saving again, so nobody's
  // edits are overwritten. Other people's changes arrive over a live connection.
  let syncedRev = 0;          // server revision that syncedBoard corresponds to
  let syncedBoard = null;     // copy of the board as the server last had it
  let saving = false;
  let saveQueued = false;
  let forceNext = false;
  let unsavedLocal = false;   // we have edits the server doesn't have yet
  let pendingRemote = false;  // a remote change is waiting for us to finish typing/saving
  let retryTimer = null;
  let viewers = 1;
  let statusKind = 'saved';
  let statusTime = '';
  let previewing = null;      // {liveBoard, meta} while looking at an old version

  function clone(x){ return JSON.parse(JSON.stringify(x)); }
  function timeNow(){ return new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }

  function setStatus(kind, extra){
    statusKind = kind;
    if(kind === 'saved') statusTime = timeNow();
    statusExtra = extra || '';
    renderStatus();
  }
  let statusExtra = '';
  function renderStatus(){
    if(!syncNoteEl) return;
    let text;
    if(previewing) text = '';   // the banner above already says so
    else if(statusKind === 'saving') text = 'Saving…';
    else if(statusKind === 'offline') text = 'Offline — your changes are kept here and will save as soon as the connection is back';
    else {
      text = statusExtra ? statusExtra + ' — ' + statusTime : 'All changes saved — ' + statusTime;
      text += viewers > 1 ? '  ·  ● ' + viewers + ' people viewing' : '  ·  ● Live';
    }
    syncNoteEl.textContent = text;
    syncNoteEl.className = 'sync-note sync-' + (previewing ? 'preview' : statusKind);
  }

  function deepEqual(a, b){
    if(a === b) return true;
    if(a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false;
    if(Array.isArray(a) !== Array.isArray(b)) return false;
    if(Array.isArray(a)){
      if(a.length !== b.length) return false;
      for(let i=0; i<a.length; i++) if(!deepEqual(a[i], b[i])) return false;
      return true;
    }
    const ka = Object.keys(a), kb = Object.keys(b);
    if(ka.length !== kb.length) return false;
    for(const k of ka){
      if(!Object.prototype.hasOwnProperty.call(b, k) || !deepEqual(a[k], b[k])) return false;
    }
    return true;
  }
  function isPlainObj(o){ return o !== null && typeof o === 'object' && !Array.isArray(o); }
  function hasKey(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }
  function isIdArray(a){ return Array.isArray(a) && a.every(x=>isPlainObj(x) && typeof x.id === 'string'); }

  // Three-way merge. base = what we last got from the server, mine = our board
  // now, theirs = the server's board now. Anything only one side changed is
  // kept; where both sides changed the same thing, ours wins.
  function merge3(base, mine, theirs){
    if(deepEqual(mine, theirs)) return mine;
    if(deepEqual(mine, base)) return theirs;
    if(deepEqual(theirs, base)) return mine;
    if(isPlainObj(mine) && isPlainObj(theirs)){
      const b = isPlainObj(base) ? base : {};
      const out = {};
      const keys = new Set([...Object.keys(mine), ...Object.keys(theirs), ...Object.keys(b)]);
      keys.forEach(k=>{
        const inM = hasKey(mine, k), inT = hasKey(theirs, k), inB = hasKey(b, k);
        if(!inM && !inT) return;
        if(!inM){
          if(inB) return;               // we deleted it: stays deleted
          out[k] = theirs[k]; return;   // they added it
        }
        if(!inT){
          if(inB){ if(!deepEqual(mine[k], b[k])) out[k] = mine[k]; return; } // they deleted it; keep only if we edited it
          out[k] = mine[k]; return;     // we added it
        }
        out[k] = merge3(inB ? b[k] : undefined, mine[k], theirs[k]);
      });
      return out;
    }
    if(isIdArray(mine) && isIdArray(theirs)) return mergeIdArrays(isIdArray(base) ? base : [], mine, theirs);
    return mine; // plain arrays/values changed on both sides: ours wins
  }

  function mergeIdArrays(base, mine, theirs){
    const mapOf = arr=>{ const m = new Map(); arr.forEach(x=>m.set(x.id, x)); return m; };
    const B = mapOf(base), M = mapOf(mine), T = mapOf(theirs);
    const baseIds = base.map(x=>x.id), mineIds = mine.map(x=>x.id), theirIds = theirs.map(x=>x.id);
    const seqEq = (a, b)=> a.length === b.length && a.every((v,i)=>v === b[i]);
    // Did we reorder the items that existed before? If so our order is used.
    const iReordered = !seqEq(mineIds.filter(id=>B.has(id)), baseIds.filter(id=>M.has(id)));
    const primary = iReordered ? mineIds : theirIds;
    const secondary = iReordered ? theirIds : mineIds;
    const order = [];
    const used = new Set();
    primary.concat(secondary).forEach(id=>{ if(!used.has(id)){ used.add(id); order.push(id); } });

    const out = [];
    order.forEach(id=>{
      const b = B.get(id), m = M.get(id), t = T.get(id);
      let v;
      if(m && t) v = merge3(b, m, t);
      else if(m && !t) v = !b ? m : (deepEqual(m, b) ? undefined : m);   // they deleted it (unless we edited it)
      else if(!m && t) v = !b ? t : undefined;                           // we deleted it
      if(v !== undefined) out.push(v);
    });
    return out;
  }

  // Brings a newer server board into this page. With unsaved local edits it
  // merges; otherwise it simply adopts the server's version.
  function applyRemote(theirsBoard, theirsRev, mergeLocal){
    ensureTechFields(theirsBoard);
    let result = theirsBoard;
    const mine = previewing ? previewing.liveBoard : board;
    if(mergeLocal && syncedBoard){
      result = ensureTechFields(merge3(syncedBoard, mine, theirsBoard));
    }
    if(previewing) previewing.liveBoard = result; else board = result;
    syncedBoard = clone(theirsBoard);
    syncedRev = theirsRev;
  }

  function save(opts){
    if(previewing) return Promise.resolve();
    unsavedLocal = true;
    if(opts && opts.force) forceNext = true;
    if(saving){ saveQueued = true; return Promise.resolve(); }
    return runSave();
  }

  async function runSave(){
    saving = true;
    setStatus('saving');
    clearTimeout(retryTimer);
    let ok = false;
    try{
      let attempts = 0;
      do{
        saveQueued = false;
        const force = forceNext; forceNext = false;
        const liveBoard = previewing ? previewing.liveBoard : board;
        const sent = JSON.stringify(liveBoard);
        const res = await fetch('/api/board', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ baseRev: syncedRev, board: liveBoard, force: force })
        });
        if(res.ok){
          const data = await res.json();
          syncedRev = data.rev;
          syncedBoard = JSON.parse(sent);
          if(!saveQueued) unsavedLocal = false;
        } else if(res.status === 409){
          const data = await res.json();
          // someone saved first: merge their changes with ours, then save again
          applyRemote(JSON.parse(data.value), data.rev, true);
          saveQueued = true;
          if(++attempts > 8) throw new Error('Too many conflicting saves');
          if(!previewing && !isEditingText && !dragTechId) render();
        } else {
          throw new Error('HTTP ' + res.status);
        }
      } while(saveQueued);
      ok = true;
    }catch(e){
      console.error('Save error:', e);
    }
    saving = false;
    if(ok){
      setStatus('saved');
      if(pendingRemote) refreshFromShared(true);
    } else {
      setStatus('offline');
      retryTimer = setTimeout(()=>{ if(unsavedLocal && !saving) save(); }, 5000);
    }
  }

  async function load(){
    try{
      const res = await fetch('/api/board');
      if(res.ok){
        const data = await res.json();
        syncedRev = data.rev || 0;
        if(data && data.value){
          board = ensureTechFields(JSON.parse(data.value));
          syncedBoard = clone(board);
          return;
        }
      }
    }catch(e){ /* server not reachable yet; fall through */ }
    board = seedData();
    syncedBoard = null;
    await save();
  }

  async function refreshFromShared(silent){
    if(previewing) return;
    if(saving || isEditingText || dragTechId){ pendingRemote = true; return; }
    try{
      const res = await fetch('/api/board');
      if(!res.ok) return;
      const data = await res.json();
      if(!data.value) return;
      if(data.rev === syncedRev && !unsavedLocal) return;
      // we may have started typing or saving while the request was in flight
      if(saving || isEditingText || dragTechId){ pendingRemote = true; return; }
      pendingRemote = false;
      const hadLocal = unsavedLocal;
      applyRemote(JSON.parse(data.value), data.rev, hadLocal);
      render();
      if(document.getElementById('archiveOverlay').classList.contains('open')) renderArchiveList();
      if(hadLocal) save();
      else setStatus('saved', silent ? 'Updated by someone else' : 'Up to date');
    }catch(e){ /* offline; the next poll or live event will retry */ }
  }

  function startLiveUpdates(){
    // A pause in typing or dragging lets waiting remote changes in.
    setInterval(()=>{
      if(pendingRemote && !isEditingText && !dragTechId && !saving && !previewing){ refreshFromShared(true); }
    }, 1000);
    // Fallback in case the live connection is blocked by a network.
    setInterval(()=>refreshFromShared(true), 15000);
    if(!window.EventSource) return;
    const es = new EventSource('/api/events');
    const onRev = rev=>{ if(rev > syncedRev) refreshFromShared(true); };
    es.addEventListener('hello', e=>{
      const d = JSON.parse(e.data); viewers = d.count || 1; renderStatus(); onRev(d.rev);
    });
    es.addEventListener('rev', e=>{ onRev(JSON.parse(e.data).rev); });
    es.addEventListener('viewers', e=>{ viewers = JSON.parse(e.data).count || 1; renderStatus(); });
  }

  function ensureTechFields(b){
    b.techs.forEach(t=>{
      if(t.role===undefined) t.role='';
      if(t.phone===undefined) t.phone='';
      if(t.email===undefined) t.email='';
      if(t.detail===undefined) t.detail='';
    });
    if(!Array.isArray(b.archive)) b.archive = [];
    if(!b.placements || typeof b.placements !== 'object') b.placements = {};
    ['cellOrder','dayPlacements','dayOrder','cellNotes'].forEach(k=>{
      if(!b[k] || typeof b[k] !== 'object') b[k] = {};
    });
    b.weeks.forEach(w=>{
      if(w.date===undefined) w.date = '';
    });
    return b;
  }

  const DAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function parseISODate(dateStr){
    // Parse as local calendar date, not UTC, so it never shifts a day off.
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  function formatWeekLabel(dateStr){
    if(!dateStr) return '';
    const dt = parseISODate(dateStr);
    return 'Week of ' + MONTH_ABBR[dt.getMonth()] + ' ' + dt.getDate();
  }

  function formatWeekDayStrip(dateStr){
    // Assumes dateStr is the Monday of that week; renders Mon\u2013Fri.
    if(!dateStr) return [];
    const start = parseISODate(dateStr);
    const days = [];
    for(let i=0; i<5; i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
      days.push(DAY_ABBR[d.getDay()] + ' ' + (d.getMonth()+1) + '/' + d.getDate());
    }
    return days;
  }

  // ============ VERSION HISTORY ============
  function fmtWhen(ts){
    const d = new Date(ts);
    return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}) + ' · ' +
      d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }
  function relTime(ts){
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if(s < 60) return 'just now';
    const m = Math.round(s / 60);
    if(m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    if(h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    const d = Math.round(h / 24);
    return d + (d === 1 ? ' day ago' : ' days ago');
  }

  function openHistory(){
    document.getElementById('historyOverlay').classList.add('open');
    isEditingText = false;
    renderHistoryList();
  }
  function closeHistory(){
    document.getElementById('historyOverlay').classList.remove('open');
  }

  async function renderHistoryList(){
    const listEl = document.getElementById('historyList');
    listEl.innerHTML = '';
    const loading = document.createElement('div');
    loading.className = 'archive-empty';
    loading.textContent = 'Loading versions…';
    listEl.appendChild(loading);
    let versions;
    try{
      const res = await fetch('/api/history');
      if(!res.ok) throw new Error('HTTP ' + res.status);
      versions = (await res.json()).versions;
    }catch(e){
      loading.textContent = 'Could not load version history. Check your connection and try again.';
      return;
    }
    listEl.innerHTML = '';

    const now = document.createElement('div');
    now.className = 'history-entry current';
    now.innerHTML = '<div class="history-title">Current version</div><div class="history-sub">What everyone is looking at right now. Every version below is an earlier snapshot.</div>';
    listEl.appendChild(now);

    if(versions.length === 0){
      const empty = document.createElement('div');
      empty.className = 'archive-empty';
      empty.textContent = 'No earlier versions yet. They appear automatically as the board is edited.';
      listEl.appendChild(empty);
      return;
    }
    versions.forEach(v=>{
      const card = document.createElement('div');
      card.className = 'history-entry' + (v.named ? ' named' : '');
      const top = document.createElement('div');
      top.className = 'history-top';
      const title = document.createElement('div');
      title.className = 'history-title';
      title.textContent = v.label || fmtWhen(v.ts);
      top.appendChild(title);
      const rel = document.createElement('div');
      rel.className = 'history-rel';
      rel.textContent = relTime(v.ts);
      top.appendChild(rel);
      card.appendChild(top);
      if(v.label){
        const when = document.createElement('div');
        when.className = 'history-sub';
        when.textContent = fmtWhen(v.ts);
        card.appendChild(when);
      }
      const sum = document.createElement('div');
      sum.className = 'history-sub';
      sum.textContent = v.summary || '';
      card.appendChild(sum);

      const actions = document.createElement('div');
      actions.className = 'archive-actions';
      const pv = document.createElement('button');
      pv.className = 'btn';
      pv.textContent = 'Preview';
      pv.addEventListener('click', ()=>enterPreview(v.id));
      actions.appendChild(pv);
      const rs = document.createElement('button');
      rs.className = 'btn primary';
      rs.textContent = 'Restore';
      rs.addEventListener('click', ()=>restoreVersion(v.id, v.label ? '"' + v.label + '"' : fmtWhen(v.ts)));
      actions.appendChild(rs);
      card.appendChild(actions);
      listEl.appendChild(card);
    });
  }

  async function saveNamedVersion(){
    const input = document.getElementById('historyName');
    const label = input.value.trim();
    if(!label){ input.focus(); return; }
    try{
      await save();   // make sure the server has the very latest edits first
      const res = await fetch('/api/history', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: label })
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      input.value = '';
      renderHistoryList();
    }catch(e){
      alert('Could not save the version — please try again.');
    }
  }

  async function enterPreview(id){
    try{
      const res = await fetch('/api/history/' + id);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const liveBoard = previewing ? previewing.liveBoard : board;
      previewing = { liveBoard: liveBoard, meta: { id: data.id, ts: data.ts, label: data.label } };
      board = ensureTechFields(JSON.parse(data.value));
      document.body.classList.add('previewing');
      document.getElementById('previewWhen').textContent = data.label ? '"' + data.label + '" (' + fmtWhen(data.ts) + ')' : fmtWhen(data.ts);
      closeHistory();
      render();
      renderStatus();
      window.scrollTo(0, 0);
    }catch(e){
      alert('Could not open that version — please try again.');
    }
  }

  function leavePreview(skipRefresh){
    if(!previewing) return;
    board = previewing.liveBoard;
    previewing = null;
    document.body.classList.remove('previewing');
    render();
    renderStatus();
    if(!skipRefresh) refreshFromShared(true);
  }

  async function restoreVersion(id, whenText){
    if(!confirm('Restore the whole board to ' + whenText + '?\n\nThe board as it is right now is saved to history first, so you can undo this.')) return;
    try{
      const res = await fetch('/api/history/' + id + '/restore', { method: 'POST' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      if(previewing) leavePreview(true);
      closeHistory();
      unsavedLocal = false;
      pendingRemote = false;
      for(let i = 0; i < 20 && (saving || isEditingText); i++) await new Promise(r=>setTimeout(r, 100));
      await refreshFromShared(true);
      setStatus('saved', 'Restored ' + whenText);
    }catch(e){
      alert('Restore failed — please try again.');
    }
  }

  function getPlacement(weekId, techId){
    const w = board.placements[weekId];
    if(w && w[techId]) return w[techId];
    return { districtId:'bench', note:'' };
  }
  function setPlacement(weekId, techId, districtId, note){
    if(!board.placements[weekId]) board.placements[weekId] = {};
    board.placements[weekId][techId] = { districtId, note: note||'' };
  }

  function emailValid(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((email||'').trim());
  }

  function deleteTechFromRoster(techId){
    const tech = board.techs.find(t=>t.id===techId);
    const label = tech ? (tech.name || 'this tech') : 'this tech';
    if(!confirm('Remove '+ label +' from the roster entirely? This removes them from every week.')) return;
    board.techs = board.techs.filter(t=>t.id!==techId);
    Object.keys(board.placements).forEach(wid=>{ delete board.placements[wid][techId]; });
    Object.keys(board.dayPlacements).forEach(k=>{
      delete board.dayPlacements[k][techId];
      if(Object.keys(board.dayPlacements[k]).length === 0) delete board.dayPlacements[k];
    });
    save(); render();
  }

  // ============ VIEW MODE (week / day) ============
  const DAYS_PER_WEEK = 5;
  let viewMode = 'week';
  try{ if(localStorage.getItem('crew-board-view') === 'day') viewMode = 'day'; }catch(e){}

  // A "column" is what a cell lives in: a whole week in Week view, or one weekday in Day view.
  function getColumns(){
    const cols = [];
    board.weeks.forEach(week=>{
      if(viewMode === 'day'){
        for(let i=0; i<DAYS_PER_WEEK; i++) cols.push({ weekId:week.id, dayIdx:i, key:week.id+':'+i, week });
      } else {
        cols.push({ weekId:week.id, dayIdx:null, key:week.id, week });
      }
    });
    return cols;
  }

  function colLabel(col){
    const week = col.week;
    if(col.dayIdx == null) return week.date ? formatWeekLabel(week.date) : 'Undated week';
    if(week.date) return formatWeekDayStrip(week.date)[col.dayIdx];
    return ['Mon','Tue','Wed','Thu','Fri'][col.dayIdx] + ' (wk ' + (board.weeks.indexOf(week)+1) + ')';
  }

  // Day-level placements are sparse overrides on top of the week plan.
  function dayPlacementOf(weekId, dayIdx, techId){
    const o = board.dayPlacements && board.dayPlacements[weekId+':'+dayIdx];
    return (o && o[techId]) || null;
  }
  function effPlacement(col, techId){
    if(col.dayIdx != null){
      const o = dayPlacementOf(col.weekId, col.dayIdx, techId);
      if(o) return o;
    }
    return getPlacement(col.weekId, techId);
  }
  function setColPlacement(col, techId, districtId, note){
    note = note || '';
    if(col.dayIdx == null){ setPlacement(col.weekId, techId, districtId, note); return; }
    const base = getPlacement(col.weekId, techId);
    if(base.districtId === districtId && (base.note||'') === note){
      // identical to the week plan, so no override is needed
      if(board.dayPlacements[col.key]){
        delete board.dayPlacements[col.key][techId];
        if(Object.keys(board.dayPlacements[col.key]).length === 0) delete board.dayPlacements[col.key];
      }
    } else {
      if(!board.dayPlacements[col.key]) board.dayPlacements[col.key] = {};
      board.dayPlacements[col.key][techId] = { districtId, note };
    }
  }
  function clearDayOverride(col, techId){
    if(!board.dayPlacements[col.key]) return;
    delete board.dayPlacements[col.key][techId];
    if(Object.keys(board.dayPlacements[col.key]).length === 0) delete board.dayPlacements[col.key];
  }
  // Days in this week where the tech is somewhere other than their week-level district.
  function techDayDiffs(weekId, techId){
    const base = getPlacement(weekId, techId);
    const out = [];
    for(let i=0; i<DAYS_PER_WEEK; i++){
      const o = dayPlacementOf(weekId, i, techId);
      if(o && o.districtId !== base.districtId) out.push({ dayIdx:i, districtId:o.districtId });
    }
    return out;
  }

  // Cell-level note (one per district per week/day), separate from each tech's own note.
  function getCellNote(col, districtId){
    const n = board.cellNotes && board.cellNotes[col.key];
    return (n && n[districtId]) || '';
  }
  function setCellNote(col, districtId, text){
    text = (text || '').trim();
    if(!board.cellNotes[col.key]) board.cellNotes[col.key] = {};
    if(text){
      board.cellNotes[col.key][districtId] = text;
    } else {
      delete board.cellNotes[col.key][districtId];
      if(Object.keys(board.cellNotes[col.key]).length === 0) delete board.cellNotes[col.key];
    }
  }

  // Removes every trace of a week (and its day columns) from the live board.
  function purgeWeekKeys(weekId){
    const prefix = weekId + ':';
    delete board.placements[weekId];
    delete board.cellOrder[weekId];
    delete board.cellNotes[weekId];
    ['dayPlacements','dayOrder','cellNotes'].forEach(name=>{
      Object.keys(board[name] || {}).forEach(k=>{ if(k.indexOf(prefix) === 0) delete board[name][k]; });
    });
  }

  // ============ CELL ORDER ============
  // Keeps an order map ({districtId: [techId,...]}) in sync with placements.
  // Anyone whose placement changed drops out of their old cell's order and is
  // appended to the end of their new cell's order; anyone already correctly
  // placed keeps their position. `rank` (optional) seeds the order of newcomers.
  function reconcileOrderObj(orderObj, getP, techs, rank){
    const seen = new Set();
    Object.keys(orderObj).forEach(distId=>{
      orderObj[distId] = orderObj[distId].filter(tid=>{
        const keep = !seen.has(tid) && techs.some(t=>t.id===tid) && getP(tid).districtId === distId;
        if(keep) seen.add(tid);
        return keep;
      });
    });
    const unseen = techs.filter(t=>!seen.has(t.id));
    if(rank){
      unseen.sort((a,b)=> (rank[a.id]!==undefined ? rank[a.id] : 1e6) - (rank[b.id]!==undefined ? rank[b.id] : 1e6));
    }
    unseen.forEach(tech=>{
      const d = getP(tech.id).districtId;
      if(!orderObj[d]) orderObj[d] = [];
      orderObj[d].push(tech.id);
    });
  }

  function reconcileCellOrder(b){
    if(!b.cellOrder) b.cellOrder = {};
    b.weeks.forEach(week=>{
      if(!b.cellOrder[week.id]) b.cellOrder[week.id] = {};
      reconcileOrderObj(
        b.cellOrder[week.id],
        tid => (b.placements[week.id] && b.placements[week.id][tid]) || { districtId:'bench' },
        b.techs
      );
    });
    return b;
  }

  // Day columns start out ordered like their week, then keep their own order.
  function reconcileDayOrder(b){
    if(!b.dayOrder) b.dayOrder = {};
    b.weeks.forEach(week=>{
      const weekOrder = (b.cellOrder && b.cellOrder[week.id]) || {};
      const rank = {};
      Object.keys(weekOrder).forEach(d=>{ weekOrder[d].forEach((tid,i)=>{ rank[tid] = i; }); });
      for(let i=0; i<DAYS_PER_WEEK; i++){
        const key = week.id + ':' + i;
        if(!b.dayOrder[key]) b.dayOrder[key] = {};
        reconcileOrderObj(b.dayOrder[key], tid=>{
          const o = b.dayPlacements && b.dayPlacements[key] && b.dayPlacements[key][tid];
          if(o) return o;
          return (b.placements[week.id] && b.placements[week.id][tid]) || { districtId:'bench' };
        }, b.techs, rank);
      }
    });
    return b;
  }

  function reconcileAll(){
    reconcileCellOrder(board);
    if(viewMode === 'day') reconcileDayOrder(board);
  }

  function orderObjFor(col){
    if(col.dayIdx == null){
      if(!board.cellOrder[col.weekId]) board.cellOrder[col.weekId] = {};
      return board.cellOrder[col.weekId];
    }
    if(!board.dayOrder[col.key]) board.dayOrder[col.key] = {};
    return board.dayOrder[col.key];
  }

  function moveTechInCell(col, districtId, techId, direction){
    const arr = orderObjFor(col)[districtId] || [];
    const idx = arr.indexOf(techId);
    const newIdx = idx + direction;
    if(idx===-1 || newIdx<0 || newIdx>=arr.length) return;
    [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
    save(); render();
  }

  // Puts a tech into a district for a column. If beforeTechId is given the tech
  // is inserted just ahead of that tech (drag-to-reorder); otherwise appended.
  function placeTech(col, techId, districtId, beforeTechId){
    const existing = effPlacement(col, techId);
    setColPlacement(col, techId, districtId, existing.note);
    const orderObj = orderObjFor(col);
    Object.keys(orderObj).forEach(d=>{ orderObj[d] = orderObj[d].filter(id=>id!==techId); });
    if(!orderObj[districtId]) orderObj[districtId] = [];
    const idx = beforeTechId ? orderObj[districtId].indexOf(beforeTechId) : -1;
    if(idx === -1) orderObj[districtId].push(techId); else orderObj[districtId].splice(idx, 0, techId);
  }

  function moveDistrict(districtId, direction){
    const idx = board.districts.findIndex(d=>d.id===districtId);
    const newIdx = idx + direction;
    if(idx<=0 || newIdx<=0 || newIdx>=board.districts.length) return; // index 0 is bench, stays pinned
    [board.districts[idx], board.districts[newIdx]] = [board.districts[newIdx], board.districts[idx]];
    save(); render();
  }

  function flashCell(colKey, districtId){
    const target = tableEl.querySelector('td.cell[data-col-key="'+colKey+'"][data-district-id="'+districtId+'"]');
    if(target){
      target.classList.add('just-placed');
      setTimeout(()=>{ target.classList.remove('just-placed'); }, 700);
    }
  }

  // Copies every tech in (col, district) into the same district for the adjacent
  // column (previous/next week in Week view, previous/next day in Day view).
  // Additive: nobody already in the target is cleared.
  function copyCellToAdjacentCol(col, districtId, direction){
    const cols = getColumns();
    const idx = cols.findIndex(c=>c.key===col.key);
    const target = cols[idx + direction];
    if(idx === -1 || !target) return;

    reconcileAll();
    const sourceArr = (orderObjFor(col)[districtId] || []).slice();
    if(sourceArr.length === 0) return;

    sourceArr.forEach(techId=>{
      const p = effPlacement(col, techId);
      setColPlacement(target, techId, districtId, p.note || '');
    });
    const srcNote = getCellNote(col, districtId);
    if(srcNote && !getCellNote(target, districtId)) setCellNote(target, districtId, srcNote);

    save(); render();
    flashCell(target.key, districtId);
  }

  let benchCollapsed = false;

  function buildQuickAddSelect(district, cols){
    const sel = document.createElement('select');
    sel.className = 'district-add-select';
    sel.title = 'Schedule someone from the bench into ' + district.label;
    const ph = document.createElement('option');
    ph.value = ''; ph.textContent = '+ Add tech…';
    sel.appendChild(ph);
    let total = 0;
    cols.forEach(col=>{
      const benched = board.techs.filter(t=>effPlacement(col, t.id).districtId === 'bench');
      if(benched.length === 0) return;
      const grp = document.createElement('optgroup');
      grp.label = colLabel(col);
      benched.forEach(t=>{
        const o = document.createElement('option');
        o.value = col.key + '|' + t.id;
        o.textContent = t.name || '(unnamed)';
        grp.appendChild(o);
        total++;
      });
      sel.appendChild(grp);
    });
    if(total === 0){ ph.textContent = 'No one on bench'; sel.disabled = true; }
    sel.addEventListener('focus', ()=>{ isEditingText = true; });
    sel.addEventListener('blur', ()=>{ isEditingText = false; });
    sel.addEventListener('change', ()=>{
      if(!sel.value) return;
      const parts = sel.value.split('|');
      const col = getColumns().find(c=>c.key === parts[0]);
      isEditingText = false;
      if(!col) return;
      placeTech(col, parts[1], district.id);
      save(); render();
      flashCell(col.key, district.id);
    });
    return sel;
  }

  function buildCellNote(col, district){
    const el = document.createElement('div');
    el.className = 'cell-note';
    el.contentEditable = true;
    el.textContent = getCellNote(col, district.id);
    el.title = 'Note for ' + district.label + ' this ' + (col.dayIdx == null ? 'week' : 'day');
    el.addEventListener('focus', ()=>{ isEditingText = true; });
    el.addEventListener('blur', ()=>{
      isEditingText = false;
      setCellNote(col, district.id, el.textContent);
      save();
    });
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); el.blur(); }
    });
    return el;
  }

  function buildDistrictRow(district, isBench, isFirst, isLast, cols){
    const tr = document.createElement('tr');
    if(isBench) tr.className = 'bench-row';

    const rowHead = document.createElement('td');
    rowHead.className = 'district-head' + (isBench ? ' bench-head' : '');
    const rowActions = document.createElement('div');
    rowActions.className = 'district-row-actions';
    const dInput = document.createElement('input');
    dInput.className = 'district-title';
    dInput.value = district.label;
    dInput.addEventListener('focus', ()=>{ isEditingText = true; });
    dInput.addEventListener('blur', ()=>{ isEditingText = false; district.label = dInput.value; save(); });
    rowActions.appendChild(dInput);

    if(isBench){
      const toggle = document.createElement('button');
      toggle.className = 'bench-collapse-btn';
      toggle.textContent = benchCollapsed ? 'Show' : 'Hide';
      toggle.title = benchCollapsed ? 'Show unassigned techs' : 'Hide unassigned techs';
      toggle.addEventListener('click', ()=>{ benchCollapsed = !benchCollapsed; render(); });
      rowActions.appendChild(toggle);
    } else {
      const moveUp = document.createElement('button');
      moveUp.className = 'mini-move'; moveUp.textContent = '▲'; moveUp.title = 'Move district up';
      moveUp.disabled = !!isFirst;
      moveUp.addEventListener('click', ()=>moveDistrict(district.id, -1));
      rowActions.appendChild(moveUp);

      const moveDown = document.createElement('button');
      moveDown.className = 'mini-move'; moveDown.textContent = '▼'; moveDown.title = 'Move district down';
      moveDown.disabled = !!isLast;
      moveDown.addEventListener('click', ()=>moveDistrict(district.id, 1));
      rowActions.appendChild(moveDown);

      const rm = document.createElement('button');
      rm.className = 'mini-x'; rm.innerHTML = '&times;'; rm.title = 'Delete district';
      rm.addEventListener('click', ()=>{
        if(confirm('Delete "'+district.label+'"? Anyone assigned there goes back to the bench.')){
          Object.keys(board.placements).forEach(wid=>{
            Object.keys(board.placements[wid]).forEach(tid=>{
              if(board.placements[wid][tid].districtId === district.id){
                board.placements[wid][tid].districtId = 'bench';
              }
            });
          });
          Object.keys(board.dayPlacements).forEach(k=>{
            Object.keys(board.dayPlacements[k]).forEach(tid=>{
              if(board.dayPlacements[k][tid].districtId === district.id){
                board.dayPlacements[k][tid].districtId = 'bench';
              }
            });
          });
          Object.keys(board.cellNotes).forEach(k=>{ delete board.cellNotes[k][district.id]; });
          board.districts = board.districts.filter(d=>d.id!==district.id);
          save(); render();
        }
      });
      rowActions.appendChild(rm);
    }
    rowHead.appendChild(rowActions);
    if(isBench){
      const eyebrow = document.createElement('div');
      eyebrow.className = 'bench-eyebrow';
      eyebrow.textContent = viewMode === 'day' ? 'UNASSIGNED THIS DAY' : 'UNASSIGNED THIS WEEK';
      rowHead.insertBefore(eyebrow, rowHead.firstChild);
    } else {
      rowHead.appendChild(buildQuickAddSelect(district, cols));
    }
    tr.appendChild(rowHead);

    cols.forEach((col, colIdx)=>{
      const td = document.createElement('td');
      td.className = 'cell';
      td.dataset.weekId = col.weekId;
      td.dataset.colKey = col.key;
      td.dataset.districtId = district.id;

      const orderArr = orderObjFor(col)[district.id] || [];
      const techsHere = orderArr.map(tid => board.techs.find(t=>t.id===tid)).filter(Boolean);
      if(techsHere.length > 0){
        td.classList.add('has-techs');
      }

      if(techsHere.length > 0 && !(isBench && benchCollapsed)){
        const controls = document.createElement('div');
        controls.className = 'cell-copy-controls';
        const unit = col.dayIdx == null ? 'week' : 'day';

        const leftBtn = document.createElement('button');
        leftBtn.className = 'cell-copy-btn';
        leftBtn.textContent = '←';
        leftBtn.title = 'Copy this crew to the previous ' + unit;
        leftBtn.disabled = colIdx === 0;
        leftBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          copyCellToAdjacentCol(col, district.id, -1);
        });
        controls.appendChild(leftBtn);

        const rightBtn = document.createElement('button');
        rightBtn.className = 'cell-copy-btn';
        rightBtn.textContent = '→';
        rightBtn.title = 'Copy this crew to the next ' + unit;
        rightBtn.disabled = colIdx === cols.length - 1;
        rightBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          copyCellToAdjacentCol(col, district.id, 1);
        });
        controls.appendChild(rightBtn);

        td.appendChild(controls);
        td.classList.add('has-copy-space');
      }

      if(isBench && benchCollapsed){
        const hint = document.createElement('div');
        hint.className = 'bench-collapsed-hint';
        hint.textContent = techsHere.length + ' unassigned';
        td.appendChild(hint);
      } else {
        if(techsHere.length === 0){
          const hint = document.createElement('div');
          hint.className = 'empty-cell-hint';
          hint.textContent = isBench ? '' : 'Drop a tech here';
          td.appendChild(hint);
        }
        // The bench is capped in height and scrolls; other cells grow with their crew.
        let holder = td;
        if(isBench && techsHere.length > 0){
          holder = document.createElement('div');
          holder.className = 'bench-scroll';
          td.appendChild(holder);
        }
        techsHere.forEach((tech, idx)=>{
          holder.appendChild(renderChip(tech, col, district, idx, techsHere.length));
        });
        if(!isBench) td.appendChild(buildCellNote(col, district));
      }

      td.addEventListener('dragover', (e)=>{
        if(dragFromCol !== col.key) return;
        e.preventDefault();
        td.classList.add('drag-over');
      });
      td.addEventListener('dragleave', ()=>{ td.classList.remove('drag-over'); });
      td.addEventListener('drop', (e)=>{
        e.preventDefault();
        td.classList.remove('drag-over');
        if(!dragTechId || dragFromCol !== col.key) return;
        placeTech(col, dragTechId, district.id);
        const flashKey = col.key;
        dragTechId = null; dragFromCol = null;
        save(); render();
        flashCell(flashKey, district.id);
      });

      tr.appendChild(td);
    });

    const spacerTd = document.createElement('td');
    tr.appendChild(spacerTd);

    return tr;
  }

  function buildWeekHead(week, dayMode){
    const th = document.createElement('th');
    th.className = 'week-head';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'week-title';
    titleDiv.textContent = week.date ? formatWeekLabel(week.date) : 'New week';
    th.appendChild(titleDiv);

    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.className = 'week-date-input';
    dateInput.value = week.date || '';
    dateInput.addEventListener('focus', ()=>{ isEditingText = true; });
    dateInput.addEventListener('change', ()=>{
      isEditingText = false;
      week.date = dateInput.value;
      save(); render();
    });
    dateInput.addEventListener('blur', ()=>{ isEditingText = false; });
    th.appendChild(dateInput);

    if(!dayMode){
      if(week.date){
        const strip = document.createElement('div');
        strip.className = 'week-daystrip';
        formatWeekDayStrip(week.date).forEach(dayLabel=>{
          const d = document.createElement('span');
          d.className = 'daystrip-day';
          d.textContent = dayLabel;
          strip.appendChild(d);
        });
        th.appendChild(strip);
      } else {
        const hint = document.createElement('div');
        hint.className = 'week-nodate';
        hint.textContent = 'Pick a start date →';
        th.appendChild(hint);
      }
    }

    const actions = document.createElement('div');
    actions.className = 'col-actions';
    const rm = document.createElement('button');
    rm.className = 'mini-x'; rm.innerHTML = '&times;'; rm.title = 'Archive week';
    rm.addEventListener('click', ()=>{
      const label = week.date ? formatWeekLabel(week.date) : 'this week';
      if(confirm('Archive "'+label+'"? It will move out of the active board, but you can restore it later from Archive.')){
        archiveWeek(week.id);
      }
    });
    actions.appendChild(rm);
    th.appendChild(actions);
    return th;
  }

  // In Day view the header has two sticky rows; the second sits just below the first.
  function fixDayHeaderOffset(){
    const first = tableEl.querySelector('thead tr:first-child');
    const second = tableEl.querySelector('thead tr:nth-child(2)');
    if(!first || !second) return;
    const h = first.getBoundingClientRect().height;
    second.querySelectorAll('th').forEach(th=>{ th.style.top = h + 'px'; });
  }

  function render(){
    reconcileAll();
    const cols = getColumns();
    const dayMode = viewMode === 'day';
    tableEl.className = 'grid' + (dayMode ? ' day-mode' : '');
    tableEl.innerHTML = "";

    // header row(s)
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'corner';
    if(dayMode) corner.rowSpan = 2;
    headRow.appendChild(corner);

    board.weeks.forEach(week=>{
      const th = buildWeekHead(week, dayMode);
      if(dayMode) th.colSpan = DAYS_PER_WEEK;
      headRow.appendChild(th);
    });

    const addWeekTh = document.createElement('th');
    addWeekTh.className = 'add-week-cell';
    if(dayMode) addWeekTh.rowSpan = 2;
    const addWeekBtnCell = document.createElement('button');
    addWeekBtnCell.textContent = '+ Week';
    addWeekBtnCell.addEventListener('click', addWeek);
    addWeekTh.appendChild(addWeekBtnCell);
    headRow.appendChild(addWeekTh);
    thead.appendChild(headRow);

    if(dayMode){
      const dayRow = document.createElement('tr');
      cols.forEach(col=>{
        const th = document.createElement('th');
        th.className = 'day-head';
        th.textContent = colLabel(col);
        dayRow.appendChild(th);
      });
      thead.appendChild(dayRow);
    }
    tableEl.appendChild(thead);

    // body rows: bench shelf first (visually separated), then one row per district
    const tbody = document.createElement('tbody');

    const benchDistrict = board.districts.find(d => d.id === 'bench');
    const otherDistricts = board.districts.filter(d => d.id !== 'bench');

    if(benchDistrict){
      tbody.appendChild(buildDistrictRow(benchDistrict, true, false, false, cols));
    }
    otherDistricts.forEach((district, idx)=>{
      tbody.appendChild(buildDistrictRow(district, false, idx===0, idx===otherDistricts.length-1, cols));
    });

    // add-district row
    const addTr = document.createElement('tr');
    addTr.className = 'add-district-row';
    const addTd = document.createElement('td');
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ Add district';
    addBtn.addEventListener('click', addDistrict);
    addTd.appendChild(addBtn);
    addTr.appendChild(addTd);
    cols.forEach(()=>{ addTr.appendChild(document.createElement('td')); });
    addTr.appendChild(document.createElement('td'));
    tbody.appendChild(addTr);

    tableEl.appendChild(tbody);
    if(dayMode) fixDayHeaderOffset();
    if(activeTab === 'techPool') renderTechPool();
  }

  // ============ TECH POOL ============
  function renderTechPool(){
    const gridEl = document.getElementById('poolGrid');
    const countEl = document.getElementById('poolCount');
    const searchEl = document.getElementById('poolSearch');
    const term = (searchEl.value || '').trim().toLowerCase();

    const filtered = board.techs.filter(t => !term || (t.name||'').toLowerCase().includes(term));
    countEl.textContent = filtered.length + ' of ' + board.techs.length + ' techs';

    gridEl.innerHTML = '';
    if(board.techs.length === 0){
      const empty = document.createElement('div');
      empty.className = 'pool-empty';
      empty.textContent = 'No techs yet \u2014 use "+ Add tech" to build the roster.';
      gridEl.appendChild(empty);
      return;
    }
    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'pool-empty';
      empty.textContent = 'No techs match "' + searchEl.value + '".';
      gridEl.appendChild(empty);
      return;
    }

    filtered.forEach(tech=>{
      gridEl.appendChild(renderPoolCard(tech));
    });
  }

  function makePoolField(labelText, tech, fieldName, placeholder, isEmail){
    const wrap = document.createElement('div');
    wrap.className = 'pool-field';
    const label = document.createElement('label');
    label.textContent = labelText;
    wrap.appendChild(label);
    const input = document.createElement('input');
    input.type = isEmail ? 'email' : 'text';
    input.value = tech[fieldName] || '';
    input.placeholder = placeholder || '';

      isEditingText = false;
      tech[fieldName] = input.value.trim();
      save(); renderTechPool();
    });

    return wrap;
  }

  function renderChip(tech, col, district, posIdx, cellSize){
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.style.borderLeftColor = tech.color;
    chip.draggable = true;

    const hasDayOverride = col.dayIdx != null && !!dayPlacementOf(col.weekId, col.dayIdx, tech.id);
    if(hasDayOverride) chip.classList.add('day-override');

    chip.addEventListener('dragstart', ()=>{
      dragTechId = tech.id; dragFromCol = col.key;
      chip.classList.add('dragging');
    });
    chip.addEventListener('dragend', ()=>{
      chip.classList.remove('dragging');
      dragTechId = null; dragFromCol = null;
      tableEl.querySelectorAll('.drop-before').forEach(el=>el.classList.remove('drop-before'));
    });

    // Dropping on a chip inserts the dragged tech just ahead of it (reorder / insert).
    chip.addEventListener('dragover', (e)=>{
      if(!dragTechId || dragFromCol !== col.key || dragTechId === tech.id) return;
      e.preventDefault(); e.stopPropagation();
      chip.classList.add('drop-before');
    });
    chip.addEventListener('dragleave', ()=>{ chip.classList.remove('drop-before'); });
    chip.addEventListener('drop', (e)=>{
      if(!dragTechId || dragFromCol !== col.key || dragTechId === tech.id) return;
      e.preventDefault(); e.stopPropagation();
      chip.classList.remove('drop-before');
      placeTech(col, dragTechId, district.id, tech.id);
      const flashKey = col.key;
      dragTechId = null; dragFromCol = null;
      save(); render();
      flashCell(flashKey, district.id);
    });

    const top = document.createElement('div');
    top.className = 'chip-top';

    const nameEl = document.createElement('div');
    nameEl.className = 'chip-name';
    nameEl.contentEditable = true;
    nameEl.textContent = tech.name;
    nameEl.addEventListener('focus', ()=>{ isEditingText = true; });
    nameEl.addEventListener('blur', ()=>{
      isEditingText = false;
      tech.name = nameEl.textContent.trim();
      save();
    });
    top.appendChild(nameEl);

    const profileBtn = document.createElement('button');
    profileBtn.className = 'chip-profile-btn' + (tech.role||tech.phone||tech.detail ? ' has-detail' : '');
    profileBtn.textContent = 'i';
    profileBtn.title = 'View / edit profile';
    profileBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openProfile(tech.id);
    });
    chip.appendChild(profileBtn);

    const rm = document.createElement('button');
    rm.className = 'chip-x';
    rm.innerHTML = '&times;';
    rm.title = district.id==='bench' ? 'Remove from roster' : 'Send back to bench';
    rm.addEventListener('click', ()=>{
      if(district.id==='bench'){
        deleteTechFromRoster(tech.id);
      } else {
        setColPlacement(col, tech.id, 'bench', '');
        save(); render();
      }
    });
    top.appendChild(rm);
    chip.appendChild(top);

    const note = document.createElement('div');
    note.className = 'chip-note';
    note.contentEditable = true;
    const placement = effPlacement(col, tech.id);
    note.textContent = placement.note || '';
    note.addEventListener('focus', ()=>{ isEditingText = true; });
    note.addEventListener('blur', ()=>{
      isEditingText = false;
      setColPlacement(col, tech.id, district.id, note.textContent.trim());
      save();
    });
    chip.appendChild(note);

    const districtSelect = document.createElement('select');
    districtSelect.className = 'chip-district-select';
    districtSelect.title = 'Reassign to a different district for this ' + (col.dayIdx == null ? 'week' : 'day');
    board.districts.forEach(d=>{
      const opt = document.createElement('option');
      opt.value = d.id;
      opt.textContent = d.id==='bench' ? 'Bench / Unassigned' : d.label;
      if(d.id === district.id) opt.selected = true;
      districtSelect.appendChild(opt);
    });
    districtSelect.addEventListener('mousedown', (e)=>{ e.stopPropagation(); });
    districtSelect.addEventListener('click', (e)=>{ e.stopPropagation(); });
    districtSelect.addEventListener('focus', ()=>{ isEditingText = true; });
    districtSelect.addEventListener('blur', ()=>{ isEditingText = false; });
    districtSelect.addEventListener('change', ()=>{
      const newDistrictId = districtSelect.value;
      isEditingText = false;
      if(newDistrictId === district.id) return;
      placeTech(col, tech.id, newDistrictId);
      const flashKey = col.key;
      save(); render();
      flashCell(flashKey, newDistrictId);
    });
    chip.appendChild(districtSelect);

    if(col.dayIdx == null){
      const diffs = techDayDiffs(col.weekId, tech.id);
      if(diffs.length > 0){
        const badge = document.createElement('div');
        badge.className = 'chip-badge';
        badge.textContent = 'Days differ';
        badge.title = diffs.map(df=>{
          const d = board.districts.find(x=>x.id===df.districtId);
          const dayName = ['Mon','Tue','Wed','Thu','Fri'][df.dayIdx];
          return dayName + ': ' + (df.districtId==='bench' ? 'Bench' : (d ? d.label : '?'));
        }).join('\n') + '\n(Switch to Day view to edit)';
        chip.appendChild(badge);
      }
    } else if(hasDayOverride){
      const reset = document.createElement('button');
      reset.className = 'chip-reset';
      reset.textContent = '↺ week plan';
      reset.title = 'Remove this day-specific change and follow the week plan again';
      reset.addEventListener('click', (e)=>{
        e.stopPropagation();
        clearDayOverride(col, tech.id);
        save(); render();
      });
      chip.appendChild(reset);
    }

    if(cellSize > 1){
      const reorder = document.createElement('div');
      reorder.className = 'chip-reorder';

      const up = document.createElement('button');
      up.className = 'chip-move-btn'; up.textContent = '▲'; up.title = 'Move up';
      up.disabled = posIdx === 0;
      up.addEventListener('click', (e)=>{
        e.stopPropagation();
        moveTechInCell(col, district.id, tech.id, -1);
      });
      reorder.appendChild(up);

      const down = document.createElement('button');
      down.className = 'chip-move-btn'; down.textContent = '▼'; down.title = 'Move down';
      down.disabled = posIdx === cellSize - 1;
      down.addEventListener('click', (e)=>{
        e.stopPropagation();
        moveTechInCell(col, district.id, tech.id, 1);
      });
      reorder.appendChild(down);

      chip.appendChild(reorder);
    }

    return chip;
  }
