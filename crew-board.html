  async function restoreVersion(id, whenText){
    if(!confirm('Restore the whole board to ' + whenText + '?\n\nThe board as it is right now is saved to history first, so you can undo this.')) return;
    try{
      const res = await fetch('/api/history/' + id + '/restore', { method: 'POST' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      if(previewing) leavePreview(true);
      closeHistory();
      unsavedLocal = false;
      pendingRemote = false;
      for(let i = 0; i < 20 && (saving || isEditingText); i++) await new Promise(r=>setTimeout(r, 100));
      await refreshFromShared(true);
      setStatus('saved', 'Restored ' + whenText);
    }catch(e){
      alert('Restore failed — please try again.');
    }
  }

  function getPlacement(weekId, techId){
    const w = board.placements[weekId];
    if(w && w[techId]) return w[techId];
    return { districtId:'bench', note:'' };
  }
  function mkPlacement(districtId, note, f){
    const o = { districtId, note: note||'' };
    if(districtId !== 'bench' && f){
      if(f.start) o.start = f.start;
      if(f.wo) o.wo = f.wo;
      if(f.done) o.done = true;
    }
    return o;
  }
  function samePlacement(a, b){
    return a.districtId === b.districtId && (a.note||'') === (b.note||'') && (a.start||'') === (b.start||'')
        && (a.wo||'') === (b.wo||'') && !!a.done === !!b.done;
  }
  function setPlacement(weekId, techId, districtId, note, f){
    if(!board.placements[weekId]) board.placements[weekId] = {};
    board.placements[weekId][techId] = mkPlacement(districtId, note, f);
    activateJob(weekId, districtId);
  }

  // ============ PER-WEEK JOB LIST ============
  // board.districts is the library of every job/school ever used; board.weekJobs says which ones are on a given week.
  function activateJob(weekId, districtId){
    if(!districtId || districtId === 'bench') return;
    if(!board.weekJobs[weekId]) board.weekJobs[weekId] = {};
    board.weekJobs[weekId][districtId] = true;
  }
  function isJobActiveIn(weekId, districtId){
    return !!(board.weekJobs[weekId] && board.weekJobs[weekId][districtId]);
  }
  // Anything that is assigned to a job makes that job part of its week (covers merges, restores, copies).
  function syncWeekJobs(){
    const weekIds = new Set(board.weeks.map(w=>w.id));
    Object.keys(board.placements).forEach(wid=>{
      if(!weekIds.has(wid)) return;
      Object.keys(board.placements[wid]).forEach(tid=>activateJob(wid, board.placements[wid][tid].districtId));
    });
    ['dayPlacements','extras'].forEach(name=>{
      Object.keys(board[name] || {}).forEach(k=>{
        const wid = k.split(':')[0];
        if(!weekIds.has(wid)) return;
        Object.keys(board[name][k]).forEach(id=>activateJob(wid, board[name][k][id].districtId));
      });
    });
  }

  // ============ ADDITIONAL JOBS (Day view: several jobs for one tech on one day) ============
  function getExtras(col){ return (col.dayIdx != null && board.extras[col.key]) || {}; }
  function extraList(col){
    const m = getExtras(col);
    return Object.keys(m).map(id=>Object.assign({ id }, m[id])).filter(x=>board.techs.some(t=>t.id === x.techId))
      .sort((a,b)=> (a.start||'99:99') < (b.start||'99:99') ? -1 : (a.start||'99:99') > (b.start||'99:99') ? 1 : 0);
  }
  function addExtra(col, techId, districtId){
    if(col.dayIdx == null) return null;
    if(!board.extras[col.key]) board.extras[col.key] = {};
    const id = uid();
    board.extras[col.key][id] = { techId, districtId: districtId || '', note:'', start:'', wo:'', done:false };
    activateJob(col.weekId, districtId);
    return id;
  }
  function removeExtra(col, id){
    if(!board.extras[col.key]) return;
    delete board.extras[col.key][id];
    if(Object.keys(board.extras[col.key]).length === 0) delete board.extras[col.key];
  }
  function isTechAssigned(col, techId){
    if(effPlacement(col, techId).districtId !== 'bench') return true;
    return extraList(col).some(x=>x.techId === techId && x.districtId && x.districtId !== 'bench');
  }
  // One job "reference": {} = the tech's main placement, {x:id} = an additional job.
  function jobOf(col, techId, ref){
    if(ref && ref.x) return getExtras(col)[ref.x] || null;
    return effPlacement(col, techId);
  }
  function patchJob(col, techId, ref, patch){
    if(ref && ref.x){
      const x = getExtras(col)[ref.x];
      if(!x) return;
      if(patch.districtId !== undefined && patch.districtId !== x.districtId){ x.done = false; activateJob(col.weekId, patch.districtId); }
      Object.assign(x, patch);
      return;
    }
    const cur = effPlacement(col, techId);
    const f = {};
    ['start','wo','done'].forEach(k=>{ if(patch[k] !== undefined) f[k] = patch[k]; });
    setColPlacement(col, techId,
      patch.districtId !== undefined ? patch.districtId : cur.districtId,
      patch.note !== undefined ? patch.note : cur.note,
      Object.keys(f).length ? f : undefined);
  }
  // Main + additional jobs for a tech in a column, in start-time order (main job first on ties).
  function techJobs(col, techId){
    const list = [{ ref:{}, job: effPlacement(col, techId) }];
    extraList(col).filter(x=>x.techId === techId).forEach(x=>list.push({ ref:{ x:x.id }, job:x }));
    return list.map((j,i)=>({ j, i })).sort((a,b)=>{
      const ka = a.j.job.start || '99:99', kb = b.j.job.start || '99:99';
      return ka < kb ? -1 : ka > kb ? 1 : a.i - b.i;
    }).map(o=>o.j);
  }
  // When a tech's main job goes away but they have additional jobs that day, the earliest one is promoted.
  function sendPrimaryToBench(col, techId){
    if(col.dayIdx != null){
      const xs = extraList(col).filter(x=>x.techId === techId && x.districtId && x.districtId !== 'bench');
      if(xs.length){
        const x = xs[0];
        setColPlacement(col, techId, x.districtId, x.note, { start:x.start||'', wo:x.wo||'', done:!!x.done });
        removeExtra(col, x.id);
        return;
      }
    }
    setColPlacement(col, techId, 'bench', '');
  }
  function assignTechToJob(col, techId, districtId){
    const cur = effPlacement(col, techId);
    if(cur.districtId !== 'bench' && col.dayIdx != null){
      if(cur.districtId === districtId) return null;
      return addExtra(col, techId, districtId);
    }
    placeTech(col, techId, districtId);
    return true;
  }
  function fmtTime(hhmm){
    if(!hhmm) return '';
    const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm);
    if(!m) return hhmm;
    let h = +m[1]; const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12;
    return h + (m[2] === '00' ? '' : ':' + m[2]) + ap;
  }
  function jobMeta(p){
    const bits = [];
    if(p.start) bits.push(fmtTime(p.start));
    if(p.wo) bits.push('WO ' + p.wo);
    return bits.join(' \u00b7 ');
  }

  function emailValid(email){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((email||'').trim());
  }

  function deleteTechFromRoster(techId){
    const tech = board.techs.find(t=>t.id===techId);
    const label = tech ? (tech.name || 'this tech') : 'this tech';
    if(!confirm('Remove '+ label +' from the roster entirely? This removes them from every week.')) return;
    board.techs = board.techs.filter(t=>t.id!==techId);
    Object.keys(board.placements).forEach(wid=>{ delete board.placements[wid][techId]; });
    Object.keys(board.dayPlacements).forEach(k=>{
      delete board.dayPlacements[k][techId];
      if(Object.keys(board.dayPlacements[k]).length === 0) delete board.dayPlacements[k];
    });
    Object.keys(board.extras).forEach(k=>{
      Object.keys(board.extras[k]).forEach(id=>{ if(board.extras[k][id].techId === techId) delete board.extras[k][id]; });
      if(Object.keys(board.extras[k]).length === 0) delete board.extras[k];
    });
    save(); render();
  }

  // ============ VIEW MODE (week / day) ============
  const DAYS_PER_WEEK = 5;
  let layoutMode = 'district';
  try{ if(localStorage.getItem('crew-board-layout') === 'tech') layoutMode = 'tech'; }catch(e){}
  let keyEditing = false;
  let viewMode = 'week';
  try{ if(localStorage.getItem('crew-board-view') === 'day') viewMode = 'day'; }catch(e){}

  // Which week(s) are on screen: one week at a time (default) or all of them.
  let weekFocus = '';
  try{ weekFocus = localStorage.getItem('crew-board-week') || ''; }catch(e){}
  function setWeekFocus(v){
    weekFocus = v;
    try{ localStorage.setItem('crew-board-week', v); }catch(e){}
  }
  function defaultWeek(){
    const ws = board.weeks;
    if(ws.length === 0) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const dated = ws.filter(w=>w.date).map(w=>({ w, d: parseISODate(w.date) })).filter(x=>x.d);
    const cur = dated.find(x=>today >= x.d && today < new Date(x.d.getTime() + 7*86400000));
    if(cur) return cur.w;
    const next = dated.filter(x=>x.d > today).sort((a,b)=>a.d - b.d)[0];
    if(next) return next.w;
    const last = dated.sort((a,b)=>b.d - a.d)[0];
    return last ? last.w : ws[ws.length-1];
  }
  function focusedWeek(){
    if(weekFocus === 'all') return null;
    let w = board.weeks.find(x=>x.id === weekFocus);
    if(!w){ w = defaultWeek(); if(w) setWeekFocus(w.id); else return null; }
    return w;
  }
  function shownWeeks(){ const f = focusedWeek(); return f ? [f] : board.weeks; }

  // A "column" is what a cell lives in: a whole week in Week view, or one weekday in Day view.
  function getColumns(){
    const cols = [];
    shownWeeks().forEach(week=>{
      if(viewMode === 'day'){
        for(let i=0; i<DAYS_PER_WEEK; i++) cols.push({ weekId:week.id, dayIdx:i, key:week.id+':'+i, week });
      } else {
        cols.push({ weekId:week.id, dayIdx:null, key:week.id, week });
      }
    });
    return cols;
  }

  function colLabel(col){
    const week = col.week;
    if(col.dayIdx == null) return week.date ? formatWeekLabel(week.date) : 'Undated week';
    if(week.date) return formatWeekDayStrip(week.date)[col.dayIdx];
    return ['Mon','Tue','Wed','Thu','Fri'][col.dayIdx] + ' (wk ' + (board.weeks.indexOf(week)+1) + ')';
  }

  // Day-level placements are sparse overrides on top of the week plan.
  function dayPlacementOf(weekId, dayIdx, techId){
    const o = board.dayPlacements && board.dayPlacements[weekId+':'+dayIdx];
    return (o && o[techId]) || null;
  }
  function effPlacement(col, techId){
    if(col.dayIdx != null){
      const o = dayPlacementOf(col.weekId, col.dayIdx, techId);
      if(o) return o;
    }
    return getPlacement(col.weekId, techId);
  }
  // patch (optional) = {start, wo, done}. Without it the time / work order / done flag carry over;
  // moving to a different job clears "done" because the new job still has to be transferred.
  function setColPlacement(col, techId, districtId, note, patch){
    note = note || '';
    const cur = effPlacement(col, techId);
    const f = { start: cur.start||'', wo: cur.wo||'', done: !!cur.done };
    if(districtId !== cur.districtId) f.done = false;
    if(patch) Object.assign(f, patch);
    const rec = mkPlacement(districtId, note, f);
    activateJob(col.weekId, districtId);
    if(col.dayIdx == null){
      if(!board.placements[col.weekId]) board.placements[col.weekId] = {};
      board.placements[col.weekId][techId] = rec;
      return;
    }
    const base = getPlacement(col.weekId, techId);
    if(samePlacement(base, rec)){
      // identical to the week plan, so no override is needed
      if(board.dayPlacements[col.key]){
        delete board.dayPlacements[col.key][techId];
        if(Object.keys(board.dayPlacements[col.key]).length === 0) delete board.dayPlacements[col.key];
      }
    } else {
      if(!board.dayPlacements[col.key]) board.dayPlacements[col.key] = {};
      board.dayPlacements[col.key][techId] = rec;
    }
  }
  function clearDayOverride(col, techId){
    if(!board.dayPlacements[col.key]) return;
    delete board.dayPlacements[col.key][techId];
    if(Object.keys(board.dayPlacements[col.key]).length === 0) delete board.dayPlacements[col.key];
  }
  // Days in this week where the tech is somewhere other than their week-level district.
  function techDayDiffs(weekId, techId){
    const base = getPlacement(weekId, techId);
    const out = [];
    for(let i=0; i<DAYS_PER_WEEK; i++){
      const o = dayPlacementOf(weekId, i, techId);
      if(o && o.districtId !== base.districtId) out.push({ dayIdx:i, districtId:o.districtId });
      extraList({ weekId, dayIdx:i, key:weekId+':'+i }).filter(x=>x.techId === techId && x.districtId).forEach(x=>{
        out.push({ dayIdx:i, districtId:x.districtId, extra:true });
      });
    }
    return out;
  }

  // Cell-level note (one per district per week/day), separate from each tech's own note.
  function getCellNote(col, districtId){
    const n = board.cellNotes && board.cellNotes[col.key];
    return (n && n[districtId]) || '';
  }
  function setCellNote(col, districtId, text){
    text = (text || '').trim();
    if(!board.cellNotes[col.key]) board.cellNotes[col.key] = {};
    if(text){
      board.cellNotes[col.key][districtId] = text;
    } else {
      delete board.cellNotes[col.key][districtId];
      if(Object.keys(board.cellNotes[col.key]).length === 0) delete board.cellNotes[col.key];
    }
  }

  // Removes every trace of a week (and its day columns) from the live board.
  function purgeWeekKeys(weekId){
    const prefix = weekId + ':';
    delete board.placements[weekId];
    delete board.cellOrder[weekId];
    delete board.cellNotes[weekId];
    delete board.weekJobs[weekId];
    ['dayPlacements','dayOrder','cellNotes','extras'].forEach(name=>{
      Object.keys(board[name] || {}).forEach(k=>{ if(k.indexOf(prefix) === 0) delete board[name][k]; });
    });
  }

  // ============ CELL ORDER ============
  // Keeps an order map ({districtId: [techId,...]}) in sync with placements.
  // Anyone whose placement changed drops out of their old cell's order and is
  // appended to the end of their new cell's order; anyone already correctly
  // placed keeps their position. `rank` (optional) seeds the order of newcomers.
  function reconcileOrderObj(orderObj, getP, techs, rank){
    const seen = new Set();
    Object.keys(orderObj).forEach(distId=>{
      orderObj[distId] = orderObj[distId].filter(tid=>{
        const keep = !seen.has(tid) && techs.some(t=>t.id===tid) && getP(tid).districtId === distId;
        if(keep) seen.add(tid);
        return keep;
      });
    });
    const unseen = techs.filter(t=>!seen.has(t.id));
    if(rank){
      unseen.sort((a,b)=> (rank[a.id]!==undefined ? rank[a.id] : 1e6) - (rank[b.id]!==undefined ? rank[b.id] : 1e6));
    }
    unseen.forEach(tech=>{
      const d = getP(tech.id).districtId;
      if(!orderObj[d]) orderObj[d] = [];
      orderObj[d].push(tech.id);
    });
  }

  function reconcileCellOrder(b){
    if(!b.cellOrder) b.cellOrder = {};
    b.weeks.forEach(week=>{
      if(!b.cellOrder[week.id]) b.cellOrder[week.id] = {};
      reconcileOrderObj(
        b.cellOrder[week.id],
        tid => (b.placements[week.id] && b.placements[week.id][tid]) || { districtId:'bench' },
        b.techs
      );
    });
    return b;
  }

  // Day columns start out ordered like their week, then keep their own order.
  function reconcileDayOrder(b){
    if(!b.dayOrder) b.dayOrder = {};
    b.weeks.forEach(week=>{
      const weekOrder = (b.cellOrder && b.cellOrder[week.id]) || {};
      const rank = {};
      Object.keys(weekOrder).forEach(d=>{ weekOrder[d].forEach((tid,i)=>{ rank[tid] = i; }); });
      for(let i=0; i<DAYS_PER_WEEK; i++){
        const key = week.id + ':' + i;
        if(!b.dayOrder[key]) b.dayOrder[key] = {};
        reconcileOrderObj(b.dayOrder[key], tid=>{
          const o = b.dayPlacements && b.dayPlacements[key] && b.dayPlacements[key][tid];
          if(o) return o;
          return (b.placements[week.id] && b.placements[week.id][tid]) || { districtId:'bench' };
        }, b.techs, rank);
      }
    });
    return b;
  }

  function reconcileAll(){
    syncWeekJobs();
    reconcileCellOrder(board);
    if(viewMode === 'day') reconcileDayOrder(board);
  }

  function orderObjFor(col){
    if(col.dayIdx == null){
      if(!board.cellOrder[col.weekId]) board.cellOrder[col.weekId] = {};
      return board.cellOrder[col.weekId];
    }
    if(!board.dayOrder[col.key]) board.dayOrder[col.key] = {};
    return board.dayOrder[col.key];
  }

  function moveTechInCell(col, districtId, techId, direction){
    const arr = orderObjFor(col)[districtId] || [];
    const idx = arr.indexOf(techId);
    const newIdx = idx + direction;
    if(idx===-1 || newIdx<0 || newIdx>=arr.length) return;
    [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
    save(); render();
  }

  // Puts a tech into a district for a column. If beforeTechId is given the tech
  // is inserted just ahead of that tech (drag-to-reorder); otherwise appended.
  function placeTech(col, techId, districtId, beforeTechId){
    const existing = effPlacement(col, techId);
    setColPlacement(col, techId, districtId, existing.note);
    const orderObj = orderObjFor(col);
    Object.keys(orderObj).forEach(d=>{ orderObj[d] = orderObj[d].filter(id=>id!==techId); });
    if(!orderObj[districtId]) orderObj[districtId] = [];
    const idx = beforeTechId ? orderObj[districtId].indexOf(beforeTechId) : -1;
    if(idx === -1) orderObj[districtId].push(techId); else orderObj[districtId].splice(idx, 0, techId);
  }


  // ============ SORTING, COUNTS, COLORS ============
  function nameCmp(a, b){ return String(a||'').localeCompare(String(b||''), undefined, { numeric:true, sensitivity:'base' }); }
  function orderedDistricts(){
    const bench = board.districts.find(d=>d.id==='bench');
    let others = board.districts.filter(d=>d.id!=='bench');
    const mode = board.districtSort || 'manual';
    if(mode !== 'manual'){
      others = others.slice().sort((a,b)=>nameCmp(a.label,b.label));
      if(mode === 'za') others.reverse();
    }
    return { bench, others };
  }
  function senValue(t){ const n = parseInt(t.seniority, 10); return isNaN(n) ? 1e9 : n; }
  function senLabel(t){ const n = parseInt(t.seniority, 10); return isNaN(n) ? '' : '#' + n; }
  // Applies the chosen tech order (seniority / A-Z / Z-A) to any list of techs; manual leaves it alone.
  function sortTechList(list){
    const mode = board.techSort || 'manual';
    if(mode === 'manual') return list;
    const rank = new Map(orderedTechs().map((t,i)=>[t.id, i]));
    return list.slice().sort((a,b)=>rank.get(a.id) - rank.get(b.id));
  }
  function orderedTechs(){
    const mode = board.techSort || 'manual';
    if(mode === 'manual') return board.techs.slice();
    if(mode === 'sen'){
      return board.techs.slice().sort((a,b)=> senValue(a) - senValue(b) || nameCmp(a.name||'\uffff', b.name||'\uffff'));
    }
    const out = board.techs.slice().sort((a,b)=>nameCmp(a.name||'￿', b.name||'￿'));
    if(mode === 'za') out.reverse();
    return out;
  }
  function benchCount(col){
    return board.techs.filter(t=>!isTechAssigned(col, t.id)).length;
  }
  function makeBenchCount(col){
    const n = benchCount(col);
    const el = document.createElement('div');
    el.className = 'bench-count' + (n === 0 ? ' zero' : '');
    el.dataset.benchCount = col.key;
    el.textContent = n + ' unassigned';
    el.title = n + ' tech' + (n===1?'':'s') + ' not assigned to a district';
    return el;
  }
  function techColor(t){
    if(t.keyId){
      const k = (board.key||[]).find(x=>x.id===t.keyId);
      if(k) return k.color;
    }
    return t.color;
  }

  function moveDistrict(districtId, direction){
    const idx = board.districts.findIndex(d=>d.id===districtId);
    const newIdx = idx + direction;
    if(idx<=0 || newIdx<=0 || newIdx>=board.districts.length) return; // index 0 is bench, stays pinned
    [board.districts[idx], board.districts[newIdx]] = [board.districts[newIdx], board.districts[idx]];
    save(); render();
  }

  function flashCell(colKey, districtId){
    const target = tableEl.querySelector('td.cell[data-col-key="'+colKey+'"][data-district-id="'+districtId+'"]');
    if(target){
      target.classList.add('just-placed');
      setTimeout(()=>{ target.classList.remove('just-placed'); }, 700);
    }
  }

  // Copies every tech in (col, district) into the same district for the adjacent
  // column (previous/next week in Week view, previous/next day in Day view).
  // Additive: nobody already in the target is cleared.
  function copyCellToAdjacentCol(col, districtId, direction){
    const cols = getColumns();
    const idx = cols.findIndex(c=>c.key===col.key);
    const target = cols[idx + direction];
    if(idx === -1 || !target) return;

    reconcileAll();
    const sourceArr = (orderObjFor(col)[districtId] || []).slice();
    if(sourceArr.length === 0 && !extraList(col).some(x=>x.districtId === districtId)) return;

    sourceArr.forEach(techId=>{
      const p = effPlacement(col, techId);
      setColPlacement(target, techId, districtId, p.note || '', { start:p.start||'', wo:p.wo||'', done:false });
    });
    extraList(col).filter(x=>x.districtId === districtId).forEach(x=>{
      if(target.dayIdx == null) return;
      const id = assignTechToJob(target, x.techId, districtId);
      if(typeof id === 'string'){
        Object.assign(board.extras[target.key][id], { note:x.note||'', start:x.start||'', wo:x.wo||'' });
      } else {
        const cur = effPlacement(target, x.techId);
        if(cur.districtId === districtId){ setColPlacement(target, x.techId, districtId, x.note||'', { start:x.start||'', wo:x.wo||'', done:false }); }
      }
    });
    const srcNote = getCellNote(col, districtId);
    if(srcNote && !getCellNote(target, districtId)) setCellNote(target, districtId, srcNote);

    save(); render();
    flashCell(target.key, districtId);
  }

  let benchCollapsed = false;

  // ---- multi-select tech picker (click, click, click, then Add) ----
  let pickerEl = null, pickerOutside = null, pickerEsc = null;
  function closeTechPicker(){
    if(!pickerEl) return;
    pickerEl.remove(); pickerEl = null;
    document.removeEventListener('mousedown', pickerOutside, true);
    document.removeEventListener('keydown', pickerEsc, true);
    isEditingText = false;
  }
  function buildAddTechButton(district, cols){
    const btn = document.createElement('button');
    btn.className = 'district-add-btn';
    btn.textContent = '+ Add techs…';
    btn.title = 'Pick one or several techs for ' + district.label;
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openTechPicker(btn, district, cols); });
    return btn;
  }
  function openTechPicker(anchor, district, cols){
    closeTechPicker();
    const wrap = document.createElement('div');
    wrap.className = 'tech-picker';
    wrap.innerHTML = '<h3></h3><div class="pick-hint">Click as many techs as you need, then Add.</div>';
    wrap.querySelector('h3').textContent = 'Add to ' + district.label;
    const picked = new Map();
    const addBtn = document.createElement('button');
    addBtn.className = 'btn primary'; addBtn.id = 'pickerAddBtn'; addBtn.disabled = true; addBtn.textContent = 'Add';
    const refresh = ()=>{ addBtn.disabled = picked.size === 0; addBtn.textContent = picked.size ? 'Add ' + picked.size : 'Add'; };
    const toggle = (col, tech, cb)=>{
      const k = col.key + '|' + tech.id;
      if(cb.checked) picked.set(k, { col, techId: tech.id }); else picked.delete(k);
      refresh();
    };
    let any = false;
    cols.forEach(col=>{
      const free = sortTechList(board.techs.filter(t=>!isTechAssigned(col, t.id)));
      const busy = col.dayIdx == null ? [] : sortTechList(board.techs.filter(t=>isTechAssigned(col, t.id)
        && !techJobs(col, t.id).some(j=>j.job.districtId === district.id)));
      if(free.length + busy.length === 0) return;
      any = true;
      const sec = document.createElement('div');
      sec.className = 'pick-sec';
      const lab = document.createElement('span');
      lab.textContent = (cols.length > 1 ? colLabel(col) + ' — ' : '') + 'AVAILABLE';
      sec.appendChild(lab);
      const boxes = [];
      if(free.length > 1){
        const all = document.createElement('button');
        all.textContent = 'select all';
        all.addEventListener('click', ()=>{ boxes.filter(b=>!b.cb.checked && !b.busy).forEach(b=>{ b.cb.checked = true; toggle(col, b.tech, b.cb); }); });
        sec.appendChild(all);
      }
      wrap.appendChild(sec);
      const mkRow = (tech, busyInfo)=>{
        const row = document.createElement('label');
        row.className = 'pick-row' + (busyInfo ? ' busy' : '');
        const cb = document.createElement('input'); cb.type = 'checkbox';
        cb.addEventListener('change', ()=>toggle(col, tech, cb));
        row.appendChild(cb);
        const nm = document.createElement('span');
        nm.textContent = (senLabel(tech) ? senLabel(tech) + ' ' : '') + (tech.name || '(unnamed)');
        row.appendChild(nm);
        if(busyInfo){ const sub = document.createElement('span'); sub.className = 'pick-sub'; sub.textContent = busyInfo; row.appendChild(sub); }
        wrap.appendChild(row);
        boxes.push({ cb, tech, busy: !!busyInfo });
      };
      free.forEach(t=>mkRow(t, ''));
      if(free.length === 0){ const e = document.createElement('div'); e.className = 'pick-hint'; e.textContent = 'Everyone is already scheduled.'; wrap.appendChild(e); }
      if(busy.length){
        const s2 = document.createElement('div');
        s2.className = 'pick-sec'; s2.textContent = 'ALREADY WORKING — ADD AS AN EXTRA JOB';
        wrap.appendChild(s2);
        busy.forEach(t=>{
          const p = effPlacement(col, t.id);
          const d = board.districts.find(x=>x.id === p.districtId);
          mkRow(t, d ? d.label : 'other job');
        });
      }
    });
    if(!any){ const e = document.createElement('div'); e.className = 'pick-hint'; e.textContent = 'No one is available.'; wrap.appendChild(e); }
    const actions = document.createElement('div');
    actions.className = 'pick-actions';
    const cancel = document.createElement('button');
    cancel.className = 'btn'; cancel.textContent = 'Cancel';
    cancel.addEventListener('click', closeTechPicker);
    addBtn.addEventListener('click', ()=>{
      const items = Array.from(picked.values());
      closeTechPicker();
      items.forEach(it=>assignTechToJob(it.col, it.techId, district.id));
      save(); render();
      new Set(items.map(it=>it.col.key)).forEach(k=>flashCell(k, district.id));
    });
    actions.appendChild(cancel); actions.appendChild(addBtn);
    wrap.appendChild(actions);
    document.body.appendChild(wrap);
    pickerEl = wrap;
    const r = anchor.getBoundingClientRect();
    wrap.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 296)) + 'px';
    const h = Math.min(wrap.offsetHeight, window.innerHeight * 0.7);
    wrap.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - h - 8)) + 'px';
    pickerOutside = (e)=>{ if(pickerEl && !pickerEl.contains(e.target) && e.target !== anchor) closeTechPicker(); };
    pickerEsc = (e)=>{ if(e.key === 'Escape') closeTechPicker(); };
    document.addEventListener('mousedown', pickerOutside, true);
    document.addEventListener('keydown', pickerEsc, true);
    isEditingText = true;
  }

  function buildCellNote(col, district){
    const el = document.createElement('div');
    el.className = 'cell-note';
    el.contentEditable = true;
    el.textContent = getCellNote(col, district.id);
    el.title = 'Note for ' + district.label + ' this ' + (col.dayIdx == null ? 'week' : 'day');
    el.addEventListener('focus', ()=>{ isEditingText = true; });
    el.addEventListener('blur', ()=>{
      isEditingText = false;
      setCellNote(col, district.id, el.textContent);
      save();
    });
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); el.blur(); }
    });
    return el;
  }

  function buildDistrictRow(district, isBench, isFirst, isLast, cols, meta){
    meta = meta || {};
    const tr = document.createElement('tr');
    if(isBench) tr.className = 'bench-row';
    if(meta.empty) tr.className = 'empty-job';
    tr.dataset.districtId = district.id;

    const rowHead = document.createElement('td');
    rowHead.className = 'district-head' + (isBench ? ' bench-head' : '');
    const rowActions = document.createElement('div');
    rowActions.className = 'district-row-actions';
    const dInput = document.createElement('input');
    dInput.className = 'district-title';
    dInput.value = district.label;
    dInput.addEventListener('focus', ()=>{ isEditingText = true; });
    dInput.addEventListener('blur', ()=>{ isEditingText = false; district.label = dInput.value; save(); });
    rowActions.appendChild(dInput);

    if(isBench){
      const toggle = document.createElement('button');
      toggle.className = 'bench-collapse-btn';
      toggle.textContent = benchCollapsed ? 'Show' : 'Hide';
      toggle.title = benchCollapsed ? 'Show unassigned techs' : 'Hide unassigned techs';
      toggle.addEventListener('click', ()=>{ benchCollapsed = !benchCollapsed; render(); });
      rowActions.appendChild(toggle);
    } else {
      const moveUp = document.createElement('button');
      moveUp.className = 'mini-move'; moveUp.textContent = '▲'; moveUp.title = (board.districtSort||'manual') !== 'manual' ? 'Switch sort to Manual to reorder' : 'Move district up';
      moveUp.disabled = !!isFirst || (board.districtSort||'manual') !== 'manual';
      moveUp.addEventListener('click', ()=>moveDistrict(district.id, -1));
      rowActions.appendChild(moveUp);

      const moveDown = document.createElement('button');
      moveDown.className = 'mini-move'; moveDown.textContent = '▼'; moveDown.title = (board.districtSort||'manual') !== 'manual' ? 'Switch sort to Manual to reorder' : 'Move district down';
      moveDown.disabled = !!isLast || (board.districtSort||'manual') !== 'manual';
      moveDown.addEventListener('click', ()=>moveDistrict(district.id, 1));
      rowActions.appendChild(moveDown);

      const weekIdsShown = Array.from(new Set(cols.map(c=>c.weekId)));
      const rm = document.createElement('button');
      rm.className = 'mini-x'; rm.innerHTML = '&times;';
      if(weekIdsShown.length === 1){
        rm.title = 'Remove this job from the week';
        rm.addEventListener('click', ()=>{
          if(!confirm('Remove "'+district.label+'" from this week? Anyone assigned there goes back to the bench for this week. The job stays in the suggestion list for later weeks.')) return;
          removeJobFromWeek(weekIdsShown[0], district.id);
          save(); render();
        });
      } else {
        rm.title = 'Show a single week to remove jobs';
        rm.disabled = true;
      }
      rowActions.appendChild(rm);
    }
    rowHead.appendChild(rowActions);
    if(isBench){
      const eyebrow = document.createElement('div');
      eyebrow.className = 'bench-eyebrow';
      eyebrow.textContent = viewMode === 'day' ? 'UNASSIGNED THIS DAY' : 'UNASSIGNED THIS WEEK';
      rowHead.insertBefore(eyebrow, rowHead.firstChild);
    } else {
      rowHead.appendChild(buildAddTechButton(district, cols));
      if(meta.empty){
        const eh = document.createElement('div');
        eh.className = 'empty-job-hint'; eh.textContent = 'No techs yet';
        rowHead.appendChild(eh);
      }
    }
    tr.appendChild(rowHead);

    cols.forEach((col, colIdx)=>{
      const td = document.createElement('td');
      td.className = 'cell';
      td.dataset.weekId = col.weekId;
      td.dataset.colKey = col.key;
      td.dataset.districtId = district.id;

      const orderArr = orderObjFor(col)[district.id] || [];
      const techsHere = sortTechList(orderArr.map(tid => board.techs.find(t=>t.id===tid)).filter(Boolean));
      const extrasHere = isBench ? [] : extraList(col).filter(x=>x.districtId === district.id);
      if(techsHere.length > 0 || extrasHere.length > 0){
        td.classList.add('has-techs');
      }

      if((techsHere.length > 0 || extrasHere.length > 0) && !(isBench && benchCollapsed)){
        const controls = document.createElement('div');
        controls.className = 'cell-copy-controls';
        const unit = col.dayIdx == null ? 'week' : 'day';

        const leftBtn = document.createElement('button');
        leftBtn.className = 'cell-copy-btn';
        leftBtn.textContent = '←';
        leftBtn.title = 'Copy this crew to the previous ' + unit;
        leftBtn.disabled = colIdx === 0;
        leftBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          copyCellToAdjacentCol(col, district.id, -1);
        });
        controls.appendChild(leftBtn);

        const rightBtn = document.createElement('button');
        rightBtn.className = 'cell-copy-btn';
        rightBtn.textContent = '→';
        rightBtn.title = 'Copy this crew to the next ' + unit;
        rightBtn.disabled = colIdx === cols.length - 1;
        rightBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          copyCellToAdjacentCol(col, district.id, 1);
        });
        controls.appendChild(rightBtn);

        td.appendChild(controls);
        td.classList.add('has-copy-space');
      }

      if(isBench && benchCollapsed){
        const hint = document.createElement('div');
        hint.className = 'bench-collapsed-hint';
        hint.textContent = techsHere.length + ' unassigned';
        td.appendChild(hint);
      } else {
        if(techsHere.length === 0 && extrasHere.length === 0){
          const hint = document.createElement('div');
          hint.className = 'empty-cell-hint';
          hint.textContent = isBench ? '' : 'Drop a tech here';
          td.appendChild(hint);
        }
        // The bench is capped in height and scrolls; other cells grow with their crew.
        let holder = td;
        if(isBench && techsHere.length > 0){
          holder = document.createElement('div');
          holder.className = 'bench-scroll';
          td.appendChild(holder);
        }
        techsHere.forEach((tech, idx)=>{
          holder.appendChild(renderChip(tech, col, district, idx, techsHere.length));
        });
        extrasHere.forEach(x=>{
          const tech = board.techs.find(t=>t.id === x.techId);
          if(tech) holder.appendChild(renderChip(tech, col, district, 0, 1, { x:x.id }));
        });
        if(!isBench) td.appendChild(buildCellNote(col, district));
      }

      td.addEventListener('dragover', (e)=>{
        if(dragFromCol !== col.key) return;
        e.preventDefault();
        td.classList.add('drag-over');
      });
      td.addEventListener('dragleave', ()=>{ td.classList.remove('drag-over'); });
      td.addEventListener('drop', (e)=>{
        e.preventDefault();
        td.classList.remove('drag-over');
        if(!dragTechId || dragFromCol !== col.key) return;
        placeTech(col, dragTechId, district.id);
        const flashKey = col.key;
        dragTechId = null; dragFromCol = null;
        save(); render();
        flashCell(flashKey, district.id);
      });

      tr.appendChild(td);
    });

    const spacerTd = document.createElement('td');
    tr.appendChild(spacerTd);

    return tr;
  }

  function buildWeekHead(week, dayMode){
    const th = document.createElement('th');
    th.className = 'week-head';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'week-title';
    titleDiv.textContent = week.date ? formatWeekLabel(week.date) : 'New week';
    th.appendChild(titleDiv);

    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.className = 'week-date-input';
    dateInput.value = week.date || '';
    dateInput.addEventListener('focus', ()=>{ isEditingText = true; });
    dateInput.addEventListener('change', ()=>{
      isEditingText = false;
      week.date = dateInput.value;
      save(); render();
    });
    dateInput.addEventListener('blur', ()=>{ isEditingText = false; });
    th.appendChild(dateInput);

    if(!dayMode){
      if(week.date){
        const strip = document.createElement('div');
        strip.className = 'week-daystrip';
        formatWeekDayStrip(week.date).forEach(dayLabel=>{
          const d = document.createElement('span');
          d.className = 'daystrip-day';
          d.textContent = dayLabel;
          strip.appendChild(d);
        });
        th.appendChild(strip);
      } else {
        const hint = document.createElement('div');
        hint.className = 'week-nodate';
        hint.textContent = 'Pick a start date →';
        th.appendChild(hint);
      }
      th.appendChild(makeBenchCount({ weekId:week.id, dayIdx:null, key:week.id, week }));
    }

    const actions = document.createElement('div');
    actions.className = 'col-actions';
    const rm = document.createElement('button');
    rm.className = 'mini-x'; rm.innerHTML = '&times;'; rm.title = 'Archive week';
    rm.addEventListener('click', ()=>{
      const label = week.date ? formatWeekLabel(week.date) : 'this week';
      if(confirm('Archive "'+label+'"? It will move out of the active board, but you can restore it later from Archive.')){
        archiveWeek(week.id);
      }
    });
    actions.appendChild(rm);
    th.appendChild(actions);
    return th;
  }

  // In Day view the header has two sticky rows; the second sits just below the first.
  function fixDayHeaderOffset(){
    const first = tableEl.querySelector('thead tr:first-child');
    const second = tableEl.querySelector('thead tr:nth-child(2)');
    if(!first || !second) return;
    const h = first.getBoundingClientRect().height;
    second.querySelectorAll('th').forEach(th=>{ th.style.top = h + 'px'; });
  }

  function render(){
    reconcileAll();
    const cols = getColumns();
    const dayMode = viewMode === 'day';
    tableEl.className = 'grid' + (dayMode ? ' day-mode' : '');
    tableEl.innerHTML = "";

    // header row(s)
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'corner';
    if(dayMode) corner.rowSpan = 2;
    const techLayout = layoutMode === 'tech';
    const cl = document.createElement('div');
    cl.className = 'corner-label';
    cl.textContent = techLayout ? 'TECHS' : 'JOBS / SCHOOLS';
    cl.style.paddingBottom = '4px';
    corner.appendChild(cl);
    if(!techLayout) corner.appendChild(buildSortSelect('districtSort'));
    corner.appendChild(buildSortSelect('techSort'));
    headRow.appendChild(corner);

    shownWeeks().forEach(week=>{
      const th = buildWeekHead(week, dayMode);
      if(dayMode) th.colSpan = DAYS_PER_WEEK;
      headRow.appendChild(th);
    });

    const addWeekTh = document.createElement('th');
    addWeekTh.className = 'add-week-cell';
    if(dayMode) addWeekTh.rowSpan = 2;
    const addWeekBtnCell = document.createElement('button');
    addWeekBtnCell.textContent = '+ Week';
    addWeekBtnCell.addEventListener('click', addWeek);
    addWeekTh.appendChild(addWeekBtnCell);
    headRow.appendChild(addWeekTh);
    thead.appendChild(headRow);

    if(dayMode){
      const dayRow = document.createElement('tr');
      cols.forEach(col=>{
        const th = document.createElement('th');
        th.className = 'day-head';
        th.appendChild(document.createTextNode(colLabel(col)));
        th.appendChild(makeBenchCount(col));
        dayRow.appendChild(th);
      });
      thead.appendChild(dayRow);
    }
    tableEl.appendChild(thead);

    // body rows: bench shelf first (visually separated), then one row per district
    const tbody = document.createElement('tbody');

    if(techLayout){
      orderedTechs().forEach(tech=>{ tbody.appendChild(buildTechRow(tech, cols)); });
      const addTr = document.createElement('tr');
      addTr.className = 'add-tech-row';
      const addTd = document.createElement('td');
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Add tech';
      addBtn.addEventListener('click', addTech);
      addTd.appendChild(addBtn);
      addTr.appendChild(addTd);
      cols.forEach(()=>{ addTr.appendChild(document.createElement('td')); });
      addTr.appendChild(document.createElement('td'));
      tbody.appendChild(addTr);
    } else {
      const dd = displayDistricts(cols);
      if(dd.bench){
        tbody.appendChild(buildDistrictRow(dd.bench, true, false, false, cols));
      }
      // jobs with techs first; jobs nobody is on this week sink to the bottom
      dd.staffed.forEach((district, idx)=>{
        tbody.appendChild(buildDistrictRow(district, false, idx===0, idx===dd.staffed.length-1, cols, { empty:false }));
      });
      dd.empty.forEach((district, idx)=>{
        tbody.appendChild(buildDistrictRow(district, false, idx===0, idx===dd.empty.length-1, cols, { empty:true }));
      });

      // add-job row
      const addTr = document.createElement('tr');
      addTr.className = 'add-district-row';
      const addTd = document.createElement('td');
      const addBtn = document.createElement('button');
      addBtn.id = 'addJobBtn';
      addBtn.textContent = '+ Add job';
      addBtn.addEventListener('click', ()=>openAddJob(cols));
      addTd.appendChild(addBtn);
      addTr.appendChild(addTd);
      cols.forEach(()=>{ addTr.appendChild(document.createElement('td')); });
      addTr.appendChild(document.createElement('td'));
      tbody.appendChild(addTr);
    }

    tableEl.appendChild(tbody);
    if(dayMode) fixDayHeaderOffset();
    renderKeyBar();
    updateViewButtons();
    if(activeTab === 'techPool') renderTechPool();
  }

  // Jobs on the displayed week(s), split into those with techs and those with none.
  function displayDistricts(cols){
    const od = orderedDistricts();
    const weekIds = Array.from(new Set(cols.map(c=>c.weekId)));
    const active = od.others.filter(d=>weekIds.some(w=>isJobActiveIn(w, d.id)));
    const used = new Set();
    cols.forEach(col=>{
      board.techs.forEach(t=>{ const d = effPlacement(col, t.id).districtId; if(d !== 'bench') used.add(d); });
      extraList(col).forEach(x=>{ if(x.districtId) used.add(x.districtId); });
    });
    return { bench: od.bench, staffed: active.filter(d=>used.has(d.id)), empty: active.filter(d=>!used.has(d.id)) };
  }

  function buildSortSelect(prop){
    const sel = document.createElement('select');
    sel.className = 'corner-sort';
    sel.id = prop === 'techSort' ? 'techSortSel' : 'districtSortSel';
    sel.title = prop === 'techSort' ? 'Sort the tech list' : 'Sort the district list';
    const opts = prop === 'techSort'
      ? [['manual','Techs: manual order'],['sen','Techs: by seniority'],['az','Techs: A → Z'],['za','Techs: Z → A']]
      : [['manual','Jobs: manual order'],['az','Jobs: A → Z'],['za','Jobs: Z → A']];
    opts.forEach(([v,l])=>{
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if((board[prop]||'manual') === v) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('focus', ()=>{ isEditingText = true; });
    sel.addEventListener('blur', ()=>{ isEditingText = false; });
    sel.addEventListener('change', ()=>{
      isEditingText = false;
      board[prop] = sel.value;
      save(); render();
    });
    return sel;
  }

  function flashTechCell(colKey, techId){
    const t = tableEl.querySelector('td.tech-cell[data-col-key="'+colKey+'"][data-tech-id="'+techId+'"]');
    if(t){ t.classList.add('just-placed'); setTimeout(()=>t.classList.remove('just-placed'), 700); }
  }

  // One row per tech; each column cell shows which district they're in.
  function buildTechRow(tech, cols){
    const tr = document.createElement('tr');
    tr.dataset.techId = tech.id;
    const head = document.createElement('td');
    head.className = 'district-head tech-head';
    head.style.borderLeftColor = techColor(tech);
    const top = document.createElement('div');
    top.className = 'tech-head-top';
    if(senLabel(tech)){
      const sn = document.createElement('span');
      sn.className = 'tech-sen'; sn.textContent = senLabel(tech); sn.title = 'Seniority ' + senLabel(tech);
      top.appendChild(sn);
    }
    const nameIn = document.createElement('input');
    nameIn.className = 'district-title';
    nameIn.placeholder = 'Tech name';
    nameIn.value = tech.name || '';
    nameIn.addEventListener('focus', ()=>{ isEditingText = true; });
    nameIn.addEventListener('blur', ()=>{
      isEditingText = false;
      const v = nameIn.value.trim();
      if(v !== (tech.name||'')){ tech.name = v; save(); if((board.techSort||'manual') !== 'manual') render(); }
    });
    top.appendChild(nameIn);
    const prof = document.createElement('button');
    prof.className = 'tech-prof'; prof.textContent = 'i'; prof.title = 'View / edit profile';
    prof.addEventListener('click', ()=>openProfile(tech.id));
    top.appendChild(prof);
    const rm = document.createElement('button');
    rm.className = 'mini-x'; rm.innerHTML = '&times;'; rm.title = 'Remove from roster';
    rm.addEventListener('click', ()=>deleteTechFromRoster(tech.id));
    top.appendChild(rm);
    head.appendChild(top);
    const role = document.createElement('div');
    role.className = 'tech-head-role';
    role.textContent = tech.role || '';
    head.appendChild(role);
    tr.appendChild(head);

    cols.forEach(col=>{
      const td = document.createElement('td');
      const jobs = techJobs(col, tech.id);
      const assignedJobs = jobs.filter(j=>j.job.districtId && j.job.districtId !== 'bench');
      const assigned = assignedJobs.length > 0;
      const allDone = assigned && assignedJobs.every(j=>j.job.done);
      td.className = 'cell tech-cell' + (assigned ? ' has-techs' : '') + (allDone ? ' all-done' : '');
      td.dataset.weekId = col.weekId; td.dataset.colKey = col.key; td.dataset.techId = tech.id;
      td.dataset.districtId = effPlacement(col, tech.id).districtId;
      const hasOverride = col.dayIdx != null && !!dayPlacementOf(col.weekId, col.dayIdx, tech.id);
      if(hasOverride) td.classList.add('day-override-cell');

      jobs.forEach(({ ref, job })=>{
        const isExtra = !!ref.x;
        const row = document.createElement('div');
        row.className = 'job-row' + (job.done ? ' done' : '');
        const head = document.createElement('div');
        head.style.display = 'flex'; head.style.gap = '4px'; head.style.alignItems = 'center';
        const sel = document.createElement('select');
        sel.className = 'chip-district-select';
        sel.style.marginTop = '0';
        sel.title = 'Which job this tech is on for this ' + (col.dayIdx == null ? 'week' : 'day');
        fillDistrictOptions(sel, job.districtId, col.weekId, { allowBench: !isExtra, placeholder: isExtra && !job.districtId });
        sel.addEventListener('focus', ()=>{ isEditingText = true; });
        sel.addEventListener('blur', ()=>{ isEditingText = false; });
        sel.addEventListener('change', ()=>{
          isEditingText = false;
          const v = sel.value;
          if(v === '__new__'){
            sel.value = job.districtId || '';
            openJobModal({ weekIds:[col.weekId], onAdded:(did)=>{
              if(isExtra) patchJob(col, tech.id, ref, { districtId: did }); else placeTech(col, tech.id, did);
            }});
            return;
          }
          if(v === (job.districtId || '')) return;
          if(isExtra) patchJob(col, tech.id, ref, { districtId: v });
          else if(v === 'bench') sendPrimaryToBench(col, tech.id);
          else placeTech(col, tech.id, v);
          save(); render();
          flashTechCell(col.key, tech.id);
        });
        head.appendChild(sel);
        if(isExtra){
          const x = document.createElement('button');
          x.className = 'job-x'; x.innerHTML = '&times;'; x.title = 'Remove this additional job';
          x.addEventListener('click', ()=>{
            if(!confirm('Remove this additional job for '+(tech.name || 'this tech')+'?')) return;
            removeExtra(col, ref.x); save(); render();
          });
          head.appendChild(x);
        }
        row.appendChild(head);
        if(job.districtId && job.districtId !== 'bench'){
          row.appendChild(buildJobFields(col, tech, ref, job, 'job'));
        }
        const note = document.createElement('div');
        note.className = 'chip-note';
        note.contentEditable = true;
        note.textContent = job.note || '';
        note.addEventListener('focus', ()=>{ isEditingText = true; });
        note.addEventListener('blur', ()=>{
          isEditingText = false;
          const cur = jobOf(col, tech.id, ref);
          if(!cur) return;
          const txt = note.textContent.trim();
          if(txt === (cur.note||'')) return;
          patchJob(col, tech.id, ref, { note: txt });
          save();
        });
        row.appendChild(note);
        td.appendChild(row);
      });

      if(col.dayIdx != null && assigned){
        const add = document.createElement('button');
        add.className = 'job-add-btn';
        add.textContent = '+ Add another job';
        add.title = 'Give ' + (tech.name || 'this tech') + ' a second job (with its own start time) on this day';
        add.addEventListener('click', ()=>{ addExtra(col, tech.id, ''); save(); render(); });
        td.appendChild(add);
      }

      if(col.dayIdx == null){
        const diffs = techDayDiffs(col.weekId, tech.id);
        if(diffs.length > 0){
          const badge = document.createElement('div');
          badge.className = 'chip-badge';
          badge.textContent = 'Days differ';
          badge.title = diffs.map(df=>{
            const d = board.districts.find(x=>x.id===df.districtId);
            return ['Mon','Tue','Wed','Thu','Fri'][df.dayIdx] + ': ' + (df.extra ? '+ ' : '') + (df.districtId==='bench' ? 'Bench' : (d ? d.label : '?'));
          }).join('\n') + '\n(Switch to Day view to edit)';
          td.appendChild(badge);
        }
      } else if(hasOverride){
        const reset = document.createElement('button');
        reset.className = 'chip-reset';
        reset.textContent = '\u21ba week plan';
        reset.title = 'Remove this day-specific change and follow the week plan again';
        reset.addEventListener('click', ()=>{ clearDayOverride(col, tech.id); save(); render(); });
        td.appendChild(reset);
      }
      tr.appendChild(td);
    });
    tr.appendChild(document.createElement('td'));
    return tr;
  }

  // ============ KEY (color legend) ============
  function newKeyId(){ return 'k' + uid(); }
  function keyUsage(id){ return board.techs.filter(t=>t.keyId === id).length; }
  function renderKeyBar(){
    const bar = document.getElementById('keyBar');
    if(!bar) return;
    bar.innerHTML = '';
    const title = document.createElement('span');
    title.className = 'key-title'; title.textContent = 'KEY';
    bar.appendChild(title);
    const key = board.key || [];
    if(key.length === 0 && !keyEditing){
      const e = document.createElement('span');
      e.className = 'key-empty';
      e.textContent = 'No key yet — click “Edit key” to add colors and labels (e.g. Fiber crew, Install crew).';
      bar.appendChild(e);
    }
    key.forEach(k=>{
      const item = document.createElement('span');
      item.className = 'key-item';
      item.dataset.keyId = k.id;
      if(keyEditing){
        const ci = document.createElement('input');
        ci.type = 'color'; ci.value = k.color; ci.title = 'Change this color for every tech using it';
        ci.addEventListener('change', ()=>{
          k.color = ci.value;
          board.techs.forEach(t=>{ if(t.keyId === k.id) t.color = k.color; });
          save(); render();
        });
        item.appendChild(ci);
        const li = document.createElement('input');
        li.type = 'text'; li.value = k.label; li.placeholder = 'Label';
        li.addEventListener('focus', ()=>{ isEditingText = true; });
        li.addEventListener('blur', ()=>{
          isEditingText = false;
          if(li.value !== k.label){ k.label = li.value; save(); }
        });
        li.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') li.blur(); });
        item.appendChild(li);
        const n = keyUsage(k.id);
        const cnt = document.createElement('span');
        cnt.className = 'key-count'; cnt.textContent = n + ' tech' + (n===1?'':'s');
        item.appendChild(cnt);
        const del = document.createElement('button');
        del.className = 'key-del'; del.innerHTML = '&times;'; del.title = 'Delete this key entry (techs keep their color)';
        del.addEventListener('click', ()=>{
          const used = keyUsage(k.id);
          if(!confirm('Delete "'+(k.label||'this color')+'" from the key?' + (used ? ' The '+used+' tech'+(used===1?'':'s')+' using it keep their color.' : ''))) return;
          board.techs.forEach(t=>{ if(t.keyId === k.id) t.keyId = ''; });
          board.key = board.key.filter(x=>x.id !== k.id);
          save(); render();
        });
        item.appendChild(del);
      } else {
        const sw = document.createElement('span');
        sw.className = 'key-swatch'; sw.style.background = k.color;
        item.appendChild(sw);
        const lb = document.createElement('span');
        lb.textContent = k.label || '(no label)';
        item.appendChild(lb);
        const n = keyUsage(k.id);
        if(n){ const c = document.createElement('span'); c.className = 'key-count'; c.textContent = '(' + n + ')'; item.appendChild(c); }
      }
      bar.appendChild(item);
    });
    if(keyEditing){
      const add = document.createElement('button');
      add.className = 'key-add-btn'; add.textContent = '+ Add color';
      add.addEventListener('click', ()=>{
        const used = new Set((board.key||[]).map(k=>k.color.toLowerCase()));
        const color = COLORS.find(c=>!used.has(c.toLowerCase())) || COLORS[0];
        board.key.push({ id:newKeyId(), color, label:'' });
        save(); render();
      });
      bar.appendChild(add);
    }
    const eb = document.createElement('button');
    eb.id = 'keyEditBtn';
    eb.className = 'key-edit-btn' + (keyEditing ? ' active' : '');
    eb.textContent = keyEditing ? 'Done' : 'Edit key';
    eb.addEventListener('click', ()=>{ keyEditing = !keyEditing; renderKeyBar(); });
    bar.appendChild(eb);
  }

  let activeTab = 'board';
  function switchTab(tab){
    activeTab = tab;
    document.getElementById('boardView').style.display = tab==='board' ? '' : 'none';
    document.getElementById('techPoolView').style.display = tab==='techPool' ? '' : 'none';
    document.getElementById('tabBoardBtn').classList.toggle('active', tab==='board');
    document.getElementById('tabPoolBtn').classList.toggle('active', tab==='techPool');
    document.getElementById('viewToggle').style.display = tab==='board' ? '' : 'none';
    if(tab==='techPool') renderTechPool();
    else render();   // day-view header offsets can only be measured while the board is visible
  }

  function weekOptionLabel(w, i){ return w.date ? formatWeekLabel(w.date) : 'Week ' + (i+1) + ' (no date)'; }
  function refreshWeekPicker(){
    const sel = document.getElementById('weekPickSel');
    if(!sel) return;
    const f = focusedWeek();
    const sig = board.weeks.map((w,i)=>w.id + weekOptionLabel(w,i)).join('|');
    if(sel.dataset.sig !== sig){
      sel.innerHTML = '';
      board.weeks.forEach((w,i)=>{
        const o = document.createElement('option'); o.value = w.id; o.textContent = weekOptionLabel(w, i); sel.appendChild(o);
      });
      const all = document.createElement('option'); all.value = 'all'; all.textContent = 'All weeks'; sel.appendChild(all);
      sel.dataset.sig = sig;
    }
    sel.value = f ? f.id : 'all';
    const idx = f ? board.weeks.indexOf(f) : -1;
    document.getElementById('weekPrevBtn').disabled = !f || idx <= 0;
    document.getElementById('weekNextBtn').disabled = !f || idx >= board.weeks.length - 1;
  }
  function stepWeek(dir){
    const f = focusedWeek();
    if(!f) return;
    const n = board.weeks[board.weeks.indexOf(f) + dir];
    if(!n) return;
    setWeekFocus(n.id);
    renderKeepScroll();
  }
  function updateViewButtons(){
    document.getElementById('viewWeekBtn').classList.toggle('active', viewMode==='week');
    document.getElementById('viewDayBtn').classList.toggle('active', viewMode==='day');
    refreshWeekPicker();
    document.getElementById('layoutDistrictBtn').classList.toggle('active', layoutMode==='district');
    document.getElementById('layoutTechBtn').classList.toggle('active', layoutMode==='tech');
  }
  function renderKeepScroll(){
    const wrap = document.querySelector('.grid-wrap');
    const l = wrap ? wrap.scrollLeft : 0, t = wrap ? wrap.scrollTop : 0;
    render();
    if(wrap){ wrap.scrollLeft = l; wrap.scrollTop = t; }
  }
  function setViewMode(mode){
    viewMode = mode;
    try{ localStorage.setItem('crew-board-view', mode); }catch(e){}
    updateViewButtons();
    renderKeepScroll();
  }
  function setLayoutMode(mode){
    layoutMode = mode;
    try{ localStorage.setItem('crew-board-layout', mode); }catch(e){}
    renderKeepScroll();
  }

  // ============ TECH POOL ============
  function renderTechPool(){
    const gridEl = document.getElementById('poolGrid');
    const countEl = document.getElementById('poolCount');
    const searchEl = document.getElementById('poolSearch');
    const term = (searchEl.value || '').trim().toLowerCase();

    const filtered = orderedTechs().filter(t => !term || (t.name||'').toLowerCase().includes(term));
    countEl.textContent = filtered.length + ' of ' + board.techs.length + ' techs';

    gridEl.innerHTML = '';
    if(board.techs.length === 0){
      const empty = document.createElement('div');
      empty.className = 'pool-empty';
      empty.textContent = 'No techs yet \u2014 use "+ Add tech" to build the roster.';
      gridEl.appendChild(empty);
      return;
    }
    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'pool-empty';
      empty.textContent = 'No techs match "' + searchEl.value + '".';
      gridEl.appendChild(empty);
      return;
    }

    filtered.forEach(tech=>{
      gridEl.appendChild(renderPoolCard(tech));
    });
  }

  function renderPoolCard(tech){
    const card = document.createElement('div');
    card.className = 'pool-card';
    card.style.borderLeftColor = techColor(tech);

    const top = document.createElement('div');
    top.className = 'pool-card-top';
    const nameEl = document.createElement('div');
    nameEl.className = 'pool-name';
    nameEl.contentEditable = true;
    nameEl.textContent = tech.name;
    nameEl.addEventListener('focus', ()=>{ isEditingText = true; });
    nameEl.addEventListener('blur', ()=>{
      isEditingText = false;
      tech.name = nameEl.textContent.trim();
      save(); renderTechPool();
    });
    top.appendChild(nameEl);
    const del = document.createElement('button');
    del.className = 'pool-del';
    del.innerHTML = '&times;';
    del.title = 'Remove from roster';
    del.addEventListener('click', ()=>{ deleteTechFromRoster(tech.id); renderTechPool(); });
    top.appendChild(del);
    card.appendChild(top);

    const row2 = document.createElement('div');
    row2.className = 'pool-row2';
    row2.appendChild(makePoolField('Role', tech, 'role', 'e.g. Lead Technician'));
    row2.appendChild(makePoolField('Phone', tech, 'phone', 'e.g. (516) 555-0142'));
    card.appendChild(row2);
    card.appendChild(buildSeniorityField(tech));
    card.appendChild(buildColorPicker(tech));

    const emailRow = document.createElement('div');
    emailRow.className = 'pool-email-row';
    const emailField = makePoolField('Email', tech, 'email', 'e.g. jsmith@ncdcom.com', true);
    emailRow.appendChild(emailField);
    if(emailValid(tech.email)){
      const a = document.createElement('a');
      a.className = 'pool-email-btn';
      a.href = 'mailto:' + tech.email;
      a.textContent = 'Email';
      emailRow.appendChild(a);
    } else if(tech.email){
      const span = document.createElement('span');
      span.className = 'pool-email-btn-disabled';
      span.textContent = 'Email';
      emailRow.appendChild(span);
    }
    card.appendChild(emailRow);

    const detailWrap = document.createElement('div');
    detailWrap.className = 'pool-field pool-detail';
    const detailLabel = document.createElement('label');
    detailLabel.textContent = 'Detail';
    detailWrap.appendChild(detailLabel);
    const detailArea = document.createElement('textarea');
    detailArea.value = tech.detail || '';
    detailArea.placeholder = 'Certifications, specialties, or detail of work';
    detailArea.addEventListener('focus', ()=>{ isEditingText = true; });
    detailArea.addEventListener('blur', ()=>{
      isEditingText = false;
      tech.detail = detailArea.value;
      save(); renderTechPool();
    });
    detailWrap.appendChild(detailArea);
    card.appendChild(detailWrap);

    return card;
  }

  function buildSeniorityField(tech){
    const wrap = document.createElement('div');
    wrap.className = 'pool-field pool-sen';
    const label = document.createElement('label');
    label.textContent = 'Seniority # (1 = most senior)';
    wrap.appendChild(label);
    const input = document.createElement('input');
    input.type = 'number'; input.min = '1'; input.step = '1';
    input.className = 'pool-sen-input';
    input.placeholder = 'e.g. 3';
    input.value = (tech.seniority === '' || tech.seniority == null) ? '' : tech.seniority;
    input.addEventListener('focus', ()=>{ isEditingText = true; });
    input.addEventListener('blur', ()=>{ isEditingText = false; });
    input.addEventListener('change', ()=>{
      isEditingText = false;
      const n = parseInt(input.value, 10);
      const next = (isNaN(n) || n < 1) ? '' : n;
      if(next === tech.seniority) return;
      tech.seniority = next;
      save(); render();
    });
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') input.blur(); });
    wrap.appendChild(input);
    return wrap;
  }

  function buildColorPicker(tech){
    const wrap = document.createElement('div');
    wrap.className = 'pool-color';
    const lab = document.createElement('label'); lab.textContent = 'COLOR';
    wrap.appendChild(lab);
    const row = document.createElement('div'); row.className = 'pool-swatches';
    const cur = techColor(tech).toLowerCase();
    const mk = (color, cls, title, onPick, selected)=>{
      const b = document.createElement('button');
      b.className = 'pool-sw ' + cls + (selected ? ' sel' : '');
      b.style.background = color; b.title = title; b.type = 'button';
      b.addEventListener('click', ()=>{ onPick(); save(); render(); });
      return b;
    };
    (board.key||[]).forEach(k=>{
      row.appendChild(mk(k.color, 'key', 'Key: ' + (k.label || '(no label)'), ()=>{ tech.keyId = k.id; tech.color = k.color; }, tech.keyId === k.id));
    });
    if((board.key||[]).length){ const sep = document.createElement('span'); sep.className = 'pool-sw-sep'; row.appendChild(sep); }
    COLORS.forEach(c=>{
      row.appendChild(mk(c, 'pal', c, ()=>{ tech.keyId = ''; tech.color = c; }, !tech.keyId && c.toLowerCase() === cur));
    });
    const ci = document.createElement('input');
    ci.type = 'color'; ci.value = /^#[0-9a-f]{6}$/i.test(techColor(tech)) ? techColor(tech) : '#888888';
    ci.title = 'Pick any color';
    ci.addEventListener('change', ()=>{ tech.keyId = ''; tech.color = ci.value; save(); render(); });
    row.appendChild(ci);
    wrap.appendChild(row);
    return wrap;
  }

  function makePoolField(labelText, tech, fieldName, placeholder, isEmail){
    const wrap = document.createElement('div');
    wrap.className = 'pool-field';
    const label = document.createElement('label');
    label.textContent = labelText;
    wrap.appendChild(label);
    const input = document.createElement('input');
    input.type = isEmail ? 'email' : 'text';
    input.value = tech[fieldName] || '';
    input.placeholder = placeholder || '';
    if(isEmail && tech.email && !emailValid(tech.email)) input.classList.add('email-invalid');
    input.addEventListener('focus', ()=>{ isEditingText = true; });
    input.addEventListener('blur', ()=>{
      isEditingText = false;
      tech[fieldName] = input.value.trim();
      save(); renderTechPool();
    });
    wrap.appendChild(input);
    return wrap;
  }

  // Lists the jobs on this week (plus the current one), with "+ Add new job" at the end so
  // you never have to leave this view to create one.
  function fillDistrictOptions(sel, currentId, weekId, opts){
    opts = opts || {};
    const od = orderedDistricts();
    if(opts.placeholder){
      const ph = document.createElement('option');
      ph.value = ''; ph.textContent = 'Choose job\u2026';
      if(!currentId) ph.selected = true;
      sel.appendChild(ph);
    }
    if(opts.allowBench !== false && od.bench){
      const o = document.createElement('option');
      o.value = 'bench'; o.textContent = 'Bench / Unassigned';
      if(currentId === 'bench') o.selected = true;
      sel.appendChild(o);
    }
    od.others.filter(d=>d.id === currentId || !weekId || isJobActiveIn(weekId, d.id)).forEach(d=>{
      const o = document.createElement('option');
      o.value = d.id; o.textContent = d.label;
      if(d.id === currentId) o.selected = true;
      sel.appendChild(o);
    });
    if(weekId){
      const n = document.createElement('option');
      n.value = '__new__'; n.textContent = '\uff0b Add new job\u2026';
      sel.appendChild(n);
    }
  }

  // Start time, work order and the "scheduled in Field Hub" check-off for one job.
  function buildJobFields(col, tech, ref, job, kind){
    const row = document.createElement('div');
    row.className = kind === 'chip' ? 'chip-fields' : 'job-fields';
    const stop = (el)=>{ ['mousedown','click'].forEach(ev=>el.addEventListener(ev, e=>e.stopPropagation())); };
    const time = document.createElement('input');
    time.type = 'time'; time.value = job.start || ''; time.title = 'Start time';
    time.className = 'job-time';
    time.addEventListener('focus', ()=>{ isEditingText = true; });
    time.addEventListener('blur', ()=>{ isEditingText = false; });
    time.addEventListener('change', ()=>{ patchJob(col, tech.id, ref, { start: time.value }); save(); render(); });
    stop(time); row.appendChild(time);
    const wo = document.createElement('input');
    wo.type = 'text'; wo.value = job.wo || ''; wo.placeholder = 'WO #'; wo.title = 'Work order number';
    wo.className = 'job-wo';
    wo.addEventListener('focus', ()=>{ isEditingText = true; });
    wo.addEventListener('blur', ()=>{
      isEditingText = false;
      if(wo.value.trim() !== (job.wo || '')){ patchJob(col, tech.id, ref, { wo: wo.value.trim() }); save(); }
    });
    wo.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') wo.blur(); });
    stop(wo); row.appendChild(wo);
    const lab = document.createElement('label');
    lab.className = kind === 'chip' ? 'chip-done' : 'job-done';
    lab.title = 'Check once this has been entered in Field Hub';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = !!job.done; cb.className = 'job-done-cb';
    cb.addEventListener('change', ()=>{ patchJob(col, tech.id, ref, { done: cb.checked }); save(); render(); });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode('Field Hub'));
    stop(lab);
    row.appendChild(lab);
    return row;
  }

  function renderChip(tech, col, district, posIdx, cellSize, ref){
    const isExtra = !!(ref && ref.x);
    const job = jobOf(col, tech.id, ref) || { districtId: district.id, note:'' };
    const chip = document.createElement('div');
    chip.className = 'chip' + (isExtra ? ' extra-job' : '') + (job.done && district.id !== 'bench' ? ' done' : '');
    chip.style.borderLeftColor = techColor(tech);
    chip.draggable = !isExtra;
    if(isExtra){
      const tag = document.createElement('div');
      tag.className = 'extra-tag'; tag.textContent = 'ADDITIONAL JOB';
      chip.appendChild(tag);
    }

    const hasDayOverride = !isExtra && col.dayIdx != null && !!dayPlacementOf(col.weekId, col.dayIdx, tech.id);
    if(hasDayOverride) chip.classList.add('day-override');

    chip.addEventListener('dragstart', ()=>{
      dragTechId = tech.id; dragFromCol = col.key;
      chip.classList.add('dragging');
    });
    chip.addEventListener('dragend', ()=>{
      chip.classList.remove('dragging');
      dragTechId = null; dragFromCol = null;
      tableEl.querySelectorAll('.drop-before').forEach(el=>el.classList.remove('drop-before'));
    });

    // Dropping on a chip inserts the dragged tech just ahead of it (reorder / insert).
    chip.addEventListener('dragover', (e)=>{
      if(!dragTechId || dragFromCol !== col.key || dragTechId === tech.id) return;
      e.preventDefault(); e.stopPropagation();
      chip.classList.add('drop-before');
    });
    chip.addEventListener('dragleave', ()=>{ chip.classList.remove('drop-before'); });
    chip.addEventListener('drop', (e)=>{
      if(!dragTechId || dragFromCol !== col.key || dragTechId === tech.id) return;
      e.preventDefault(); e.stopPropagation();
      chip.classList.remove('drop-before');
      placeTech(col, dragTechId, district.id, tech.id);
      const flashKey = col.key;
      dragTechId = null; dragFromCol = null;
      save(); render();
      flashCell(flashKey, district.id);
    });

    const top = document.createElement('div');
    top.className = 'chip-top';

    if(senLabel(tech)){
      const sn = document.createElement('span');
      sn.className = 'chip-sen'; sn.textContent = senLabel(tech); sn.title = 'Seniority ' + senLabel(tech);
      top.appendChild(sn);
    }
    const nameEl = document.createElement('div');
    nameEl.className = 'chip-name';
    nameEl.contentEditable = true;
    nameEl.textContent = tech.name;
    nameEl.addEventListener('focus', ()=>{ isEditingText = true; });
    nameEl.addEventListener('blur', ()=>{
      isEditingText = false;
      tech.name = nameEl.textContent.trim();
      save();
    });
    top.appendChild(nameEl);

    const profileBtn = document.createElement('button');
    profileBtn.className = 'chip-profile-btn' + (tech.role||tech.phone||tech.detail ? ' has-detail' : '');
    profileBtn.textContent = 'i';
    profileBtn.title = 'View / edit profile';
    profileBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openProfile(tech.id);
    });
    chip.appendChild(profileBtn);

    const rm = document.createElement('button');
    rm.className = 'chip-x';
    rm.innerHTML = '&times;';
    rm.title = isExtra ? 'Remove this additional job' : (district.id==='bench' ? 'Remove from roster' : 'Send back to bench');
    rm.addEventListener('click', ()=>{
      if(isExtra){
        if(!confirm('Remove this additional job for '+(tech.name || 'this tech')+'?')) return;
        removeExtra(col, ref.x);
        save(); render();
      } else if(district.id==='bench'){
        deleteTechFromRoster(tech.id);
      } else {
        if(!confirm('Send '+(tech.name || 'this tech')+' back to the bench for this '+(col.dayIdx == null ? 'week' : 'day')+'?')) return;
        sendPrimaryToBench(col, tech.id);
        save(); render();
      }
    });
    top.appendChild(rm);
    chip.appendChild(top);

    const note = document.createElement('div');
    note.className = 'chip-note';
    note.contentEditable = true;
    note.textContent = job.note || '';
    note.addEventListener('focus', ()=>{ isEditingText = true; });
    note.addEventListener('blur', ()=>{
      isEditingText = false;
      patchJob(col, tech.id, ref, { note: note.textContent.trim() });
      save();
    });
    chip.appendChild(note);

    if(district.id !== 'bench'){
      chip.appendChild(buildJobFields(col, tech, ref, job, 'chip'));
      if(job.done){
        const tag = document.createElement('div');
        tag.className = 'fh-tag'; tag.textContent = '\u2713 IN FIELD HUB';
        chip.appendChild(tag);
      }
    }

    const districtSelect = document.createElement('select');
    districtSelect.className = 'chip-district-select';
    districtSelect.title = 'Reassign to a different district for this ' + (col.dayIdx == null ? 'week' : 'day');
    fillDistrictOptions(districtSelect, district.id, col.weekId, { allowBench: !isExtra });
    districtSelect.addEventListener('mousedown', (e)=>{ e.stopPropagation(); });
    districtSelect.addEventListener('click', (e)=>{ e.stopPropagation(); });
    districtSelect.addEventListener('focus', ()=>{ isEditingText = true; });
    districtSelect.addEventListener('blur', ()=>{ isEditingText = false; });
    districtSelect.addEventListener('change', ()=>{
      const newDistrictId = districtSelect.value;
      isEditingText = false;
      if(newDistrictId === '__new__'){
        districtSelect.value = district.id;
        openJobModal({ weekIds:[col.weekId], onAdded:(did)=>{
          if(isExtra) patchJob(col, tech.id, ref, { districtId: did }); else placeTech(col, tech.id, did);
        }});
        return;
      }
      if(newDistrictId === district.id) return;
      if(isExtra) patchJob(col, tech.id, ref, { districtId: newDistrictId });
      else if(newDistrictId === 'bench') sendPrimaryToBench(col, tech.id);
      else placeTech(col, tech.id, newDistrictId);
      const flashKey = col.key;
      save(); render();
      flashCell(flashKey, newDistrictId);
    });
    chip.appendChild(districtSelect);

    if(isExtra){
      /* additional jobs have no week-plan badge */
    } else if(col.dayIdx == null){
      const diffs = techDayDiffs(col.weekId, tech.id);
      if(diffs.length > 0){
        const badge = document.createElement('div');
        badge.className = 'chip-badge';
        badge.textContent = 'Days differ';
        badge.title = diffs.map(df=>{
          const d = board.districts.find(x=>x.id===df.districtId);
          const dayName = ['Mon','Tue','Wed','Thu','Fri'][df.dayIdx];
          return dayName + ': ' + (df.extra ? '+ ' : '') + (df.districtId==='bench' ? 'Bench' : (d ? d.label : '?'));
        }).join('\n') + '\n(Switch to Day view to edit)';
        chip.appendChild(badge);
      }
    } else if(hasDayOverride){
      const reset = document.createElement('button');
      reset.className = 'chip-reset';
      reset.textContent = '↺ week plan';
      reset.title = 'Remove this day-specific change and follow the week plan again';
      reset.addEventListener('click', (e)=>{
        e.stopPropagation();
        clearDayOverride(col, tech.id);
        save(); render();
      });
      chip.appendChild(reset);
    }

    if(cellSize > 1 && !isExtra){
      const reorder = document.createElement('div');
      reorder.className = 'chip-reorder';

      const up = document.createElement('button');
      up.className = 'chip-move-btn'; up.textContent = '▲'; up.title = 'Move up';
      up.disabled = posIdx === 0 || (board.techSort||'manual') !== 'manual';
      if((board.techSort||'manual') !== 'manual') up.title = 'Set tech order to Manual to reorder';
      up.addEventListener('click', (e)=>{
        e.stopPropagation();
        moveTechInCell(col, district.id, tech.id, -1);
      });
      reorder.appendChild(up);

      const down = document.createElement('button');
      down.className = 'chip-move-btn'; down.textContent = '▼'; down.title = 'Move down';
      down.disabled = posIdx === cellSize - 1 || (board.techSort||'manual') !== 'manual';
      if((board.techSort||'manual') !== 'manual') down.title = 'Set tech order to Manual to reorder';
      down.addEventListener('click', (e)=>{
        e.stopPropagation();
        moveTechInCell(col, district.id, tech.id, 1);
      });
      reorder.appendChild(down);

      chip.appendChild(reorder);
    }

    return chip;
  }

  function removeJobFromWeek(weekId, districtId){
    const wp = board.placements[weekId] || {};
    Object.keys(wp).forEach(tid=>{ if(wp[tid].districtId === districtId) wp[tid] = { districtId:'bench', note:'' }; });
    const prefix = weekId + ':';
    Object.keys(board.dayPlacements).forEach(k=>{
      if(k.indexOf(prefix) !== 0) return;
      Object.keys(board.dayPlacements[k]).forEach(tid=>{ if(board.dayPlacements[k][tid].districtId === districtId) delete board.dayPlacements[k][tid]; });
      if(Object.keys(board.dayPlacements[k]).length === 0) delete board.dayPlacements[k];
    });
    Object.keys(board.extras).forEach(k=>{
      if(k.indexOf(prefix) !== 0) return;
      Object.keys(board.extras[k]).forEach(id=>{ if(board.extras[k][id].districtId === districtId) delete board.extras[k][id]; });
      if(Object.keys(board.extras[k]).length === 0) delete board.extras[k];
    });
    Object.keys(board.cellNotes).filter(k=>k === weekId || k.indexOf(prefix) === 0).forEach(k=>{
      delete board.cellNotes[k][districtId];
      if(Object.keys(board.cellNotes[k]).length === 0) delete board.cellNotes[k];
    });
    if(board.weekJobs[weekId]) delete board.weekJobs[weekId][districtId];
  }
