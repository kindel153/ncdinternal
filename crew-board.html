<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Field Crew Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --board-bg:#EDEAE2;
    --board-line:#D9D4C7;
    --ink:#22262B;
    --ink-soft:#5A5F66;
    --header-bg:#20242B;
    --header-text:#F4F1E8;
    --card-bg:#FFFDF8;
    --card-edge:#22262B;
    --paper-shadow:3px 3px 0 rgba(34,38,43,0.18);
    --paper-shadow-hover:4px 4px 0 rgba(34,38,43,0.24);
    --accent:#B5563C;
    --danger:#A8402C;
    --pto:#A8402C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(var(--board-line) 1px, transparent 1px) 0 0/22px 22px,
      var(--board-bg);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 24px 60px;
  }
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:3px solid var(--ink);
    flex-wrap:wrap;
  }
  .title-block h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:0.3px;
    margin:0;
    color:var(--ink);
  }
  .title-block p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .topbar-actions{display:flex;gap:10px;align-items:center;}
  button{
    font-family:'IBM Plex Sans', sans-serif;
    cursor:pointer;
  }
  .btn{
    border:2px solid var(--ink);
    background:var(--card-bg);
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:2px;
    box-shadow:var(--paper-shadow);
    transition:transform .08s ease;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:var(--paper-shadow-hover);}
  .btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(34,38,43,0.2);}
  .btn.primary{background:var(--ink);color:var(--header-text);}

  .board{
    display:flex;
    gap:18px;
    align-items:flex-start;
    overflow-x:auto;
    padding-bottom:20px;
  }
  .column{
    flex:0 0 268px;
    background:rgba(255,253,248,0.55);
    border:1.5px solid var(--board-line);
    border-radius:3px;
    min-height:120px;
    display:flex;
    flex-direction:column;
  }
  .column.drag-over{
    outline:2px dashed var(--accent);
    outline-offset:-2px;
  }
  .column-header{
    background:var(--header-bg);
    color:var(--header-text);
    padding:10px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
  }
  .column.bench{
    border:1.5px dashed #A8A190;
    background:rgba(237,234,226,0.5);
  }
  .column.bench .column-header{
    background:#5A5F66;
  }
  .bench-tag{
    font-family:'Oswald', sans-serif;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.6px;
    color:#D8D4C8;
    display:block;
    margin-bottom:1px;
  }
  .column-title{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.2px;
    background:transparent;
    border:none;
    color:var(--header-text);
    outline:none;
    width:100%;
    padding:2px 0;
  }
  .column-title:focus{border-bottom:1px solid var(--header-text);}
  .col-remove{
    background:none;border:none;color:#C9A79C;font-size:16px;line-height:1;
    padding:2px 4px;opacity:.7;
  }
  .col-remove:hover{opacity:1;color:#fff;}
  .column-body{
    padding:12px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .empty-hint{
    font-size:12px;
    color:var(--ink-soft);
    font-style:italic;
    text-align:center;
    padding:14px 4px;
    border:1.5px dashed var(--board-line);
    border-radius:2px;
  }

  .card{
    background:var(--card-bg);
    border:1.5px solid var(--card-edge);
    border-left-width:7px;
    box-shadow:var(--paper-shadow);
    padding:10px 11px 9px;
    position:relative;
    cursor:grab;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .card:hover{transform:translate(-1px,-1px);box-shadow:var(--paper-shadow-hover);}
  .card.dragging{opacity:0.35;}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:6px;
    margin-bottom:5px;
  }
  .crew-name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.2px;
    outline:none;
    flex:1;
    min-width:0;
  }
  .card-remove{
    background:none;border:none;color:var(--ink-soft);font-size:14px;
    padding:0 2px;opacity:0;transition:opacity .1s;flex-shrink:0;
  }
  .card:hover .card-remove{opacity:0.8;}
  .card-remove:hover{color:var(--danger);opacity:1;}
  .divider{
    border:none;
    border-top:1px dashed #C9C3B5;
    margin:6px 0;
  }
  .site{
    font-size:13.5px;
    font-weight:500;
    outline:none;
    min-height:18px;
    color:var(--ink);
  }
  .members{
    font-size:11.5px;
    color:var(--ink-soft);
    outline:none;
    margin-top:4px;
    min-height:14px;
  }
  .pto-tag{
    font-size:11px;
    color:var(--pto);
    font-weight:600;
    margin-top:5px;
    outline:none;
    min-height:14px;
  }
  .pto-tag:empty::before{content:"+ PTO / unavailable note";color:#B7B0A0;font-weight:400;font-style:italic;}
  .members:empty::before{content:"+ crew members";color:#B7B0A0;font-style:italic;}
  .site:empty::before{content:"Job site / task";color:#B7B0A0;font-style:italic;}
  .crew-name:empty::before{content:"Crew lead";color:#c9c2b4;font-style:italic;}

  .swatches{
    display:flex;gap:5px;margin-top:8px;
  }
  .swatch{
    width:14px;height:14px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,0.25);
    cursor:pointer;
  }
  .swatch.active{outline:2px solid var(--ink);outline-offset:1px;}

  .add-card-btn{
    border:1.5px dashed var(--board-line);
    background:transparent;
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:600;
    padding:9px;
    border-radius:2px;
  }
  .add-card-btn:hover{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,0.4);}

  .add-column{
    flex:0 0 190px;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding-top:6px;
  }
  .add-column button{
    width:100%;
    border:1.5px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:12px;
    border-radius:2px;
  }
  .add-column button:hover{border-color:var(--ink);color:var(--ink);}

  .status{
    position:fixed;
    bottom:14px;right:18px;
    font-size:11px;
    color:var(--ink-soft);
    background:rgba(237,234,226,0.9);
    padding:4px 8px;
    border-radius:2px;
  }
  .sync-note{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:-14px 0 18px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title-block">
    <a href="index.html" style="font-family:'Oswald',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:0.4px;color:var(--ink-soft);text-decoration:none;">&larr; NCD INTERNAL</a>
    <h1 style="margin-top:6px;">Field Crew Board</h1>
    <p>Shared board \u2014 anyone with this link can view and edit it. Drag a ticket to reassign, click any text to edit.</p>
  </div>
  <div class="topbar-actions">
    <button class="btn" id="refreshBtn">Refresh</button>
    <button class="btn" id="exportBtn">Export to spreadsheet</button>
    <button class="btn" id="resetBtn">Reset to sample data</button>
    <button class="btn primary" id="addWeekBtn">+ Add week</button>
  </div>
</div>
<div class="sync-note" id="syncNote"></div>

<div class="board" id="board"></div>
<div class="status" id="status"></div>

<script>
(function(){

  const COLORS = ["#3B6E8F","#B5563C","#5B7F5E","#C99A2E","#6B5B7A","#2E8B8B","#8C4A3C","#8A6FA0","#7A8450","#4A6FA5"];
  const crewColor = {};
  let colorCursor = 0;
  function colorForCrew(name){
    if(!crewColor[name]){
      crewColor[name] = COLORS[colorCursor % COLORS.length];
      colorCursor++;
    }
    return crewColor[name];
  }

  function uid(){ return Math.random().toString(36).slice(2,10); }

  function seedData(){
    crewColor.length = 0;
    for (const k in crewColor) delete crewColor[k];
    colorCursor = 0;

    function card(crew, site, members, notes, pto){
      return { id: uid(), crew, color: colorForCrew(crew), site, members: members||"", notes: notes||"", pto: pto||"" };
    }

    return {
      columns: [
        {
          id: 'bench', title: "Bench / Unassigned", isBench: true,
          cards: [
            card("Joe Rosario", "Seasonal / on-call \u2014 no current assignment", ""),
            card("Bill Murphy", "Seasonal / on-call \u2014 no current assignment", ""),
            card("Ernie", "Seasonal / on-call \u2014 no current assignment", ""),
          ]
        },
        {
          id: uid(), title: "Week of Aug 10",
          cards: [
            card("Chris DiAngelo (Lead)", "Carle Place PDK", "Juan Concepcion, Mike Mullen Jr."),
            card("Mike Jack (Lead)", "East Williston Access Control", "Sakiris Diaz"),
            card("Miguel Martinez (Lead)", "Hempstead", "Frank Gioielli, Piet"),
            card("Gerald Abt (Lead)", "Freeport PDK", "Jarrett Abt"),
            card("Anthony DiAngelo (Lead)", "Freeport Giblyn PA (2 days)", "Shaun McKee", "", "8/12\u20138/14, 8/17\u20138/20"),
            card("Tayfun Uzun (Lead)", "Lynbrook PA", "Rafy, Ernie"),
            card("Mike Mullen (Lead)", "Floral Park", "Pat Uhlman"),
            card("Matt Abt (Lead)", "Syosset", "Kevin Bolin, Ed Aukstolis", "Syosset Science Rooms / OT?"),
            card("Kevin Miranda", "\u2014 no job, on PTO", "Rafael Abreu?", "", "8/10\u20138/14"),
          ]
        },
        {
          id: uid(), title: "Week of Aug 17",
          cards: [
            card("Chris DiAngelo (Lead)", "Carle Place PDK", "Juan Concepcion, Mike Mullen Jr."),
            card("Mike Jack (Lead)", "VS-13 Lockdown", "Sakiris Diaz"),
            card("Miguel Martinez (Lead)", "Hempstead", "Frank Gioielli, Piet"),
            card("Gerald Abt (Lead)", "Freeport Columbus Door Ajar", "Jarrett Abt"),
            card("Kevin Miranda", "East Meadow", "Rafael Abreu?"),
            card("Tayfun Uzun (Lead)", "Lynbrook PA", "Rafy, Ernie"),
            card("Anthony DiAngelo (Lead)", "North Babylon?", "Shaun McKee"),
            card("Mike Mullen (Lead)", "Floral Park", "Pat Uhlman"),
            card("Matt Abt (Lead)", "Oceanside", "Kevin Bolin, Ed Aukstolis", "North Babylon camera swaps; Manhasset LPR cameras"),
          ]
        },
        {
          id: uid(), title: "Week of Aug 24",
          cards: [
            card("Chris DiAngelo (Lead)", "Carle Place PDK", "Juan Concepcion, Mike Mullen Jr."),
            card("Mike Jack (Lead)", "VS-13 Lockdown", "Sakiris Diaz"),
            card("Miguel Martinez (Lead)", "Hempstead", "Frank Gioielli, Piet"),
            card("Gerald Abt (Lead)", "Freeport Columbus Door Ajar", "Jarrett Abt"),
            card("Anthony DiAngelo (Lead)", "Freeport Giblyn PA", "Shaun McKee"),
            card("Tayfun Uzun (Lead)", "Lynbrook PA", "Rafy, Ernie"),
            card("Anthony DiAngelo (Lead)", "North Babylon?", "Shaun McKee"),
            card("Mike Mullen (Lead)", "Manhasset", "Pat Uhlman"),
            card("Matt Abt (Lead)", "Oceanside", "Kevin Bolin, Ed Aukstolis"),
          ]
        },
        {
          id: uid(), title: "Week of Aug 31",
          cards: [
            card("Mike Jack (Lead)", "VS-13 Lockdown", "Sakiris Diaz"),
            card("Miguel Martinez (Lead)", "Hempstead", "Frank Gioielli, Piet"),
            card("Gerald Abt (Lead)", "Freeport Columbus Door Ajar", "Jarrett Abt"),
            card("Anthony DiAngelo (Lead)", "Freeport Giblyn PA", "Shaun McKee"),
            card("Anthony DiAngelo (Lead)", "North Babylon?", "Shaun McKee"),
          ]
        }
      ]
    };
  }

  let board = null;
  let dragCardId = null;
  let dragFromCol = null;
  let isEditingText = false;
  let lastSavedJSON = "";
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const syncNoteEl = document.getElementById('syncNote');

  function setStatus(msg){
    statusEl.textContent = msg;
    if(msg) setTimeout(()=>{ if(statusEl.textContent===msg) statusEl.textContent=""; }, 1800);
  }

  function timeNow(){
    return new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }

  async function save(){
    try{
      const json = JSON.stringify(board);
      const res = await window.storage.set('crew-board-state', json, true);
      if(res){
        lastSavedJSON = json;
        syncNoteEl.textContent = "Last saved " + timeNow() + " \u2014 visible to everyone with this link";
      }
    }catch(e){
      console.error("Storage error:", e);
      setStatus("Couldn't save (storage unavailable)");
    }
  }

  async function load(){
    try{
      const res = await window.storage.get('crew-board-state', true);
      if(res && res.value){
        board = JSON.parse(res.value);
        lastSavedJSON = res.value;
        if(!board.columns.some(c=>c.isBench)){
          board.columns.unshift({ id:'bench', title:'Bench / Unassigned', isBench:true, cards:[] });
        }
        board.columns.forEach(col=>col.cards.forEach(c=>{ crewColor[c.crew]=c.color; }));
        colorCursor = Object.keys(crewColor).length;
        return;
      }
    }catch(e){
      // no saved key yet, fall through to seed
    }
    board = seedData();
    await save();
  }

  async function refreshFromShared(silent){
    if(isEditingText || dragCardId) return; // don't yank the board out from under someone mid-edit
    try{
      const res = await window.storage.get('crew-board-state', true);
      if(res && res.value && res.value !== lastSavedJSON){
        board = JSON.parse(res.value);
        lastSavedJSON = res.value;
        if(!board.columns.some(c=>c.isBench)){
          board.columns.unshift({ id:'bench', title:'Bench / Unassigned', isBench:true, cards:[] });
        }
        board.columns.forEach(col=>col.cards.forEach(c=>{ crewColor[c.crew]=c.color; }));
        colorCursor = Object.keys(crewColor).length;
        render();
        if(!silent) setStatus("Updated by someone else");
      }
    }catch(e){
      // ignore transient fetch errors on background poll
    }
  }

  function render(){
    boardEl.innerHTML = "";
    board.columns.forEach(col=>{
      const colEl = document.createElement('div');
      colEl.className = 'column' + (col.isBench ? ' bench' : '');
      colEl.dataset.colId = col.id;

      const header = document.createElement('div');
      header.className = 'column-header';
      const headerText = document.createElement('div');
      headerText.style.flex = '1';
      headerText.style.minWidth = '0';
      if(col.isBench){
        const tag = document.createElement('span');
        tag.className = 'bench-tag';
        tag.textContent = 'NOT SCHEDULED THIS WEEK';
        headerText.appendChild(tag);
      }
      const titleInput = document.createElement('input');
      titleInput.className = 'column-title';
      titleInput.value = col.title;
      titleInput.addEventListener('focus', ()=>{ isEditingText = true; });
      titleInput.addEventListener('blur', ()=>{ isEditingText = false; });
      titleInput.addEventListener('change', ()=>{ col.title = titleInput.value; save(); });
      headerText.appendChild(titleInput);
      header.appendChild(headerText);
      if(!col.isBench){
        const removeCol = document.createElement('button');
        removeCol.className = 'col-remove';
        removeCol.innerHTML = '&times;';
        removeCol.title = 'Delete week';
        removeCol.addEventListener('click', ()=>{
          if(confirm('Delete "'+col.title+'" and all its tickets?')){
            board.columns = board.columns.filter(c=>c.id!==col.id);
            save(); render();
          }
        });
        header.appendChild(removeCol);
      }
      colEl.appendChild(header);

      const body = document.createElement('div');
      body.className = 'column-body';

      if(col.cards.length===0){
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = 'No jobs scheduled';
        body.appendChild(hint);
      }

      col.cards.forEach(card=>{
        body.appendChild(renderCard(card, col));
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'add-card-btn';
      addBtn.textContent = '+ Add job';
      addBtn.addEventListener('click', ()=>{
        const c = { id: uid(), crew: "", color: COLORS[colorCursor % COLORS.length], site: "", members: "", notes: "", pto: "" };
        colorCursor++;
        col.cards.push(c);
        save(); render();
      });
      body.appendChild(addBtn);

      colEl.appendChild(body);

      colEl.addEventListener('dragover', (e)=>{
        e.preventDefault();
        colEl.classList.add('drag-over');
      });
      colEl.addEventListener('dragleave', ()=>{ colEl.classList.remove('drag-over'); });
      colEl.addEventListener('drop', (e)=>{
        e.preventDefault();
        colEl.classList.remove('drag-over');
        if(!dragCardId || !dragFromCol) return;
        const fromCol = board.columns.find(c=>c.id===dragFromCol);
        const idx = fromCol.cards.findIndex(c=>c.id===dragCardId);
        if(idx===-1) return;
        const [moved] = fromCol.cards.splice(idx,1);
        col.cards.push(moved);
        dragCardId = null; dragFromCol = null;
        save(); render();
      });

      boardEl.appendChild(colEl);
    });

    const addColWrap = document.createElement('div');
    addColWrap.className = 'add-column';
    const addColBtn = document.createElement('button');
    addColBtn.textContent = '+ Add week';
    addColBtn.addEventListener('click', addWeek);
    addColWrap.appendChild(addColBtn);
    boardEl.appendChild(addColWrap);
  }

  function renderCard(card, col){
    const el = document.createElement('div');
    el.className = 'card';
    el.style.borderLeftColor = card.color;
    el.draggable = true;

    el.addEventListener('dragstart', ()=>{
      dragCardId = card.id; dragFromCol = col.id;
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); });

    const top = document.createElement('div');
    top.className = 'card-top';

    const nameEl = document.createElement('div');
    nameEl.className = 'crew-name';
    nameEl.contentEditable = true;
    nameEl.textContent = card.crew;
    nameEl.addEventListener('focus', ()=>{ isEditingText = true; });
    nameEl.addEventListener('blur', ()=>{ isEditingText = false; card.crew = nameEl.textContent.trim(); save(); });
    top.appendChild(nameEl);

    const rm = document.createElement('button');
    rm.className = 'card-remove';
    rm.innerHTML = '&times;';
    rm.title = 'Remove ticket';
    rm.addEventListener('click', ()=>{
      col.cards = col.cards.filter(c=>c.id!==card.id);
      save(); render();
    });
    top.appendChild(rm);
    el.appendChild(top);

    const hr = document.createElement('hr');
    hr.className = 'divider';
    el.appendChild(hr);

    const site = document.createElement('div');
    site.className = 'site';
    site.contentEditable = true;
    site.textContent = card.site;
    site.addEventListener('focus', ()=>{ isEditingText = true; });
    site.addEventListener('blur', ()=>{ isEditingText = false; card.site = site.textContent.trim(); save(); });
    el.appendChild(site);

    const members = document.createElement('div');
    members.className = 'members';
    members.contentEditable = true;
    members.textContent = card.members;
    members.addEventListener('focus', ()=>{ isEditingText = true; });
    members.addEventListener('blur', ()=>{ isEditingText = false; card.members = members.textContent.trim(); save(); });
    el.appendChild(members);

    const pto = document.createElement('div');
    pto.className = 'pto-tag';
    pto.contentEditable = true;
    pto.textContent = card.pto;
    pto.addEventListener('focus', ()=>{ isEditingText = true; });
    pto.addEventListener('blur', ()=>{ isEditingText = false; card.pto = pto.textContent.trim(); save(); });
    el.appendChild(pto);

    const sw = document.createElement('div');
    sw.className = 'swatches';
    COLORS.forEach(c=>{
      const dot = document.createElement('div');
      dot.className = 'swatch' + (c===card.color ? ' active' : '');
      dot.style.background = c;
      dot.addEventListener('click', ()=>{
        card.color = c;
        save(); render();
      });
      sw.appendChild(dot);
    });
    el.appendChild(sw);

    return el;
  }

  function addWeek(){
    board.columns.push({ id: uid(), title: "New Week", cards: [] });
    save(); render();
  }

  function exportBoard(){
    try{
      const rows = [["Week", "Crew Lead", "Job / Site", "Crew Members", "PTO / Note"]];
      board.columns.forEach(col=>{
        if(col.cards.length===0) return;
        col.cards.forEach(c=>{
          rows.push([col.title, c.crew, c.site, c.members, c.pto]);
        });
      });
      if(rows.length===1){
        alert('No tickets on the board yet \u2014 add some jobs before exporting.');
        return;
      }
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:22},{wch:24},{wch:34},{wch:28},{wch:26}];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Crew Board");
      const stamp = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, "crew-board-" + stamp + ".xlsx");
      setStatus("Exported");
    }catch(e){
      console.error("Export error:", e);
      alert("Export failed \u2014 the spreadsheet library may not have loaded. Try again in a moment.");
    }
  }

  document.getElementById('exportBtn').addEventListener('click', exportBoard);
  document.getElementById('addWeekBtn').addEventListener('click', addWeek);
  document.getElementById('refreshBtn').addEventListener('click', ()=>refreshFromShared(false));
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('Reset the board back to the sample August schedule? This clears the board for everyone using this link.')){
      board = seedData();
      save(); render();
    }
  });

  (async function init(){
    setStatus("Loading\u2026");
    await load();
    render();
    setStatus("");
    setInterval(()=>refreshFromShared(true), 15000);
  })();

})();
</script>
</body>
</html>
