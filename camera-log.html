<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Camera Check Log — NCD Internal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --board-bg:#EDEAE2; --board-line:#D9D4C7; --ink:#22262B; --ink-soft:#5A5F66;
    --header-bg:#20242B; --header-text:#F4F1E8; --card-bg:#FFFDF8; --accent:#B5563C;
    --ok:#DDF5E2; --ok-line:#7DBE8C; --bad:#FBE3DE; --bad-line:#D9806C; --warn:#FFF1CC; --warn-line:#E0B84A; --blue:#DCE9FA;
    --shadow:3px 3px 0 rgba(34,38,43,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(var(--board-line) 1px, transparent 1px) 0 0/22px 22px, var(--board-bg);
    font-family:'IBM Plex Sans',system-ui,sans-serif; color:var(--ink); min-height:100vh; font-size:14px;
  }
  header.top{ background:var(--header-bg); color:var(--header-text); padding:18px 24px 14px; border-bottom:5px solid var(--accent); }
  .top-inner{ max-width:1250px; margin:0 auto; display:flex; flex-wrap:wrap; gap:14px 24px; align-items:flex-end; justify-content:space-between; }
  .back{ font-size:12px; color:#C7C3B7; text-decoration:none; font-family:'Oswald',sans-serif; letter-spacing:.5px; }
  .back:hover{ color:#fff; }
  header.top h1{ font-family:'Oswald',sans-serif; font-weight:700; font-size:28px; margin:2px 0 0; letter-spacing:.3px; }
  .top-right{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:12px; color:#C7C3B7; }
  .who{ display:flex; align-items:center; gap:6px; }
  .who input{ background:#2C313A; border:1px solid #4A515C; color:#fff; padding:6px 8px; font:inherit; font-size:13px; width:150px; border-radius:2px; }
  #syncState{ display:flex; align-items:center; gap:6px; }
  #syncState i{ width:8px; height:8px; border-radius:50%; background:#6DBE7D; display:inline-block; }
  #syncState.off i{ background:#E0A63A; } #syncState.err i{ background:#E0574A; }
  main{ max-width:1250px; margin:0 auto; padding:16px 24px 60px; }
  .tabs{ display:flex; gap:4px; border-bottom:2px solid var(--ink); margin-bottom:16px; flex-wrap:wrap; }
  .tab{ font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; letter-spacing:.3px; padding:9px 16px; background:transparent; border:0; border-bottom:4px solid transparent; margin-bottom:-2px; cursor:pointer; color:var(--ink-soft); }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .badge{ display:inline-block; min-width:18px; padding:1px 6px; margin-left:6px; border-radius:9px; background:var(--accent); color:#fff; font-size:11px; font-family:'IBM Plex Sans'; font-weight:600; text-align:center; }
  .badge.zero{ display:none; }
  .btn{ font-family:'Oswald',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.3px; padding:7px 12px; background:var(--card-bg); color:var(--ink); border:1.5px solid var(--ink); box-shadow:2px 2px 0 rgba(34,38,43,.2); cursor:pointer; border-radius:0; }
  .btn:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 rgba(34,38,43,.25); }
  .btn.primary{ background:var(--ink); color:#fff; }
  .btn.accent{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.small{ padding:4px 8px; font-size:11.5px; box-shadow:none; }
  .btn.danger{ color:#B3261E; border-color:#B3261E; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  input,select,textarea{ font-family:'IBM Plex Sans',sans-serif; font-size:13px; color:var(--ink); border:1.3px solid var(--board-line); background:#fff; padding:6px 8px; border-radius:2px; outline:none; }
  input:focus,select:focus,textarea:focus{ border-color:var(--accent); }
  .card{ background:var(--card-bg); border:1.5px solid var(--ink); box-shadow:var(--shadow); padding:14px 16px; }
  .bar{ display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin-bottom:14px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ padding:5px 10px; border:1.3px solid var(--ink); background:var(--card-bg); font-size:12.5px; font-weight:600; }
  .chip.ok{ background:var(--ok); border-color:var(--ok-line); } .chip.bad{ background:var(--bad); border-color:var(--bad-line); } .chip.warn{ background:var(--warn); border-color:var(--warn-line); }
  .muted{ color:var(--ink-soft); }
  h2.sec{ font-family:'Oswald',sans-serif; font-size:16px; margin:20px 0 8px; letter-spacing:.3px; }

  /* daily table */
  .tbl-wrap{ overflow:auto; border:1.5px solid var(--ink); background:var(--card-bg); box-shadow:var(--shadow); }
  table.grid{ border-collapse:collapse; width:100%; min-width:820px; }
  table.grid th{ background:var(--header-bg); color:var(--header-text); font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:.5px; text-align:left; padding:8px 10px; position:sticky; top:0; z-index:2; }
  table.grid td{ border-top:1px solid var(--board-line); padding:5px 8px; vertical-align:top; }
  tr.client-row td{ background:#E7E2D4; border-top:2px solid var(--ink); font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; padding:7px 10px; vertical-align:middle; }
  tr.client-row .cr-meta{ font-family:'IBM Plex Sans'; font-weight:500; font-size:12px; color:var(--ink-soft); margin-left:10px; }
  tr.site-row.ok td{ background:var(--ok); }
  tr.site-row.bad td{ background:var(--bad); }
  td.loc{ font-weight:600; width:24%; padding-top:11px; }
  td.dn input{ width:62px; text-align:center; font-weight:600; font-size:15px; }
  td.tm input{ width:112px; }
  td.nt textarea{ width:100%; min-height:32px; resize:vertical; line-height:1.35; }
  td.ac{ width:190px; font-size:12px; }
  .pill{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; border:1px solid var(--ink); background:#fff; white-space:nowrap; }
  .pill.reported{ background:var(--warn); border-color:var(--warn-line); } .pill.scheduled{ background:var(--blue); border-color:#7FA6D9; }
  .pill.completed{ background:var(--ok); border-color:var(--ok-line); } .pill.billed{ background:#E6E0F4; border-color:#9A8CC9; } .pill.closed{ background:#EEE; border-color:#AAA; }
  .pill.new{ background:var(--accent); color:#fff; border-color:var(--accent); } .pill.read{ background:var(--warn); border-color:var(--warn-line); } .pill.done{ background:var(--ok); border-color:var(--ok-line); }
  a.link{ color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline; }
  .banner{ padding:10px 14px; border:1.5px solid var(--ok-line); background:var(--ok); margin-bottom:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .banner.warn{ background:var(--warn); border-color:var(--warn-line); }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:800px){ .two{ grid-template-columns:1fr; } main{ padding:12px; } }

  /* workflow */
  .stages{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .stage{ padding:8px 12px; border:1.5px solid var(--ink); background:var(--card-bg); cursor:pointer; font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; }
  .stage b{ margin-left:6px; font-family:'IBM Plex Sans'; }
  .stage.active{ background:var(--ink); color:#fff; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
  .tk{ background:var(--card-bg); border:1.5px solid var(--ink); border-left-width:7px; box-shadow:var(--shadow); padding:12px 14px; cursor:pointer; }
  .tk.needs{ border-left-color:var(--bad-line); cursor:default; } .tk.reported{ border-left-color:var(--warn-line); } .tk.scheduled{ border-left-color:#7FA6D9; }
  .tk.completed{ border-left-color:var(--ok-line); } .tk.billed{ border-left-color:#9A8CC9; } .tk.closed{ border-left-color:#AAA; }
  .tk:hover{ box-shadow:4px 4px 0 rgba(34,38,43,.24); }
  .tk h3{ margin:0 0 4px; font-family:'Oswald',sans-serif; font-size:16px; }
  .tk .meta{ font-size:12px; color:var(--ink-soft); margin:3px 0; }
  .tk .cams{ font-size:12.5px; margin:6px 0; line-height:1.45; }
  .tk .row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .hint-ok{ color:#2C7A3E; font-weight:600; font-size:12px; } .hint-bad{ color:#B3261E; font-weight:600; font-size:12px; }

  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(20,22,26,.55); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:24px 14px; overflow:auto; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--card-bg); border:1.5px solid var(--ink); box-shadow:5px 5px 0 rgba(34,38,43,.25); width:100%; max-width:760px; padding:18px 22px 16px; }
  .modal h2{ font-family:'Oswald',sans-serif; margin:0 0 4px; font-size:21px; }
  .fld{ margin-bottom:10px; } .fld label{ display:block; font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:.6px; color:var(--ink-soft); margin-bottom:3px; text-transform:uppercase; }
  .fld input,.fld select,.fld textarea{ width:100%; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; } .grid2{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(max-width:700px){ .grid3,.grid2{ grid-template-columns:1fr; } }
  .secbox{ border:1.3px solid var(--board-line); padding:10px 12px; margin:10px 0; background:#fff; }
  .secbox h4{ margin:0 0 8px; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); }
  .total{ font-family:'Oswald',sans-serif; font-size:18px; }
  .log{ font-size:12px; color:var(--ink-soft); max-height:110px; overflow:auto; margin-top:6px; }
  .err{ color:#B3261E; font-weight:600; font-size:12.5px; min-height:16px; margin:6px 0; }
  .actions{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .actions .spacer{ flex:1; }

  /* messages */
  .msg{ background:var(--card-bg); border:1.5px solid var(--ink); border-left-width:7px; border-left-color:var(--board-line); padding:10px 14px; margin-bottom:10px; box-shadow:var(--shadow); }
  .msg.new{ border-left-color:var(--accent); } .msg.read{ border-left-color:var(--warn-line); } .msg.done{ opacity:.7; }
  .msg .mh{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); }
  .msg .mt{ margin:6px 0; white-space:pre-wrap; font-size:14px; }
  .reply{ margin:6px 0 0 14px; padding:6px 10px; border-left:3px solid var(--board-line); font-size:13px; white-space:pre-wrap; }
  .cat{ font-weight:600; color:var(--ink); }

  /* setup */
  .cl-block{ margin-bottom:14px; } .cl-head{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .cl-head input{ font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; width:280px; }
  .loc-row{ display:flex; gap:8px; align-items:center; margin:3px 0 3px 18px; } .loc-row input.nm{ width:300px; } .loc-row.off input.nm{ opacity:.5; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; font-size:13px; z-index:99; display:none; }
  .empty{ padding:30px; text-align:center; color:var(--ink-soft); border:1.5px dashed var(--board-line); background:rgba(255,253,248,.5); }

  /* billing */
  table.bill{ border-collapse:collapse; width:100%; min-width:900px; font-size:13px; }
  table.bill th{ background:var(--header-bg); color:var(--header-text); font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; text-align:left; padding:7px 9px; }
  table.bill td{ border-top:1px solid var(--board-line); padding:6px 9px; vertical-align:top; }
  table.bill td.n, table.bill th.n{ text-align:right; white-space:nowrap; }
  table.bill tr.cl td{ background:#E7E2D4; font-family:'Oswald',sans-serif; font-weight:600; border-top:2px solid var(--ink); }
  .miss{ color:#B3261E; font-weight:600; }

  #printRoot{ display:none; }
  @media print{
    @page{ size:letter landscape; margin:.5in; }
    body.printing{ background:#fff !important; }
    body.printing > *:not(#printRoot){ display:none !important; }
    body.printing #printRoot{ display:block !important; }
  }
  .pr{ font-family:'IBM Plex Sans',Arial,sans-serif; color:#111; font-size:11px; }
  .pr h1{ font-family:'Oswald',Arial,sans-serif; font-size:22px; margin:0 0 2px; } .pr .sub{ color:#555; margin-bottom:12px; }
  .pr table{ width:100%; border-collapse:collapse; margin-bottom:10px; } .pr th{ background:#20242B; color:#fff; text-align:left; padding:5px 7px; font-size:10.5px; }
  .pr td{ border-bottom:1px solid #ccc; padding:5px 7px; vertical-align:top; } .pr td.n,.pr th.n{ text-align:right; white-space:nowrap; }
  .pr .pg{ page-break-before:always; } .pr .pg:first-child{ page-break-before:auto; }
  .pr tr.sub td{ font-weight:700; border-top:2px solid #111; background:#f1efe8; } .pr tr{ page-break-inside:avoid; }
  .pr h2{ font-family:'Oswald',Arial,sans-serif; font-size:16px; margin:0 0 6px; } .pr .foot{ margin-top:14px; color:#555; font-size:10.5px; white-space:pre-wrap; }
</style>
</head>

function el(tag, attrs){
  const e = document.createElement(tag);

    const v = attrs[k]; if(v == null || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k === 'text') e.textContent = v;
    else if(k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if(k === 'value') e.value = v;
    else if(k === 'checked') e.checked = !!v;
    else if(k === 'disabled') e.disabled = !!v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for(let i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(c=>{ if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  }
  return e;
}

const commitFns = new Set();
function getIn(path){ let o = doc; for(const k of path){ if(o == null || typeof o !== 'object') return undefined; o = o[k]; } return o; }
function localSet(path, val){
  let o = doc;
  for(let i=0;i<path.length-1;i++){ const k = path[i]; if(!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }
  o[path[path.length-1]] = val;
}
function localDel(path){
  let o = doc;
  for(let i=0;i<path.length-1;i++){ o = o && o[path[i]]; if(!o || typeof o !== 'object') return; }
  delete o[path[path.length-1]];

async function api(ops){
  const r = await fetch('/api/camlog', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ops }), keepalive: ops.length < 40 });

}
async function flush(){
  commitFns.forEach(f=>{ try{ f(); }catch(e){} });
  if(inflight || !queue.length) return;
  inflight = true;
  const batch = queue.splice(0, queue.length);
  try{
    const r = await api(batch);
    if(r.status >= 400 && r.status < 500){ toast('Something could not be saved (rejected by server).'); }
    else if(!r.ok) throw new Error('http '+r.status);
    else { const j = await r.json(); if(rev >= 0 && j.rev !== rev + 1) needPull = true; rev = j.rev; online = true; }
  }catch(e){ queue = batch.concat(queue); online = false; inflight = false; setSync(); schedule(3000); return; }
  inflight = false; online = true; setSync();
  if(queue.length) schedule(50); else if(needPull){ needPull = false; pull(true); }

let lastActivity = 0;
['input','keydown','focusin','change'].forEach(ev=>document.addEventListener(ev, ()=>{ lastActivity = Date.now(); }, true));
function isTyping(){
  const a = document.activeElement;

}
async function pull(force){
  if(inflight || queue.length) return;
  try{
    const r = await fetch('/api/camlog' + (force || rev < 0 ? '' : '?since='+rev), { cache:'no-store' });
    const j = await r.json(); online = true;
    if(!j.changed && !force && rev >= 0){ setSync(); return; }
    if(inflight || queue.length) return;        // local edits appeared while we waited; try again later
    if(isTyping() && rev >= 0){ deferred = true; return; }
    const first = rev < 0;
    doc = j.doc || {}; rev = j.rev; deferred = false;
    if(first && j.rev === 0 && !Object.keys(doc).length && SEED){
      await api([{ op:'init', value: SEED }]); return pull(true);
    }
    setSync(); renderAll();
  }catch(e){ online = false; setSync(); }
}

  for(const d of dayKeysDesc()){ if(d >= date) continue; const r = dayRows(d)[siteId]; if(r && r.down != null) return { date:d, rec:r }; }
  return null;
}
function latestEntries(){
  const out = {};

const OPEN = ['reported','scheduled'];

  const out = []; let cur = '', depth = 0;

function paintRow(tr, site, date){

  tr.classList.toggle('bad', rec.down > 0);
  const ac = tr.querySelector('td.ac'); ac.innerHTML = '';
  const prev = prevEntry(site.id, date);
  if(rec.down == null && prev && prev.rec.down > 0){
    ac.append(el('button', { class:'btn small', title:'Copy count and notes from the last check', text:'↺ Same as '+fmtShort(prev.date)+' ('+prev.rec.down+' down)', onclick:()=>{
      setP(['days', date, 'rows', site.id, 'down'], prev.rec.down);
      if(prev.rec.notes) setP(['days', date, 'rows', site.id, 'notes'], prev.rec.notes);
      if(date === todayStr()) setP(['days', date, 'rows', site.id, 'time'], nowTime());
      stampBy(date, site.id); renderAll();
    } }));
  }
  if(rec.down > 0){
    const t = openTicketFor(site.id);
    if(t){
      ac.append(el('div', {}, el('span', { class:'pill '+t.status, text: STAT[t.status] }), ' ', el('a', { class:'link', text: tnum(t), onclick:()=>openTicketModal(t.id) })));

    } else {

      } }));
    }

function byClient(list){
  const m = {}; list.forEach(t=>{ (m[t.client] = m[t.client] || []).push(t); });
  return Object.keys(m).sort((a,b)=>a.localeCompare(b)).map(c=>({ client:c, items:m[c].sort((a,b)=>String(a.completedDate||'').localeCompare(String(b.completedDate||''))||(a.num||0)-(b.num||0)) }));
}
function renderBilling(v){
  const ready = readyTickets();
  const batches = Object.values(doc.batches || {}).sort((a,b)=>b.ts-a.ts);
  ready.forEach(t=>{ if(S.billSel[t.id] === undefined) S.billSel[t.id] = true; });
  const chosen = ()=>ready.filter(t=>S.billSel[t.id]);
  v.append(el('p', { class:'muted', style:'margin:0 0 12px', text:'Completed, billable service calls land here. Check the ones for this billing run, export the PDF for accounts payable, then create a batch so they are marked billed and never double-billed.' }));
  if(!(Number(settings().defaultRate) > 0)) v.append(el('div', { class:'banner warn' }, el('b', { text:'No default hourly rate set.' }), el('span', { text:'Totals use each ticket’s own rate, or $0.00. Set the default on the Setup tab.' })));
  if(!ready.length){ v.append(el('div', { class:'empty', text:'Nothing is waiting to be billed. Tickets appear here when they are marked completed.' })); }
  else {
    const foot = el('div', { class:'chips', style:'margin:12px 0' });
    const paint = ()=>{ const c = chosen(); foot.innerHTML = ''; foot.append(el('span', { class:'chip', text:c.length+' selected' }), el('span', { class:'chip ok', text:'Total '+money(c.reduce((a,t)=>a+totalOf(t),0)) })); expBtn.disabled = batchBtn.disabled = !c.length; };
    const expBtn = el('button', { class:'btn', text:'Preview / export PDF', title:'Opens the print dialog — choose “Save as PDF”. Does not change any ticket.', onclick:()=>printBilling(chosen(), 'Draft — not yet batched') });
    const batchBtn = el('button', { class:'btn accent', text:'Create billing batch & export PDF', onclick:()=>{
      const c = chosen(); if(!c.length) return;
      const missing = c.filter(t=>!(Number(t.hours) > 0) || !(rateOf(t) > 0)).length;
      if(missing && !confirm(missing+' selected ticket'+(missing === 1 ? ' has' : 's have')+' no hours or no rate (total $0.00). Continue anyway?')) return;
      const label = prompt('Name for this billing batch:', 'AP '+todayStr()); if(label === null) return;
      const bid = 'b'+uid(), ts = Date.now();
      setP(['batches', bid], { id:bid, label: label.trim() || 'AP '+todayStr(), ts, by: myName(), ticketIds: c.map(t=>t.id), total: c.reduce((a,t)=>a+totalOf(t),0) });
      c.forEach(t=>{ setP(['tickets', t.id, 'status'], 'billed'); setP(['tickets', t.id, 'batchId'], bid); setP(['tickets', t.id, 'billedDate'], todayStr()); addLog(t.id, 'Added to billing batch "'+(label.trim() || 'AP '+todayStr())+'"'); });
      const lbl = label.trim() || 'AP '+todayStr(); const snapshot = c.slice();
      c.forEach(t=>{ delete S.billSel[t.id]; });
      renderAll(); printBilling(snapshot, lbl);
    } });
    const all = el('input', { type:'checkbox', checked:true, 'aria-label':'Select all' });
    all.addEventListener('change', ()=>{ ready.forEach(t=>{ S.billSel[t.id] = all.checked; }); document.querySelectorAll('input.bsel').forEach(i=>{ i.checked = all.checked; }); paint(); });
    const tbody = el('tbody');
    byClient(ready).forEach(g=>{
      tbody.append(el('tr', { class:'cl' }, el('td', { colspan:'11', text:g.client+'  ·  '+money(g.items.reduce((a,t)=>a+totalOf(t),0)) })));
      g.items.forEach(t=>{
        const cb = el('input', { type:'checkbox', class:'bsel', checked: !!S.billSel[t.id] });
        cb.addEventListener('change', ()=>{ S.billSel[t.id] = cb.checked; paint(); });
        tbody.append(el('tr', {},
          el('td', {}, cb), el('td', {}, el('a', { class:'link', text:tnum(t), onclick:()=>openTicketModal(t.id) })), el('td', { text:t.location }),
          el('td', { text:String(t.cameras||'').split('\n').filter(Boolean).join('; ') }), el('td', { text:fmtShort(t.completedDate) }), el('td', { text:t.tech || '' }),
          el('td', { class:'n'+(Number(t.hours) > 0 ? '' : ' miss'), text: Number(t.hours) > 0 ? String(t.hours) : '—' }),
          el('td', { class:'n'+(rateOf(t) > 0 ? '' : ' miss'), text: rateOf(t) > 0 ? money(rateOf(t)) : '—' }),
          el('td', { class:'n', text:money(Number(t.materials)||0) }), el('td', { class:'n', text:money(totalOf(t)) }), el('td', { text:t.po || '' })));
      });
    });
    v.append(el('div', { class:'tbl-wrap' }, el('table', { class:'bill' },
      el('thead', {}, el('tr', {}, el('th', {}, all), el('th', { text:'Ticket' }), el('th', { text:'Location' }), el('th', { text:'Cameras serviced' }), el('th', { text:'Completed' }), el('th', { text:'Tech' }), el('th', { class:'n', text:'Hours' }), el('th', { class:'n', text:'Rate' }), el('th', { class:'n', text:'Materials' }), el('th', { class:'n', text:'Total' }), el('th', { text:'PO #' }))), tbody)));
    v.append(foot, el('div', { class:'actions', style:'justify-content:flex-start' }, expBtn, batchBtn));
    paint();
  }
  v.append(el('h2', { class:'sec', text:'Past billing batches' }));
  if(!batches.length) v.append(el('div', { class:'empty', text:'No batches yet.' }));
  batches.forEach(b=>{
    const items = (b.ticketIds || []).map(id=>doc.tickets && doc.tickets[id]).filter(Boolean);
    v.append(el('div', { class:'card', style:'margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap' },
      el('div', { style:'flex:1;min-width:220px' }, el('b', { text:b.label }), el('div', { class:'muted', text:new Date(b.ts).toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' })+(b.by ? ' · '+b.by : '')+' · '+items.length+' ticket'+(items.length === 1 ? '' : 's')+' · '+money(items.reduce((a,t)=>a+totalOf(t),0)) })),
      el('button', { class:'btn small', text:'Re-export PDF', onclick:()=>printBilling(items, b.label, new Date(b.ts)) }),
      el('button', { class:'btn small danger', text:'Undo batch', title:'Puts these tickets back to “Ready to bill”', onclick:()=>{
        if(!confirm('Undo "'+b.label+'"? Its '+items.length+' tickets go back to Ready to bill.')) return;
        items.forEach(t=>{ if(t.status === 'billed'){ setP(['tickets', t.id, 'status'], 'completed'); delP(['tickets', t.id, 'batchId']); delP(['tickets', t.id, 'billedDate']); addLog(t.id, 'Billing batch "'+b.label+'" undone'); } });
        delP(['batches', b.id]); renderAll();
      } })));
  });
}
function printBilling(items, label, when){
  if(!items.length){ toast('Nothing to export.'); return; }
  const groups = byClient(items); const st = settings(); const stamp = (when || new Date()).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
  const grand = items.reduce((a,t)=>a+totalOf(t),0);
  const head = (sub)=>'<h1>NCD Communications — Billable Service Summary</h1><div class="sub">'+esc(label)+' · '+esc(stamp)+(st.preparedBy || myName() ? ' · Prepared by '+esc(st.preparedBy || myName()) : '')+(sub ? ' · '+esc(sub) : '')+'</div>';
  let h = '<div class="pr"><div class="pg">'+head('All organizations');
  h += '<table><thead><tr><th>Organization</th><th class="n">Service calls</th><th class="n">Hours</th><th class="n">Labor</th><th class="n">Materials</th><th class="n">Total</th></tr></thead><tbody>';
  groups.forEach(g=>{
    const hrs = g.items.reduce((a,t)=>a+(Number(t.hours)||0),0), lab = g.items.reduce((a,t)=>a+laborOf(t),0), mat = g.items.reduce((a,t)=>a+(Number(t.materials)||0),0);
    h += '<tr><td>'+esc(g.client)+'</td><td class="n">'+g.items.length+'</td><td class="n">'+hrs+'</td><td class="n">'+money(lab)+'</td><td class="n">'+money(mat)+'</td><td class="n">'+money(lab+mat)+'</td></tr>';
  });
  h += '<tr class="sub"><td>Grand total</td><td class="n">'+items.length+'</td><td class="n">'+items.reduce((a,t)=>a+(Number(t.hours)||0),0)+'</td><td class="n">'+money(items.reduce((a,t)=>a+laborOf(t),0))+'</td><td class="n">'+money(items.reduce((a,t)=>a+(Number(t.materials)||0),0))+'</td><td class="n">'+money(grand)+'</td></tr></tbody></table>';
  if(st.footer) h += '<div class="foot">'+esc(st.footer)+'</div>';
  h += '</div>';
  groups.forEach(g=>{
    h += '<div class="pg">'+head(g.client)+'<h2>'+esc(g.client)+'</h2><table><thead><tr><th>Ticket</th><th>Location</th><th>Cameras serviced</th><th>Service date</th><th>Technician</th><th class="n">Hours</th><th class="n">Rate</th><th class="n">Labor</th><th class="n">Materials</th><th class="n">Total</th><th>PO #</th></tr></thead><tbody>';
    g.items.forEach(t=>{
      h += '<tr><td>'+esc(tnum(t))+'</td><td>'+esc(t.location)+'</td><td>'+esc(String(t.cameras||'').split('\n').filter(Boolean).join('; '))+(t.workDone ? '<br><i>'+esc(t.workDone)+'</i>' : '')+'</td><td>'+esc(fmtShortY(t.completedDate))+'</td><td>'+esc(t.tech||'')+'</td><td class="n">'+esc(t.hours||'')+'</td><td class="n">'+money(rateOf(t))+'</td><td class="n">'+money(laborOf(t))+'</td><td class="n">'+money(Number(t.materials)||0)+'</td><td class="n">'+money(totalOf(t))+'</td><td>'+esc(t.po||'')+'</td></tr>';
    });
    h += '<tr class="sub"><td colspan="9">Subtotal — '+esc(g.client)+'</td><td class="n">'+money(g.items.reduce((a,t)=>a+totalOf(t),0))+'</td><td></td></tr></tbody></table>';
    if(st.footer) h += '<div class="foot">'+esc(st.footer)+'</div>';
    h += '</div>';
  });
  h += '</div>';
  $('#printRoot').innerHTML = h;
  document.body.classList.add('printing');
  const done = ()=>{ document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(()=>window.print(), 80);
}

// ================= SETUP =================
function saveOrder(list){ list.forEach((s,i)=>{ if(s.order !== i+1) setP(['sites', s.id, 'order'], i+1); }); }
function flatFromGroups(groups){ return groups.reduce((a,g)=>a.concat(g.sites), []); }
function moveSite(site, dir){
  const groups = clientGroups(sitesAll()); const g = groups.find(x=>x.client === site.client); const i = g.sites.findIndex(s=>s.id === site.id); const j = i+dir;
  if(j < 0 || j >= g.sites.length) return; [g.sites[i], g.sites[j]] = [g.sites[j], g.sites[i]]; saveOrder(flatFromGroups(groups)); renderAll();
}
function moveClient(client, dir){
  const groups = clientGroups(sitesAll()); const i = groups.findIndex(x=>x.client === client); const j = i+dir;
  if(j < 0 || j >= groups.length) return; [groups[i], groups[j]] = [groups[j], groups[i]]; saveOrder(flatFromGroups(groups)); renderAll();
}
function addSite(client, name){
  const site = { id:'s'+uid(), client, name, order:0, active:true };
  setP(['sites', site.id], site);
  const groups = clientGroups(sitesAll().filter(s=>s.id !== site.id));
  const g = groups.find(x=>x.client === client);
  if(g) g.sites.push(site); else groups.push({ client, sites:[site] });
  saveOrder(flatFromGroups(groups));
}
function renderSetup(v){
  const st = settings();
  const set = (key, val)=>{ setP(['settings', key], val); };
  const rate = el('input', { type:'number', step:'0.01', min:'0', value: st.defaultRate || '', placeholder:'e.g. 125.00' });
  rate.addEventListener('change', ()=>set('defaultRate', rate.value === '' ? 0 : Number(rate.value)));
  const prep = el('input', { type:'text', value: st.preparedBy || '', placeholder:'Name shown on the billing PDF' });
  prep.addEventListener('change', ()=>set('preparedBy', prep.value.trim()));
  const foot = el('textarea', { rows:'3', style:'width:100%', placeholder:'Optional text printed at the bottom of each PDF page (remit-to, terms, contact…)' }); foot.value = st.footer || '';
  foot.addEventListener('change', ()=>set('footer', foot.value));
  v.append(el('div', { class:'card' }, el('h2', { class:'sec', style:'margin-top:0', text:'Billing settings' }),
    el('div', { class:'grid2' }, el('div', { class:'fld' }, el('label', { text:'Default hourly rate ($)' }), rate), el('div', { class:'fld' }, el('label', { text:'Prepared by (PDF)' }), prep)),
    el('div', { class:'fld' }, el('label', { text:'PDF footer note' }), foot)));
  v.append(el('h2', { class:'sec', text:'Clients & locations' }), el('p', { class:'muted', style:'margin:0 0 10px', text:'This is the list the daily check is built from. Hiding a location keeps its history but removes it from the daily sheet.' }));
  const groups = clientGroups(sitesAll());
  groups.forEach((g, gi)=>{
    const nm = el('input', { type:'text', value:g.client });
    nm.addEventListener('change', ()=>{ const val = nm.value.trim(); if(!val){ nm.value = g.client; return; } g.sites.forEach(s=>setP(['sites', s.id, 'client'], val)); renderAll(); });
    const blk = el('div', { class:'card cl-block' });
    blk.append(el('div', { class:'cl-head' }, nm, el('button', { class:'btn small', text:'▲', disabled: gi === 0, onclick:()=>moveClient(g.client, -1) }), el('button', { class:'btn small', text:'▼', disabled: gi === groups.length-1, onclick:()=>moveClient(g.client, 1) })));
    g.sites.forEach((s, si)=>{
      const sn = el('input', { type:'text', class:'nm', value:s.name });
      sn.addEventListener('change', ()=>{ const val = sn.value.trim(); if(!val){ sn.value = s.name; return; } setP(['sites', s.id, 'name'], val); });
      const act = el('input', { type:'checkbox', checked: s.active !== false });
      act.addEventListener('change', ()=>{ setP(['sites', s.id, 'active'], act.checked); renderAll(); });
      blk.append(el('div', { class:'loc-row'+(s.active === false ? ' off' : '') }, sn, el('label', { class:'muted' }, act, ' Active'),
        el('button', { class:'btn small', text:'▲', disabled: si === 0, onclick:()=>moveSite(s, -1) }), el('button', { class:'btn small', text:'▼', disabled: si === g.sites.length-1, onclick:()=>moveSite(s, 1) })));
    });
    const add = el('input', { type:'text', placeholder:'New location name…', style:'width:300px' });
    const go = ()=>{ const val = add.value.trim(); if(!val) return; addSite(g.client, val); renderAll(); };
    add.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); go(); } });
    blk.append(el('div', { class:'loc-row' }, add, el('button', { class:'btn small', text:'+ Add location', onclick:go })));
    v.append(blk);
  });
  const nc = el('input', { type:'text', placeholder:'New client / district name' }), nl = el('input', { type:'text', placeholder:'First location' });
  v.append(el('div', { class:'card' }, el('b', { text:'Add a client' }), el('div', { style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:8px' }, nc, nl,
    el('button', { class:'btn', text:'+ Add client', onclick:()=>{ if(!nc.value.trim() || !nl.value.trim()){ toast('Enter a client and a first location.'); return; } addSite(nc.value.trim(), nl.value.trim()); renderAll(); } }))));
}

// ================= INIT =================
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click', ()=>showTab(b.dataset.tab)));
const whoInput = $('#whoName'); whoInput.value = myName();
whoInput.addEventListener('change', ()=>{ try{ localStorage.setItem('camlog-name', whoInput.value.trim()); }catch(e){} });
$('#ovl').addEventListener('mousedown', e=>{ if(e.target.id === 'ovl') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && $('#ovl').classList.contains('open')) closeModal(); });

fetch('/api/board', { cache:'no-store' }).then(r=>r.json()).then(j=>{
  const b = JSON.parse(j.value || '{}'); const dl = $('#techList');
  (b.techs || []).map(t=>t.name).filter(Boolean).sort().forEach(n=>dl.append(el('option', { value:n })));
